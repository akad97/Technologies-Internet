DEMOS.tcpudp = {
  title: 'TCP contre UDP sur un réseau qui perd des paquets', desc: 'Le message « BONJOUR! » est découpé en 8 paquets d’un caractère. Réglez le taux de perte puis comparez ce que reçoit le destinataire avec TCP et avec UDP.',
  render(el) {
    el.innerHTML = `<div class="row"><label for="tuLoss" class="lbl" style="margin:0">Taux de perte : <b id="tuLv">25</b> %</label><input type="range" id="tuLoss" min="0" max="60" step="5" value="25"><label class="small"><input type="checkbox" id="tuOrd" checked> le réseau peut désordonner</label>
      <button class="btn pri" data-p="tcp">Envoyer en TCP</button><button class="btn pri" data-p="udp">Envoyer en UDP</button></div>
      <div class="grid2" style="margin-top:12px"><div><div class="seq-cols"><span class="ep">Client</span><span></span><span class="ep">Serveur</span></div><div class="seq" id="tuSeq" style="max-height:330px;overflow:auto"></div></div>
      <div class="stack" style="gap:10px"><div><b class="small">Paquets reçus, dans l’ordre d’arrivée</b><div class="pkts" id="tuRx"></div></div><div><b class="small">Message reconstitué par l’application</b><div class="term" id="tuOut" style="min-height:0;font-size:1.3rem;letter-spacing:.2em"></div></div><div id="tuSum" class="small"></div></div></div>`;
    const msg = 'BONJOUR!'.split('');
    $('#tuLoss', el).oninput = e => $('#tuLv', el).textContent = e.target.value;
    let running = false;
    const arrow = (dir, label, lost) => { const d = document.createElement('div'); d.className = `seq-arrow ${dir} ${lost ? 'lost' : ''}`; d.innerHTML = `<div class="ln"></div><span class="lab">${label}${lost ? ' ✗ perdu' : ''}</span>`; $('#tuSeq', el).appendChild(d); d.scrollIntoView({ block: 'nearest' }); };
    const note = t => { const d = document.createElement('div'); d.className = 'small muted'; d.style.textAlign = 'center'; d.innerHTML = t; $('#tuSeq', el).appendChild(d); };
    const pkt = (t, cls) => { const s = document.createElement('span'); s.className = 'pkt ' + (cls || ''); s.textContent = t; $('#tuRx', el).appendChild(s); };
    const run = async proto => {
      if (running) return; running = true;
      $('#tuSeq', el).innerHTML = ''; $('#tuRx', el).innerHTML = ''; $('#tuOut', el).textContent = ''; $('#tuSum', el).innerHTML = '';
      const loss = +$('#tuLoss', el).value / 100, reorder = $('#tuOrd', el).checked;
      const lost = () => Math.random() < loss;
      let sent = 0, t0 = 0;
      if (proto === 'tcp') {
        arrow('l2r', 'SYN seq=0'); await sleep(300); arrow('r2l', 'SYN-ACK seq=0 ack=1'); await sleep(300); arrow('l2r', 'ACK ack=1'); note('Connexion établie'); await sleep(300);
        const got = [];
        for (let i = 0; i < msg.length; i++) {
          let tries = 0;
          while (true) {
            tries++; sent++;
            const l = tries < 6 && lost();
            arrow('l2r', `seq=${i + 1} « ${msg[i]} »${tries > 1 ? ' (retransmis)' : ''}`, l); await sleep(280);
            if (l) { note('⏱ délai dépassé, pas d’ACK : on retransmet'); t0++; await sleep(250); continue; }
            pkt(msg[i], tries > 1 ? 'retx' : ''); got.push(msg[i]); $('#tuOut', el).textContent = got.join('');
            arrow('r2l', `ACK ack=${i + 2}`); await sleep(200); break;
          }
        }
        arrow('l2r', 'FIN'); await sleep(200); arrow('r2l', 'ACK + FIN'); await sleep(200); arrow('l2r', 'ACK'); note('Connexion fermée');
        $('#tuSum', el).innerHTML = `<div class="fb ok"><b>Message complet et dans l’ordre.</b> ${sent} segments de données envoyés pour 8 utiles (${t0} retransmission${t0 > 1 ? 's' : ''}), plus 7 messages de contrôle. Fiabilité garantie, au prix du temps et de la bande passante.</div>`;
      } else {
        const arr = [];
        for (let i = 0; i < msg.length; i++) { sent++; const l = lost(); arrow('l2r', `datagramme ${i + 1} « ${msg[i]} »`, l); await sleep(220); if (!l) arr.push(i); }
        let order = arr.slice();
        if (reorder && order.length > 2) { for (let k = 0; k < 2; k++) { const a = Math.floor(Math.random() * (order.length - 1));[order[a], order[a + 1]] = [order[a + 1], order[a]]; } }
        note('Aucun accusé, aucune retransmission');
        const out = [];
        for (const i of order) { pkt(msg[i], ''); out.push(msg[i]); $('#tuOut', el).textContent = out.join(''); await sleep(150); }
        const miss = msg.length - arr.length, dis = order.some((v, k) => k > 0 && v < order[k - 1]);
        $('#tuSum', el).innerHTML = `<div class="fb ${miss || dis ? 'bad' : 'ok'}"><b>${miss ? miss + ' caractère(s) perdu(s)' : 'Aucune perte cette fois'}${dis ? ', et des caractères arrivés dans le désordre' : ''}.</b> 8 datagrammes envoyés, aucun message de contrôle : rapide et léger, mais c’est à l’application de gérer les trous. Pour de la voix ou de la vidéo en direct, un trou passe presque inaperçu.</div>`;
      }
      running = false;
    };
    $$('[data-p]', el).forEach(b => b.onclick = () => run(b.dataset.p));
  }
};

/* ---------- 02 · Calculatrice IPv4 ---------- */
const IP4 = {
  parse(s) { const p = s.trim().split('.'); if (p.length !== 4 || p.some(x => !/^\d{1,3}$/.test(x) || +x > 255)) return null; return p.reduce((a, x) => (a * 256) + +x, 0); },
  str(n) { return [24, 16, 8, 0].map(s => (n >>> s) & 255).join('.'); },
  mask(p) { return p === 0 ? 0 : (0xFFFFFFFF << (32 - p)) >>> 0; }
};

/* ---------- 02 · IPv6 ---------- */
const IP6 = {
  expand(s) {
    s = s.trim().toLowerCase(); if (!/^[0-9a-f:]+$/.test(s) || (s.match(/::/g) || []).length > 1) return null;
    let [a, b] = s.includes('::') ? s.split('::') : [s, null];
    const A = a ? a.split(':') : [], B = b ? b.split(':') : [];
    if ([...A, ...B].some(g => g.length === 0 || g.length > 4)) return null;
    let groups;
    if (b === null) { if (A.length !== 8) return null; groups = A; }
    else { const fill = 8 - A.length - B.length; if (fill < 1) return null; groups = [...A, ...Array(fill).fill('0'), ...B]; }
    return groups.map(g => g.padStart(4, '0'));
  },
  compress(g) {
    const h = g.map(x => x.replace(/^0+(?=.)/, ''));
    let best = -1, bl = 0;
    for (let i = 0; i < 8;) { if (h[i] === '0') { let j = i; while (j < 8 && h[j] === '0') j++; if (j - i > bl && j - i >= 2) { best = i; bl = j - i; } i = j; } else i++; }
    if (best < 0) return h.join(':');
    return (h.slice(0, best).join(':') + '::' + h.slice(best + bl).join(':'));
  }
};

        <tr><td>Clé publique</td><td class="mono"><span class="tag ok">(e = ${e}, n = ${n})</span> diffusée à tous</td></tr><tr><td>Clé privée</td><td class="mono"><span class="tag bad">(d = ${D}, n = ${n})</span> gardée secrète</td></tr></table></div>`;
      const chars = [...$('#rsM', el).value].slice(0, 24);
      const codes = chars.map(c => BigInt(c.codePointAt(0)));
      if (codes.some(c => c >= N)) { $('#rsC', el).innerHTML = '<span class="er">Un caractère a un code ≥ n : choisissez de plus grands nombres premiers.</span>'; $('#rsS', el).innerHTML = ''; return; }
      const enc = codes.map(m => pw(m, E, N)), dec = enc.map(c => pw(c, D, N));
      $('#rsC', el).innerHTML = `<span class="dim">m = code du caractère, c = m^e mod n</span>\nclair   : ${chars.map((c, i) => `${c}=${codes[i]}`).join(' ')}\n<span class="hl">chiffré : ${enc.join(' ')}</span>\n<span class="dim">déchiffré avec d : c^d mod n</span>\n<span class="sv">→ ${dec.map(x => String.fromCodePoint(Number(x))).join('')}</span>`;
      const sig = codes.map(m => pw(m, D, N)), ver = sig.map(s => pw(s, E, N));
      $('#rsS', el).innerHTML = `<span class="dim">s = m^d mod n (seule Awa connaît d)</span>\n<span class="hl">signature : ${sig.join(' ')}</span>\n<span class="dim">vérification par tous : s^e mod n</span>\n<span class="sv">→ ${ver.map(x => String.fromCodePoint(Number(x))).join('')} ✓ authentique</span>`;
    };

    el.insertAdjacentHTML('beforeend', `<p class="small muted" style="margin:10px 0 0">Avec n = ${61 * 53}, n’importe qui retrouve p et q en une fraction de seconde : la sécurité de RSA tient à la difficulté de factoriser un n de plus de 600 chiffres. Et chiffrer lettre par lettre donne toujours le même résultat pour la même lettre : les vrais systèmes ajoutent un remplissage aléatoire.</p>`);
  }
};

/* ---------- 04 · Pare-feu ---------- */
const FW = {
  parse(txt) {
    const rules = [];
    const lines = txt.split('\n').map(l => l.trim()).filter(l => l && !l.startsWith('#'));
    for (const [i, l] of lines.entries()) {
      const p = l.split(/\s+/);
      if (p.length !== 5) return { error: `Ligne ${i + 1} : il faut 5 champs « ACTION proto source destination port », trouvé ${p.length}.` };
      const [a, pr, s, d, po] = p;
      if (!/^(allow|deny)$/i.test(a)) return { error: `Ligne ${i + 1} : l’action doit être ALLOW ou DENY.` };
      if (!/^(tcp|udp|any)$/i.test(pr)) return { error: `Ligne ${i + 1} : protocole tcp, udp ou any.` };
      for (const x of [s, d]) if (x !== 'any' && !FW.cidr(x)) return { error: `Ligne ${i + 1} : « ${x} » n’est ni une adresse IPv4, ni un réseau CIDR, ni any.` };
      if (po !== 'any' && !(/^\d+$/.test(po) && +po <= 65535)) return { error: `Ligne ${i + 1} : port invalide « ${po} ».` };
      rules.push({ n: i + 1, allow: /^allow$/i.test(a), pr: pr.toLowerCase(), s, d, po, txt: l });
    }
    return rules;
  },
  cidr(x) { const [a, b] = x.split('/'); const ip = IP4.parse(a); if (ip === null) return null; const p = b === undefined ? 32 : +b; if (!(p >= 0 && p <= 32)) return null; return [ip, p]; },
  match(rule, ip) { if (rule === 'any') return true; const [n, p] = FW.cidr(rule); const m = IP4.mask(p); return ((IP4.parse(ip) & m) >>> 0) === ((n & m) >>> 0); },
  eval(rules, pr, s, d, po) {
    for (const r of rules) if ((r.pr === 'any' || r.pr === pr) && FW.match(r.s, s) && FW.match(r.d, d) && (r.po === 'any' || +r.po === +po)) return { allow: r.allow, rule: 'règle ' + r.n };
    return { allow: false, rule: 'aucune règle : refus implicite' };
  }
};

    el.innerHTML = `<div class="mqtt"><div><b class="small">Éditeurs (capteurs)</b><div class="stack" style="gap:6px;margin-top:6px">${sensors.map((s, i) => `<button class="btn sm" data-s="${i}" style="justify-content:space-between"><span class="mono" style="font-size:.74rem">${s[0]}</span><span>PUBLISH</span></button>`).join('')}</div>
      <div class="card" style="box-shadow:none;padding:10px;margin-top:10px"><b class="small">Publication manuelle</b><input class="in mono" id="mqT" value="ferme/parcelle2/pompe/commande" style="width:100%;margin-top:6px;font-size:.8rem" aria-label="Sujet"><div class="row" style="margin-top:6px"><input class="in" id="mqV" value="MARCHE" style="width:100px" aria-label="Contenu"><select class="in" id="mqQ" aria-label="QoS"><option value="0">QoS 0</option><option value="1" selected>QoS 1</option><option value="2">QoS 2</option></select><label class="small"><input type="checkbox" id="mqR"> retain</label><button class="btn pri sm" id="mqP">Publier</button></div></div>
      <div class="row" style="margin-top:8px"><button class="btn sm" id="mqAuto">▶ Capteurs automatiques</button></div></div>
      <div class="broker">Broker<div class="small" style="font-weight:400;font-family:var(--f-body)">mqtt://broker.estm.ml:1883</div><div class="score-big" id="mqC" style="font-size:1.8rem;margin-top:8px">0</div><div class="small" style="font-weight:400">messages reçus</div><div class="small" id="mqRet" style="font-weight:400;margin-top:6px;font-family:var(--f-mono);font-size:.7rem;text-align:left"></div></div>
      <div><b class="small">Abonnés</b><div id="mqS" style="margin-top:6px"></div><div class="row"><input class="in mono" id="mqNF" placeholder="nouveau filtre, ex. +/+/energie" style="flex:1;font-size:.8rem" aria-label="Filtre du nouvel abonné"><button class="btn sm" id="mqAdd">S’abonner</button></div></div></div>
      <div class="term" id="mqLog" style="margin-top:12px;min-height:70px;max-height:150px"></div>`;
    const log = h => { $('#mqLog', el).insertAdjacentHTML('afterbegin', h + '\n'); };
    const drawSubs = () => {
      $('#mqS', el).innerHTML = subs.map((s, i) => `<div class="sub" data-i="${i}"><div class="row" style="justify-content:space-between;gap:4px"><b class="small">${esc(s.n)}</b>${i > 2 ? `<button class="btn sm" data-del="${i}" aria-label="Se désabonner">✕</button>` : ''}</div><input class="in mono" value="${esc(s.f)}" data-f="${i}" style="width:100%;font-size:.78rem;margin-top:4px" aria-label="Filtre de ${esc(s.n)}"><div class="small fv" data-v="${i}"></div><div class="inbox">${s.box.slice(-8).reverse().map(m => `<div>${esc(m)}</div>`).join('') || '<span class="muted">(rien reçu)</span>'}</div></div>`).join('');
      $$('[data-f]', el).forEach(inp => inp.onchange = () => { const i = +inp.dataset.f, f = inp.value.trim(); if (!MQTT.validFilter(f)) { $(`[data-v="${i}"]`, el).innerHTML = '<span style="color:var(--bad)">Filtre invalide : « # » seulement en dernier niveau, « + » occupe un niveau entier.</span>'; return; } subs[i].f = f; subs[i].box = []; log(`<span class="cl">SUBSCRIBE</span> ${esc(subs[i].n)} → « ${esc(f)} »`); Object.entries(retained).forEach(([t, v]) => { if (MQTT.match(f, t)) subs[i].box.push(`${t} = ${v} (retenu)`); }); drawSubs(); });
      $$('[data-del]', el).forEach(b => b.onclick = () => { subs.splice(+b.dataset.del, 1); drawSubs(); });
    };
    const publish = (t, v, q = 0, r = false) => {
      count++; $('#mqC', el).textContent = count;
      if (r) { retained[t] = v; $('#mqRet', el).innerHTML = 'Retenus :<br>' + Object.entries(retained).map(([a, b]) => esc(a + ' = ' + b)).join('<br>'); }
      const to = subs.filter(s => MQTT.match(s.f, t));
      to.forEach(s => s.box.push(`${t} = ${v}${q ? ' (QoS ' + q + ')' : ''}`));
      log(`<span class="sv">PUBLISH</span> ${esc(t)} = ${esc(v)} <span class="dim">QoS ${q}${r ? ' retain' : ''}</span> → ${to.length ? to.map(s => esc(s.n)).join(', ') : '<span class="er">aucun abonné</span>'}${q === 1 ? ' <span class="dim">· PUBACK</span>' : q === 2 ? ' <span class="dim">· PUBREC/PUBREL/PUBCOMP</span>' : ''}`);
      drawSubs();
      to.forEach(s => { const b = $(`.sub[data-i="${subs.indexOf(s)}"]`, el); if (b) { b.classList.remove('flash'); void b.offsetWidth; b.classList.add('flash'); } });
    };
    $$('[data-s]', el).forEach(b => b.onclick = () => { const s = sensors[+b.dataset.s]; publish(s[0], s[1]()); });
    $('#mqP', el).onclick = () => { const t = $('#mqT', el).value.trim(); if (!t || /[+#]/.test(t)) { toast('Un sujet de publication ne peut pas contenir de joker'); return; } publish(t, $('#mqV', el).value, +$('#mqQ', el).value, $('#mqR', el).checked); };
    $('#mqAdd', el).onclick = () => { const f = $('#mqNF', el).value.trim(); if (!MQTT.validFilter(f)) { toast('Filtre invalide'); return; } const s = { n: 'Abonné ' + (subs.length + 1), f, box: [] }; Object.entries(retained).forEach(([t, v]) => { if (MQTT.match(f, t)) s.box.push(`${t} = ${v} (retenu)`); }); subs.push(s); log(`<span class="cl">SUBSCRIBE</span> ${s.n} → « ${esc(f)} »`); $('#mqNF', el).value = ''; drawSubs(); };
    $('#mqAuto', el).onclick = e => { if (timer) { clearInterval(timer); timer = null; e.target.textContent = '▶ Capteurs automatiques'; return; } e.target.textContent = '⏸ Arrêter'; timer = setInterval(() => { if (!document.body.contains(el)) { clearInterval(timer); return; } const s = sensors[Math.floor(Math.random() * sensors.length)]; publish(s[0], s[1]()); }, 1500); };
    drawSubs(); publish('ferme/parcelle1/humidite', '23.4 %');
  }
};

/* ---------- 09 · Client REST ---------- */
DEMOS.rest = {
  title: 'Client REST : manipuler une vraie petite API', desc: 'Une API fictive https://api.estm.ml gère des étudiants en mémoire. Envoyez des requêtes comme avec Postman et observez codes, en-têtes et JSON. Les écritures exigent un jeton.',
  render(el) {
    let db = [{ id: 1, nom: 'Traoré', prenom: 'Awa', ville: 'Bamako' }, { id: 2, nom: 'Diallo', prenom: 'Moussa', ville: 'Kayes' }, { id: 3, nom: 'Coulibaly', prenom: 'Fanta', ville: 'Sikasso' }], next = 4, hits = [];
    const notes = { 1: [{ cours: 'RES', note: 16 }, { cours: 'WEB', note: 15 }], 2: [{ cours: 'RES', note: 11 }], 3: [{ cours: 'WEB', note: 14 }] };
    const P = [['Lister', 'GET', '/api/etudiants', ''], ['Filtrer', 'GET', '/api/etudiants?ville=Bamako', ''], ['Lire 2', 'GET', '/api/etudiants/2', ''], ['Notes de 1', 'GET', '/api/etudiants/1/notes', ''], ['Créer', 'POST', '/api/etudiants', '{\n  "nom": "Keïta",\n  "prenom": "Issa",\n  "ville": "Ségou"\n}'], ['Modifier (PATCH)', 'PATCH', '/api/etudiants/2', '{ "ville": "Bamako" }'], ['Supprimer 3', 'DELETE', '/api/etudiants/3', ''], ['Lire 99', 'GET', '/api/etudiants/99', ''], ['JSON cassé', 'POST', '/api/etudiants', "{ nom: 'Sow' }"]];
    el.innerHTML = `<div class="row small">${P.map((p, i) => `<button class="btn sm" data-p="${i}">${p[0]}</button>`).join('')}</div>
      <div class="row" style="margin-top:8px"><select class="in" id="rsM" aria-label="Méthode">${['GET', 'POST', 'PUT', 'PATCH', 'DELETE'].map(m => `<option>${m}</option>`).join('')}</select><span class="mono small">https://api.estm.ml</span><input class="in mono" id="rsU" value="/api/etudiants" style="flex:1;min-width:180px" aria-label="Chemin"><label class="small"><input type="checkbox" id="rsT" checked> Authorization: Bearer</label><button class="btn pri" id="rsGo">Envoyer</button></div>
      <textarea class="in" id="rsB" rows="4" spellcheck="false" placeholder="Corps JSON (POST, PUT, PATCH)" style="margin-top:8px" aria-label="Corps de la requête"></textarea>
      <div class="grid2" style="margin-top:10px"><div><b class="small">Réponse</b><div class="term" id="rsO"></div></div><div><b class="small">État de la ressource /api/etudiants</b><div class="term" id="rsDb"></div></div></div>`;
    const resp = (code, txt, body, hdr = []) => ({ code, txt, body, hdr });
    const handle = (m, url, tok, raw) => {
      const now = Date.now(); hits = hits.filter(t => now - t < 10000); hits.push(now);
      if (hits.length > 12) return resp(429, 'Too Many Requests', { erreur: 'Limite de 12 requêtes par 10 secondes dépassée.' }, ['Retry-After: 10']);
      let u; try { u = new URL(url, 'https://api.estm.ml'); } catch (e) { return resp(400, 'Bad Request', { erreur: 'URL invalide' }); }
      const seg = u.pathname.replace(/\/+$/, '').split('/').filter(Boolean);
      if (seg[0] !== 'api' || seg[1] !== 'etudiants') return resp(404, 'Not Found', { erreur: `Aucune route pour ${u.pathname}` });
      const id = seg[2] !== undefined ? +seg[2] : null;
      if (seg[2] !== undefined && !Number.isInteger(id)) return resp(400, 'Bad Request', { erreur: 'L’identifiant doit être un entier.' });
      let body = null;
      if (['POST', 'PUT', 'PATCH'].includes(m)) { if (!tok) return resp(401, 'Unauthorized', { erreur: 'Jeton manquant ou invalide.' }, ['WWW-Authenticate: Bearer']); try { body = JSON.parse(raw); } catch (e) { return resp(400, 'Bad Request', { erreur: 'JSON invalide : ' + e.message }); } if (typeof body !== 'object' || body === null || Array.isArray(body)) return resp(400, 'Bad Request', { erreur: 'Un objet JSON est attendu.' }); }
      if (m === 'DELETE' && !tok) return resp(401, 'Unauthorized', { erreur: 'Jeton manquant ou invalide.' }, ['WWW-Authenticate: Bearer']);
      if (seg[3] === 'notes') { if (m !== 'GET') return resp(405, 'Method Not Allowed', { erreur: 'Lecture seule.' }, ['Allow: GET']); return db.some(e => e.id === id) ? resp(200, 'OK', notes[id] || []) : resp(404, 'Not Found', { erreur: `Étudiant ${id} introuvable` }); }
      if (seg.length > 3) return resp(404, 'Not Found', { erreur: `Aucune route pour ${u.pathname}` });
      if (id === null) {
        if (m === 'GET') { let r = db; u.searchParams.forEach((v, k) => { r = r.filter(e => String(e[k]) === v); }); return resp(200, 'OK', r, [`X-Total-Count: ${r.length}`]); }
        if (m === 'POST') { if (!body.nom || !body.prenom) return resp(400, 'Bad Request', { erreur: 'Les champs « nom » et « prenom » sont obligatoires.' }); const e = { id: next++, nom: String(body.nom), prenom: String(body.prenom), ville: body.ville ? String(body.ville) : null }; db.push(e); return resp(201, 'Created', e, [`Location: /api/etudiants/${e.id}`]); }
        return resp(405, 'Method Not Allowed', { erreur: `${m} n’est pas permis sur la collection.` }, ['Allow: GET, POST']);
      }
      const i = db.findIndex(e => e.id === id);
      if (m === 'POST') return resp(405, 'Method Not Allowed', { erreur: 'POST se fait sur la collection /api/etudiants.' }, ['Allow: GET, PUT, PATCH, DELETE']);
      if (i < 0) return resp(404, 'Not Found', { erreur: `Étudiant ${id} introuvable` });
      if (m === 'GET') return resp(200, 'OK', db[i]);
      if (m === 'DELETE') { db.splice(i, 1); return resp(204, 'No Content', null); }
      if (m === 'PUT') { if (!body.nom || !body.prenom) return resp(400, 'Bad Request', { erreur: 'PUT remplace toute la ressource : nom et prenom sont obligatoires.' }); db[i] = { id, nom: String(body.nom), prenom: String(body.prenom), ville: body.ville ? String(body.ville) : null }; return resp(200, 'OK', db[i]); }
      if (m === 'PATCH') { ['nom', 'prenom', 'ville'].forEach(k => { if (k in body) db[i][k] = body[k] === null ? null : String(body[k]); }); return resp(200, 'OK', db[i]); }
    };
    const showDb = () => $('#rsDb', el).innerHTML = esc(JSON.stringify(db, null, 2));
    const go = () => {
      const m = $('#rsM', el).value, url = $('#rsU', el).value.trim(), tok = $('#rsT', el).checked, raw = $('#rsB', el).value;
      const r = handle(m, url, tok, raw);
      const cls = r.code < 300 ? 'sv' : r.code < 500 ? 'er' : 'er';
      $('#rsO', el).innerHTML = `<span class="dim">${m} ${esc(url)}</span>\n<span class="${cls}">HTTP/1.1 ${r.code} ${r.txt}</span>\n${r.hdr.map(esc).join('\n')}${r.hdr.length ? '\n' : ''}${r.body !== null ? 'Content-Type: application/json\n\n' + esc(JSON.stringify(r.body, null, 2)) : '<span class="dim">(pas de corps)</span>'}`;
      showDb();
    };
    $$('[data-p]', el).forEach(b => b.onclick = () => { const p = P[+b.dataset.p]; $('#rsM', el).value = p[1]; $('#rsU', el).value = p[2]; $('#rsB', el).value = p[3]; go(); });
    $('#rsGo', el).onclick = go; showDb(); go();
  }
};

/* ---------- 09 · JSON et XML ---------- */
DEMOS.json = {
  title: 'Valider un JSON et le comparer à XML', desc: 'Collez un JSON : l’outil le valide, le reformate et produit la version XML équivalente. Comparez la taille et la lisibilité des deux formats.',
  render(el) {
    const sample = '{\n  "etudiant": {\n    "id": 42,\n    "nom": "Traoré",\n    "prenom": "Awa",\n    "boursiere": true,\n    "notes": [15, 17.5, 12],\n    "adresse": { "ville": "Bamako", "quartier": "Hamdallaye" }\n  }\n}';
    el.innerHTML = `<div class="row small"><button class="btn sm" id="jsF">Formater</button><button class="btn sm" id="jsMn">Minifier</button><button class="btn sm" id="jsBad">Exemple invalide</button><button class="btn sm" id="jsOk">Exemple valide</button></div>
      <div class="grid2" style="margin-top:8px"><div><textarea class="in" id="jsI" rows="13" spellcheck="false" aria-label="JSON"></textarea><div id="jsS"></div></div><div><b class="small">Équivalent XML</b><div class="term" id="jsX" style="max-height:300px"></div><div class="small muted" id="jsZ"></div></div></div>`;
    const ta = $('#jsI', el); ta.value = sample;
    const toXml = (k, v, ind = '') => { const tag = String(k).replace(/[^\wÀ-ſ-]/g, '_').replace(/^(\d)/, '_$1'); if (Array.isArray(v)) return v.map(x => toXml(tag, x, ind)).join('\n'); if (v && typeof v === 'object') return `${ind}<${tag}>\n${Object.entries(v).map(([a, b]) => toXml(a, b, ind + '  ')).join('\n')}\n${ind}</${tag}>`; return `${ind}<${tag}>${v === null ? '' : String(v).replace(/&/g, '&amp;').replace(/</g, '&lt;')}</${tag}>`; };
    const go = () => {
      let o; try { o = JSON.parse(ta.value); } catch (e) { $('#jsS', el).innerHTML = `<div class="fb bad small"><b>JSON invalide.</b> ${esc(e.message)}<br>Vérifiez : guillemets doubles autour des clés et des chaînes, pas de virgule après le dernier élément, pas de commentaire.</div>`; $('#jsX', el).innerHTML = ''; $('#jsZ', el).textContent = ''; return null; }
      const types = new Set(); const walk = v => { types.add(v === null ? 'null' : Array.isArray(v) ? 'tableau' : typeof v === 'object' ? 'objet' : { string: 'chaîne', number: 'nombre', boolean: 'booléen' }[typeof v]); if (v && typeof v === 'object') Object.values(v).forEach(walk); }; walk(o);
      $('#jsS', el).innerHTML = `<div class="fb ok small"><b>JSON valide.</b> Types présents : ${[...types].join(', ')}.</div>`;
      const xml = '<?xml version="1.0" encoding="utf-8"?>\n' + (o && typeof o === 'object' && !Array.isArray(o) && Object.keys(o).length === 1 ? toXml(Object.keys(o)[0], Object.values(o)[0]) : toXml('racine', o));
      $('#jsX', el).innerHTML = esc(xml);
      const j = JSON.stringify(o).length, x = xml.replace(/\n\s*/g, '').length;
      $('#jsZ', el).textContent = `JSON minifié : ${j} caractères · XML compacté : ${x} caractères (${Math.round((x / j - 1) * 100)} % de plus). En XML, chaque nom de champ est écrit deux fois et les types (nombre, booléen) sont perdus.`;
      return o;
    };
    ta.oninput = go;
    $('#jsF', el).onclick = () => { const o = go(); if (o !== null) { ta.value = JSON.stringify(o, null, 2); } };
    $('#jsMn', el).onclick = () => { const o = go(); if (o !== null) { ta.value = JSON.stringify(o); } };
    $('#jsBad', el).onclick = () => { ta.value = "{\n  nom: 'Traoré',\n  \"notes\": [15, 17,],\n  // commentaire interdit\n}"; go(); };
    $('#jsOk', el).onclick = () => { ta.value = sample; go(); };
    go();
  }
};
