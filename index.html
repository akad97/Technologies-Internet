<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Technologies de l’Internet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
/* Layout: sidebar of courses + main column; each course = tabs (Présentation · Démos · Exercices · Quiz · Fiche) */
:root{
  --bg:#eef2f5; --surface:#ffffff; --surface-2:#f6f8fa; --ink:#14212b; --muted:#566573; --line:#d6dee5;
  --accent:#0b6a86; --accent-soft:#dcedf2; --accent-ink:#ffffff;
  --signal:#d9790a; --signal-soft:#fbecd8;
  --ok:#1b7f48; --ok-soft:#dcf1e4; --bad:#b8382a; --bad-soft:#f7e0dc;
  --code-bg:#122029; --code-ink:#d7e6ee;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --r:10px; --shadow:0 1px 2px rgba(20,33,43,.06),0 4px 14px rgba(20,33,43,.06);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0c1318; --surface:#141f27; --surface-2:#1a2731; --ink:#e4ecf1; --muted:#97a7b4; --line:#263844;
    --accent:#45b4d3; --accent-soft:#16323d; --accent-ink:#06161c;
    --signal:#f0a245; --signal-soft:#3a2a14;
    --ok:#53c287; --ok-soft:#173326; --bad:#ec7a6b; --bad-soft:#3c1d19;
    --code-bg:#081016; --code-ink:#d7e6ee; --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0c1318; --surface:#141f27; --surface-2:#1a2731; --ink:#e4ecf1; --muted:#97a7b4; --line:#263844;
  --accent:#45b4d3; --accent-soft:#16323d; --accent-ink:#06161c;
  --signal:#f0a245; --signal-soft:#3a2a14;
  --ok:#53c287; --ok-soft:#173326; --bad:#ec7a6b; --bad-soft:#3c1d19;
  --code-bg:#081016; --code-ink:#d7e6ee; --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.2;text-wrap:balance;margin:0}
code,kbd,pre,.mono{font-family:var(--f-mono)}
code{background:var(--surface-2);border:1px solid var(--line);border-radius:5px;padding:0 .3em;font-size:.9em}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--signal);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:290px 1fr;min-height:100%}
.side{background:var(--surface);border-right:1px solid var(--line);padding:18px 14px;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.brand{display:flex;gap:10px;align-items:center;padding:4px 6px 10px;border-bottom:1px solid var(--line)}
.brand-mark{width:38px;height:38px;border-radius:9px;background:var(--accent);display:grid;place-items:center;flex:none}
.brand h1{font-size:1.05rem}
.brand p{margin:0;font-size:.78rem;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:8px;padding:8px 8px;border-radius:8px;text-decoration:none;color:var(--ink);font-size:.92rem}
.nav a:hover{background:var(--surface-2)}
.nav a.on{background:var(--accent-soft);color:var(--ink);font-weight:600}
.nav .num{font-family:var(--f-mono);font-size:.75rem;color:var(--muted);text-align:center;border:1px solid var(--line);border-radius:6px;padding:2px 0}
.nav a.on .num{border-color:var(--accent);color:var(--accent)}
.nav .pct{font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}
.nav .pct.done{color:var(--ok);font-weight:600}
.nav-sep{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:10px 8px 2px}
.side-foot{margin-top:auto;font-size:.78rem;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
.btn.menu-btn{display:none}
main{min-width:0;padding:28px clamp(16px,4vw,48px) 80px}
.wrap{max-width:1080px;margin:0 auto}

/* ---------- course header & tabs ---------- */
.c-head{display:grid;gap:10px;margin-bottom:18px}
.eyebrow{font-family:var(--f-mono);font-size:.8rem;color:var(--accent);letter-spacing:.04em}
.c-head h2{font-size:clamp(1.7rem,3.2vw,2.4rem)}
.c-head .lead{color:var(--muted);max-width:70ch;margin:0}
.obj{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.obj span{font-size:.82rem;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:18px 0 22px;overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 10px;font-size:.95rem;cursor:pointer;color:var(--muted);font-weight:500;white-space:nowrap;display:flex;gap:7px;align-items:center}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
.tabs .cnt{font-family:var(--f-mono);font-size:.72rem;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:0 7px}

/* ---------- generic blocks ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow)}
.stack{display:grid;gap:18px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.btn{text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:4px 10px;font-size:.85rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.tag{display:inline-block;font-family:var(--f-mono);font-size:.72rem;padding:1px 8px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2)}
.tag.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.tag.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.tag.sig{background:var(--signal-soft);border-color:var(--signal);color:var(--signal)}
.note{border-left:4px solid var(--accent);background:var(--accent-soft);padding:10px 14px;border-radius:0 8px 8px 0;margin:10px 0}
.note.fix{border-color:var(--signal);background:var(--signal-soft)}
.note b:first-child{display:block;font-size:.78rem;letter-spacing:.05em;text-transform:uppercase;margin-bottom:2px}
.fb{margin-top:10px;padding:10px 14px;border-radius:8px;font-size:.93rem}
.fb.ok{background:var(--ok-soft);border:1px solid var(--ok)}
.fb.bad{background:var(--bad-soft);border:1px solid var(--bad)}
.fb.info{background:var(--surface-2);border:1px solid var(--line)}
table.t{border-collapse:collapse;width:100%;font-size:.92rem}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}
table.t th{font-family:var(--f-display);font-weight:600;background:var(--surface-2)}
.tw{overflow-x:auto}
pre.code{background:var(--code-bg);color:var(--code-ink);padding:14px 16px;border-radius:8px;overflow-x:auto;font-size:.86rem;line-height:1.5;margin:8px 0}
pre.code .k{color:#7fd1e8}.code .s{color:#f2c27a}.code .c{color:#7d93a3}.code .g{color:#8be0a4}.code .r{color:#ff9b8f}
input.in,select.in,textarea.in{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:7px 10px;min-width:0}
textarea.in{font-family:var(--f-mono);font-size:.86rem;width:100%;resize:vertical}
input.in:focus,select.in:focus,textarea.in:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
label.lbl{font-size:.82rem;color:var(--muted);display:block;margin-bottom:3px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:.92rem}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-family:var(--f-mono);word-break:break-all}

/* ---------- home ---------- */
.hero{display:grid;grid-template-columns:1.4fr 1fr;gap:22px;align-items:stretch;margin-bottom:22px}
.hero .card h2{font-size:clamp(1.8rem,3.4vw,2.6rem);margin-bottom:10px}
.prog-ring{display:flex;gap:16px;align-items:center}
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.mod{display:flex;flex-direction:column;gap:8px;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);transition:border-color .15s,transform .15s}
.mod:hover{border-color:var(--accent);transform:translateY(-2px)}
.mod .mn{font-family:var(--f-mono);font-size:.78rem;color:var(--accent)}
.mod h3{font-size:1.1rem}
.mod p{margin:0;font-size:.88rem;color:var(--muted)}
.bar{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.legend-tabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-top:12px}
.legend-tabs div{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:.88rem}
.legend-tabs b{display:block;font-family:var(--f-display)}

/* ---------- slides ---------- */
.deck{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.deck-stage{position:relative;min-height:440px;padding:34px clamp(18px,4vw,48px) 26px;display:flex;flex-direction:column}
.deck:fullscreen{border-radius:0;display:flex;flex-direction:column}
.deck:fullscreen .deck-stage{flex:1;justify-content:center;font-size:1.25rem;max-width:1200px;margin:0 auto;width:100%}
.slide-k{font-family:var(--f-mono);font-size:.78rem;color:var(--signal);letter-spacing:.05em;margin-bottom:6px}
.slide h3{font-size:clamp(1.4rem,2.6vw,2rem);margin-bottom:14px}
.slide ul{padding-left:1.2em;margin:.3em 0}
.slide li{margin:.25em 0}
.slide p{max-width:72ch}
.slide .keep{margin-top:16px;border-top:1px dashed var(--line);padding-top:10px;font-size:.92rem}
.slide .keep b{color:var(--accent)}
.deck-bar{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--line);background:var(--surface-2)}
.dots{display:flex;gap:5px;flex-wrap:wrap;flex:1;justify-content:center}
.dots button{width:9px;height:9px;border-radius:50%;border:0;background:var(--line);padding:0;cursor:pointer}
.dots button.on{background:var(--accent);transform:scale(1.25)}
.dots button.seen{background:var(--muted)}
.dots button.on.seen{background:var(--accent)}
.counter{font-family:var(--f-mono);font-size:.82rem;color:var(--muted);min-width:56px;text-align:center}
.slide-in{animation:sin .25s ease}
@keyframes sin{from{opacity:.3;transform:translateX(8px)}to{opacity:1;transform:none}}
.allslides .deck-stage{border-bottom:1px solid var(--line);min-height:0}
.layers{display:grid;gap:6px;margin:10px 0}
.layer{display:grid;grid-template-columns:150px 1fr;border:1px solid var(--line);border-radius:8px;overflow:hidden;font-size:.92rem}
.layer b{background:var(--accent);color:var(--accent-ink);padding:8px 10px;font-family:var(--f-display)}
.layer span{padding:8px 10px;background:var(--surface-2)}
.tl{display:grid;gap:0;border-left:3px solid var(--accent);margin:8px 0 8px 8px;padding-left:16px}
.tl div{position:relative;padding:4px 0}
.tl div::before{content:"";position:absolute;left:-23.5px;top:11px;width:11px;height:11px;border-radius:50%;background:var(--surface);border:3px solid var(--accent)}
.tl b{font-family:var(--f-mono);color:var(--accent);margin-right:6px}
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:10px 0}
.flow span{background:var(--surface-2);border:1px solid var(--line);border-radius:7px;padding:6px 10px;font-size:.9rem}
.flow i{color:var(--signal);font-style:normal;font-weight:700}

/* ---------- quiz & exercises ---------- */
.q-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.q-prog{flex:1;max-width:340px}
.q-text{font-size:1.12rem;font-weight:600;margin:6px 0 14px}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:9px;padding:11px 14px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .l{font-family:var(--f-mono);font-weight:600;color:var(--muted);min-width:1.4em}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.score-big{font-family:var(--f-display);font-size:3rem;font-weight:700;line-height:1}
.review li{margin:8px 0}
.ex{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow)}
.ex-h{display:flex;gap:12px;align-items:baseline;padding:14px 18px;border-bottom:1px solid var(--line)}
.ex-h .n{font-family:var(--f-mono);color:var(--signal);font-weight:600}
.ex-h h4{font-size:1.08rem;flex:1}
.ex-b{padding:16px 18px;display:grid;gap:12px}
.ex-b .consigne{margin:0}
.m-row{display:grid;grid-template-columns:minmax(140px,1fr) minmax(160px,1.3fr) 26px;gap:10px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line)}
.m-row:last-child{border-bottom:0}
.mark{font-weight:700;text-align:center}
.mark.ok{color:var(--ok)}.mark.bad{color:var(--bad)}
.ord{display:grid;gap:6px}
.ord-it{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.ord-it.ok{border-color:var(--ok);background:var(--ok-soft)}
.ord-it.bad{border-color:var(--bad);background:var(--bad-soft)}
.ord-it .i{font-family:var(--f-mono);color:var(--muted);text-align:center}
.cls-row{display:grid;grid-template-columns:1fr auto 22px;gap:10px;align-items:center;padding:5px 0;border-bottom:1px dashed var(--line)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--surface);padding:5px 10px;cursor:pointer;font-size:.85rem;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.inp-row{display:grid;grid-template-columns:1fr minmax(150px,240px) 22px;gap:10px;align-items:center;padding:5px 0;border-bottom:1px dashed var(--line)}
.sol{background:var(--surface-2);border:1px dashed var(--line);border-radius:8px;padding:10px 14px;font-size:.92rem}
details.hint summary{cursor:pointer;color:var(--accent);font-size:.9rem}

/* ---------- demos ---------- */
.demo{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow);overflow:hidden}
.demo-h{padding:14px 18px;border-bottom:1px solid var(--line);display:grid;gap:4px}
.demo-h h4{font-size:1.1rem}
.demo-h p{margin:0;color:var(--muted);font-size:.9rem}
.demo-b{padding:16px 18px}
.term{background:var(--code-bg);color:var(--code-ink);font-family:var(--f-mono);font-size:.84rem;border-radius:8px;padding:12px 14px;min-height:120px;max-height:340px;overflow:auto;white-space:pre-wrap;line-height:1.5}
.term .cl{color:#7fd1e8}.term .sv{color:#8be0a4}.term .er{color:#ff9b8f}.term .dim{color:#7d93a3}.term .hl{color:#f2c27a}
.enc{display:grid;gap:6px;margin-top:12px}
.enc-row{display:flex;align-items:stretch;border-radius:7px;overflow:hidden;font-family:var(--f-mono);font-size:.8rem;min-height:38px;transition:all .3s}
.enc-row > div{padding:8px 10px;display:flex;align-items:center}
.h-eth{background:#7a5af0;color:#fff}.h-ip{background:#0b6a86;color:#fff}.h-tcp{background:#d9790a;color:#fff}.h-app{background:#1b7f48;color:#fff}.h-data{background:var(--surface-2);color:var(--ink);flex:1;border:1px solid var(--line)}
.h-fcs{background:#7a5af0;color:#fff}
.lane{position:relative;display:grid;grid-template-columns:110px 1fr 110px;gap:0;align-items:start}
.seq{display:grid;gap:6px}
.seq-msg{display:grid;grid-template-columns:1fr;font-family:var(--f-mono);font-size:.8rem}
.seq-arrow{position:relative;height:26px;margin:0 6px}
.seq-arrow .ln{position:absolute;top:12px;left:0;right:0;border-top:2px solid var(--accent)}
.seq-arrow.l2r .ln::after{content:"";position:absolute;right:-2px;top:-7px;border:6px solid transparent;border-left-color:var(--accent)}
.seq-arrow.r2l .ln::before{content:"";position:absolute;left:-2px;top:-7px;border:6px solid transparent;border-right-color:var(--accent)}
.seq-arrow.lost .ln{border-top-style:dashed;border-color:var(--bad);right:45%}
.seq-arrow.lost .ln::after{display:none}
.seq-arrow .lab{position:absolute;top:-4px;left:50%;transform:translateX(-50%);background:var(--surface);padding:0 6px;font-family:var(--f-mono);font-size:.74rem;white-space:nowrap}
.seq-arrow.lost .lab{color:var(--bad);left:25%}
.seq-cols{display:grid;grid-template-columns:90px 1fr 90px;align-items:center}
.seq-cols .ep{font-family:var(--f-display);font-weight:600;text-align:center;font-size:.9rem}
.pkts{display:flex;gap:5px;flex-wrap:wrap;min-height:36px;padding:6px;border:1px dashed var(--line);border-radius:8px;background:var(--surface-2)}
.pkt{font-family:var(--f-mono);font-size:.78rem;min-width:30px;text-align:center;padding:5px 6px;border-radius:6px;background:var(--accent);color:var(--accent-ink)}
.pkt.lost{background:var(--bad);color:#fff;text-decoration:line-through}
.pkt.retx{background:var(--signal);color:#fff}
.pkt.dup{background:var(--muted);color:#fff}
.dns-steps{display:grid;gap:8px}
.dns-step{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start;padding:8px 10px;border:1px solid var(--line);border-radius:8px;opacity:.35;transition:opacity .25s}
.dns-step.on{opacity:1;border-color:var(--accent);background:var(--accent-soft)}
.dns-step.done{opacity:1}
.dns-step .n{font-family:var(--f-mono);font-weight:600;color:var(--accent)}
svg text{font-family:var(--f-body)}
.net svg{width:100%;height:auto;display:block}
.bits{display:flex;flex-wrap:wrap;gap:2px;font-family:var(--f-mono);font-size:.8rem}
.bits span{width:20px;text-align:center;padding:3px 0;border-radius:3px;background:var(--surface-2);border:1px solid var(--line)}
.bits span.n{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.bits span.h{background:var(--signal-soft);border-color:var(--signal)}
.bits i{width:8px}
.editor{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.editor iframe{width:100%;height:340px;border:1px solid var(--line);border-radius:8px;background:#fff}
.ed-tabs{display:flex;gap:4px;margin-bottom:6px}
.ed-tabs button{border:1px solid var(--line);background:var(--surface-2);border-radius:6px 6px 0 0;padding:4px 12px;cursor:pointer;font-family:var(--f-mono);font-size:.8rem}
.ed-tabs button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.editor textarea{height:300px}
.xml-tree{font-family:var(--f-mono);font-size:.82rem;line-height:1.6}
.xml-tree ul{list-style:none;padding-left:18px;margin:0;border-left:1px dashed var(--line)}
.xml-tree .el{color:var(--accent);font-weight:600}.xml-tree .at{color:var(--signal)}
.res-table{max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:8px}
.fw-pk{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:6px 10px;border:1px solid var(--line);border-radius:7px;font-family:var(--f-mono);font-size:.8rem}
.fw-pk.allow{border-color:var(--ok);background:var(--ok-soft)}
.fw-pk.deny{border-color:var(--bad);background:var(--bad-soft)}
.chat{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.chat > div{border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--surface-2);min-height:120px;font-size:.88rem}
.chat h5{margin:0 0 6px;font-family:var(--f-display);font-size:.95rem}
.eve{border-color:var(--bad)!important}
.resp-grid{display:grid;grid-template-columns:150px repeat(4,1fr);gap:3px;font-size:.84rem}
.resp-grid div{padding:7px 8px;border-radius:5px}
.resp-grid .hd{font-weight:600;font-family:var(--f-display);text-align:center;background:var(--surface-2)}
.resp-grid .ly{background:var(--surface-2);font-weight:500}
.resp-grid .you{background:var(--signal);color:#fff;text-align:center}
.resp-grid .prov{background:var(--accent);color:var(--accent-ink);text-align:center}
.resp-grid .sel{outline:3px solid var(--ink);outline-offset:-3px}
.mqtt{display:grid;grid-template-columns:1fr 160px 1fr;gap:12px;align-items:start}
.broker{border:2px solid var(--accent);border-radius:12px;padding:14px;text-align:center;background:var(--accent-soft);font-family:var(--f-display);font-weight:600;position:sticky;top:10px;overflow-wrap:anywhere}
.sub{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:8px;background:var(--surface-2)}
.sub .inbox{font-family:var(--f-mono);font-size:.76rem;max-height:110px;overflow:auto;margin-top:6px}
.sub .inbox div{padding:2px 0;border-bottom:1px dotted var(--line)}
.flash{animation:fl .8s ease}
@keyframes fl{0%{background:var(--signal-soft)}100%{background:transparent}}
.gloss{display:grid;gap:8px}
.gloss dt{font-weight:600;font-family:var(--f-display)}
.gloss dd{margin:0 0 8px;color:var(--muted)}
.timer{font-family:var(--f-mono);font-size:1.1rem;font-weight:600}
.timer.low{color:var(--bad)}
.tp-steps{display:grid;gap:10px;padding-left:1.4em;margin:0}
.tp-steps li{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2)}
.tp-steps li::marker{font-family:var(--f-mono);color:var(--signal);font-weight:600}
.tp-steps label{cursor:pointer}
.tp-steps li:has(input:checked){border-color:var(--ok);background:var(--ok-soft)}
.tp-steps .small{margin-top:4px}
.vids{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.vid{display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:start}
.vid h4{font-size:1.02rem}
.toast{position:fixed;bottom:18px;right:18px;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:.9rem;box-shadow:var(--shadow);z-index:50}

@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:290px;z-index:40;transform:translateX(-100%);transition:transform .2s;box-shadow:var(--shadow)}
  .side.open{transform:none}
  .btn.menu-btn{display:inline-flex;position:sticky;top:10px;z-index:30;margin-bottom:10px}
  .hero{grid-template-columns:1fr}
  .editor{grid-template-columns:1fr}
  .mqtt{grid-template-columns:1fr}
  .chat{grid-template-columns:1fr}
  .resp-grid{grid-template-columns:110px repeat(4,1fr);font-size:.74rem}
}
@media (max-width:520px){
  .m-row,.inp-row{grid-template-columns:1fr 22px}
  .m-row > :nth-child(2),.inp-row > :nth-child(2){grid-column:1}
  .layer{grid-template-columns:1fr}
  .deck-stage{min-height:360px}
}

</style>
</head>
<body>
<div class="app">
  <aside class="side" aria-label="Navigation du cours">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" style="stroke:var(--accent-ink)" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.2 3 14.8 0 18M12 3c-3 3.2-3 14.8 0 18"/></svg></div>
      <div><h1>Technologies de l’Internet</h1><p>Cours interactif · 10 modules</p></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">D’après le guide de l’étudiant et le support « Technologies de l’Internet ». Progression enregistrée dans ce navigateur.</div>
  </aside>
  <main id="mainWrap"><button class="btn menu-btn" id="menuBtn" aria-label="Ouvrir le menu">☰ Menu</button><div id="main"></div></main>
</div>
<script>
/* ===================== Noyau : stockage, navigation, moteurs ===================== */
const COURSES = [];      // remplis par les fichiers de contenu
const DEMOS = {};        // id -> {title, desc, render(el)}
const GLOSSARY = [];     // {t, d}
const DEV_QUESTIONS = []; // questions à développement pour l'examen blanc

const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const norm = s => String(s).trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/\s+/g, ' ');
function toast(msg) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2200); }

/* ---------- progression (navigateur de l'étudiant uniquement) ---------- */
const Store = {
  key: 'techno-internet-cours-v1',
  data: { slides: {}, ex: {}, quiz: {}, exam: [], tp: {} },
  load() { try { const d = JSON.parse(localStorage.getItem(this.key)); if (d) this.data = Object.assign(this.data, d); } catch (e) {} },
  save() { try { localStorage.setItem(this.key, JSON.stringify(this.data)); } catch (e) {} },
  seeSlide(cid, i) { const s = new Set(this.data.slides[cid] || []); s.add(i); this.data.slides[cid] = [...s]; this.save(); },
  exDone(cid, i) { this.data.ex[cid + ':' + i] = true; this.save(); },
  quizScore(cid, pct) { this.data.quiz[cid] = Math.max(this.data.quiz[cid] || 0, pct); this.save(); },
  progress(c) {
    const s = (this.data.slides[c.id] || []).length / Math.max(1, c.slides.length);
    const e = c.exercises.length ? c.exercises.filter((_, i) => this.data.ex[c.id + ':' + i]).length / c.exercises.length : 1;
    const q = (this.data.quiz[c.id] || 0) / 100;
    return Math.round(((s + e + q) / 3) * 100);
  },
  tpStep(cid, i, on) { this.data.tp = this.data.tp || {}; const s = new Set(this.data.tp[cid] || []); on ? s.add(i) : s.delete(i); this.data.tp[cid] = [...s]; this.save(); },
  reset() { this.data = { slides: {}, ex: {}, quiz: {}, exam: [], tp: {} }; this.save(); }
};

/* ---------- navigation ---------- */
const state = { tab: 'slides' };
function route() {
  const h = (location.hash || '#accueil').slice(1);
  const side = $('.side'); side.classList.remove('open');
  renderNav(h);
  const main = $('#main');
  if (h === 'accueil') renderHome(main);
  else if (h === 'examen') renderExam(main);
  else if (h === 'glossaire') renderGlossary(main);
  else if (h === 'quiz-general') renderQuizGeneral(main);
  else {
    const c = COURSES.find(c => c.id === h);
    if (c) renderCourse(main, c); else renderHome(main);
  }
  window.scrollTo(0, 0);
}
function renderNav(active) {
  const nav = $('#nav');
  let html = `<a href="#accueil" class="${active === 'accueil' ? 'on' : ''}"><span class="num">⌂</span><span>Accueil</span><span></span></a>`;
  html += `<div class="nav-sep">Les cours</div>`;
  for (const c of COURSES) {
    const p = Store.progress(c);
    html += `<a href="#${c.id}" class="${active === c.id ? 'on' : ''}"><span class="num">${c.num}</span><span>${esc(c.short)}</span><span class="pct ${p >= 100 ? 'done' : ''}">${p}%</span></a>`;
  }
  html += `<div class="nav-sep">Évaluation &amp; outils</div>
    <a href="#quiz-general" class="${active === 'quiz-general' ? 'on' : ''}"><span class="num">QG</span><span>Quiz général</span><span class="pct">${Store.data.quiz.general ? Store.data.quiz.general + '%' : ''}</span></a>
    <a href="#examen" class="${active === 'examen' ? 'on' : ''}"><span class="num">EX</span><span>Examen blanc</span><span></span></a>
    <a href="#glossaire" class="${active === 'glossaire' ? 'on' : ''}"><span class="num">A–Z</span><span>Glossaire</span><span></span></a>`;
  nav.innerHTML = html;
}

/* ---------- accueil ---------- */
function renderHome(main) {
  const total = COURSES.length;
  const avg = Math.round(COURSES.reduce((s, c) => s + Store.progress(c), 0) / total);
  const nbQ = COURSES.reduce((s, c) => s + c.quiz.length, 0);
  const nbEx = COURSES.reduce((s, c) => s + c.exercises.length, 0);
  const nbD = COURSES.reduce((s, c) => s + c.demos.length, 0);
  const nbS = COURSES.reduce((s, c) => s + c.slides.length, 0);
  main.innerHTML = `<div class="wrap">
  <section class="hero">
    <div class="card">
      <div class="eyebrow">COURS INTERACTIF · LICENCE INFORMATIQUE</div>
      <h2>Technologies de l’Internet</h2>
      <p class="muted" style="max-width:62ch">Des protocoles TCP/IP jusqu’aux API REST, en passant par le DNS, le Web, la sécurité, les bases de données, le cloud, le streaming et l’IoT. Chaque cours se suit en plusieurs temps : on présente, on manipule, on s’exerce, on met en pratique en équipe, on analyse un cas réel, on se teste, on révise.</p>
      <div class="row" style="margin-top:14px"><a class="btn pri" href="#${COURSES[0].id}">Commencer le cours</a><a class="btn" href="#quiz-general">Quiz général</a><a class="btn" href="#examen">Examen blanc</a></div>
    </div>
    <div class="card stack" style="gap:12px">
      <div class="prog-ring">${ring(avg)}<div><b style="font-family:var(--f-display);font-size:1.1rem">Votre progression</b><div class="small muted">Diapositives vues, exercices réussis et meilleur score au quiz de chaque cours.</div></div></div>
      <div class="grid2" style="gap:8px;grid-template-columns:1fr 1fr">
        <div class="tag" style="padding:6px 10px;border-radius:8px">${nbS} diapositives</div>
        <div class="tag" style="padding:6px 10px;border-radius:8px">${nbD} démonstrations</div>
        <div class="tag" style="padding:6px 10px;border-radius:8px">${nbEx} exercices</div>
        <div class="tag" style="padding:6px 10px;border-radius:8px">${nbQ} questions de quiz</div>
        <div class="tag" style="padding:6px 10px;border-radius:8px">${COURSES.filter(c => c.tp).length} TP d’équipe</div>
        <div class="tag" style="padding:6px 10px;border-radius:8px">${COURSES.filter(c => c.cas).length} études de cas</div>
        <div class="tag" style="padding:6px 10px;border-radius:8px">${COURSES.reduce((s, c) => s + (c.td ? c.td.exos.length : 0), 0)} exercices de TD</div>
        <div class="tag" style="padding:6px 10px;border-radius:8px">${COURSES.reduce((s, c) => s + (c.videos ? c.videos.length : 0), 0)} vidéos</div>
      </div>
      <button class="btn sm" id="resetProg" style="justify-self:start">Remettre la progression à zéro</button>
    </div>
  </section>
  <h3 style="margin:8px 0 12px">Le programme</h3>
  <div class="mods">${COURSES.map(c => { const p = Store.progress(c); return `<a class="mod" href="#${c.id}"><span class="mn">${c.num === '00' ? 'INTRODUCTION' : 'COURS ' + c.num}</span><h3>${esc(c.title)}</h3><p>${esc(c.lead)}</p><div class="bar" aria-label="Progression ${p}%"><i style="width:${p}%"></i></div><span class="small muted">${c.slides.length} diapos · ${c.demos.length} démos · ${c.exercises.length} exercices · ${c.quiz.length} questions</span></a>`; }).join('')}</div>
  <div class="card" style="margin-top:22px">
    <h3 style="margin-bottom:6px">Comment travailler avec ce cours</h3>
    <div class="legend-tabs">
      <div><b>1 · Présentation</b>Diapositives à faire défiler (flèches ← →), mode plein écran pour projeter en classe.</div>
      <div><b>2 · Démonstrations</b>Simulateurs à manipuler : paquets, DNS, routage, SQL, MQTT, API…</div>
      <div><b>3 · Exercices</b>Travaux pratiques corrigés automatiquement, avec indices et solutions.</div>
      <div><b>4 · TP</b>Un travail pratique d’équipe par cours : étapes à cocher, livrables, barème sur 20.</div>
      <div><b>5 · Étude de cas</b>Une situation réelle à analyser, avec un corrigé à ouvrir après réflexion.</div>
      <div><b>6 · TD</b>Une fiche d’exercices à faire sur papier en séance, corrigé détaillé.</div>
      <div><b>7 · Vidéos</b>Des vidéos sélectionnées, avec ce qu’il faut y repérer.</div>
      <div><b>8 · Quiz</b>QCM avec correction expliquée. Visez 70 % avant de passer au cours suivant.</div>
      <div><b>9 · Fiche récap</b>L’essentiel à retenir pour réviser l’examen.</div>
      <div><b>Puis</b> le quiz général sur tout le programme, et l’examen blanc chronométré.</div>
    </div>
  </div></div>`;
  $('#resetProg').onclick = () => { Store.reset(); toast('Progression remise à zéro'); route(); };
}
function ring(p) {
  const r = 30, c = 2 * Math.PI * r;
  return `<svg width="78" height="78" viewBox="0 0 78 78" role="img" aria-label="${p}%"><circle cx="39" cy="39" r="${r}" fill="none" style="stroke:var(--surface-2)" stroke-width="9"/><circle cx="39" cy="39" r="${r}" fill="none" style="stroke:var(--accent)" stroke-width="9" stroke-linecap="round" stroke-dasharray="${c * p / 100} ${c}" transform="rotate(-90 39 39)"/><text x="39" y="44" text-anchor="middle" font-size="16" font-weight="700" style="fill:var(--ink)">${p}%</text></svg>`;
}

/* ---------- page d'un cours ---------- */
function renderCourse(main, c) {
  const tabs = [['slides', 'Présentation', c.slides.length], ['demos', 'Démonstrations', c.demos.length], ['ex', 'Exercices', c.exercises.length]];
  if (c.tp) tabs.push(['tp', 'TP', '']);
  if (c.cas) tabs.push(['cas', 'Étude de cas', '']);
  if (c.td) tabs.push(['td', 'TD', c.td.exos.length]);
  if (c.videos) tabs.push(['videos', 'Vidéos', c.videos.length]);
  tabs.push(['quiz', 'Quiz', c.quiz.length], ['recap', 'Fiche récap', '']);
  const idx = COURSES.indexOf(c);
  main.innerHTML = `<div class="wrap">
    <header class="c-head">
      <div class="eyebrow">${c.num === '00' ? 'INTRODUCTION' : 'COURS ' + c.num + ' / ' + String(COURSES.length - 1).padStart(2, '0')}</div>
      <h2>${esc(c.title)}</h2>
      <p class="lead">${c.lead}</p>
      <div class="obj">${c.objectives.map(o => `<span>✓ ${o}</span>`).join('')}</div>
    </header>
    <nav class="tabs" role="tablist">${tabs.map(([k, l, n]) => `<button role="tab" data-tab="${k}" class="${state.tab === k ? 'on' : ''}">${l}${n !== '' ? `<span class="cnt">${n}</span>` : ''}</button>`).join('')}</nav>
    <section id="tabBody"></section>
    <div class="row" style="justify-content:space-between;margin-top:30px">
      ${idx > 0 ? `<a class="btn" href="#${COURSES[idx - 1].id}">← ${esc(COURSES[idx - 1].short)}</a>` : '<span></span>'}
      ${idx < COURSES.length - 1 ? `<a class="btn pri" href="#${COURSES[idx + 1].id}">${esc(COURSES[idx + 1].short)} →</a>` : `<a class="btn pri" href="#examen">Examen blanc →</a>`}
    </div></div>`;
  $$('.tabs button', main).forEach(b => b.onclick = () => { state.tab = b.dataset.tab; $$('.tabs button', main).forEach(x => x.classList.toggle('on', x === b)); showTab(c); });
  showTab(c);
}
function showTab(c) {
  const body = $('#tabBody');
  body.innerHTML = '';
  if (state.tab === 'slides') renderDeck(body, c);
  else if (state.tab === 'demos') { const s = document.createElement('div'); s.className = 'stack'; body.appendChild(s); c.demos.forEach(id => renderDemo(s, id)); }
  else if (state.tab === 'ex') { const s = document.createElement('div'); s.className = 'stack'; body.appendChild(s); c.exercises.forEach((ex, i) => renderExercise(s, c, ex, i)); }
  else if (state.tab === 'tp') renderTP(body, c);
  else if (state.tab === 'cas') renderCas(body, c);
  else if (state.tab === 'td') renderTD(body, c);
  else if (state.tab === 'videos') renderVideos(body, c);
  else if (state.tab === 'quiz') renderQuiz(body, c.quiz, { id: c.id, title: c.short });
  else if (state.tab === 'recap') body.innerHTML = `<div class="card slide">${c.recap}</div>`;
}
const refreshNav = () => renderNav((location.hash || '#accueil').slice(1));

/* ---------- diaporama ---------- */
function renderDeck(host, c) {
  let i = 0, all = false;
  host.innerHTML = `<div class="row" style="justify-content:flex-end;margin-bottom:8px"><button class="btn sm" id="dkAll">Afficher toutes les diapositives</button></div><div class="deck" tabindex="0" aria-roledescription="diaporama"></div>`;
  const deck = $('.deck', host);
  const draw = () => {
    if (all) {
      deck.classList.add('allslides');
      deck.innerHTML = c.slides.map((s, k) => `<div class="deck-stage slide">${slideHTML(s, k, c.slides.length)}</div>`).join('');
      c.slides.forEach((_, k) => Store.seeSlide(c.id, k));
      refreshNav(); return;
    }
    deck.classList.remove('allslides');
    Store.seeSlide(c.id, i); refreshNav();
    const seen = new Set(Store.data.slides[c.id] || []);
    deck.innerHTML = `<div class="deck-stage slide slide-in">${slideHTML(c.slides[i], i, c.slides.length)}</div>
      <div class="deck-bar">
        <button class="btn sm" data-a="prev" ${i === 0 ? 'disabled' : ''} aria-label="Diapositive précédente">←</button>
        <span class="counter">${i + 1} / ${c.slides.length}</span>
        <div class="dots">${c.slides.map((s, k) => `<button aria-label="Diapositive ${k + 1} : ${esc(s.t)}" title="${esc(s.t)}" data-k="${k}" class="${k === i ? 'on' : ''} ${seen.has(k) ? 'seen' : ''}"></button>`).join('')}</div>
        <button class="btn sm" data-a="fs" aria-label="Plein écran">⛶</button>
        <button class="btn sm pri" data-a="next" ${i === c.slides.length - 1 ? 'disabled' : ''} aria-label="Diapositive suivante">→</button>
      </div>`;
    $('[data-a=prev]', deck).onclick = () => { i--; draw(); };
    $('[data-a=next]', deck).onclick = () => { i++; draw(); };
    $('[data-a=fs]', deck).onclick = () => { try { if (document.fullscreenElement) document.exitFullscreen(); else deck.requestFullscreen().catch(() => toast('Plein écran indisponible ici')); } catch (e) { toast('Plein écran indisponible ici'); } };
    $$('.dots button', deck).forEach(b => b.onclick = () => { i = +b.dataset.k; draw(); });
    if (c.slides[i].after) c.slides[i].after($('.deck-stage', deck));
  };
  deck.addEventListener('keydown', e => {
    if (all) return;
    if (e.key === 'ArrowRight' && i < c.slides.length - 1) { i++; draw(); deck.focus(); }
    if (e.key === 'ArrowLeft' && i > 0) { i--; draw(); deck.focus(); }
  });
  $('#dkAll', host).onclick = e => { all = !all; e.target.textContent = all ? 'Revenir au diaporama' : 'Afficher toutes les diapositives'; draw(); };
  draw();
}
function slideHTML(s, k, n) {
  return `<div class="slide-k">${s.k || ''}</div><h3>${s.t}</h3><div>${s.b}</div>${s.keep ? `<div class="keep"><b>À retenir :</b> ${s.keep}</div>` : ''}`;
}

/* ---------- démonstrations ---------- */
function renderDemo(host, id) {
  const d = DEMOS[id];
  const el = document.createElement('article'); el.className = 'demo';
  el.innerHTML = `<div class="demo-h"><span class="eyebrow">DÉMONSTRATION</span><h4>${d.title}</h4><p>${d.desc}</p></div><div class="demo-b"></div>`;
  host.appendChild(el);
  try { d.render($('.demo-b', el)); } catch (e) { $('.demo-b', el).innerHTML = `<div class="fb bad">Cette démonstration n’a pas pu démarrer : ${esc(e.message)}</div>`; console.error(e); }
}

/* ---------- exercices ---------- */
function renderExercise(host, c, ex, i) {
  const el = document.createElement('article'); el.className = 'ex';
  const done = Store.data.ex[c.id + ':' + i];
  el.innerHTML = `<div class="ex-h"><span class="n">EX ${String(i + 1).padStart(2, '0')}</span><h4>${ex.t}</h4>${done ? '<span class="tag ok">réussi</span>' : `<span class="tag">${ex.type === 'custom' ? 'TP' : 'à faire'}</span>`}</div>
    <div class="ex-b"><p class="consigne">${ex.c}</p><div class="ex-zone"></div>
    ${ex.hint ? `<details class="hint"><summary>Besoin d’un indice ?</summary><p class="small">${ex.hint}</p></details>` : ''}
    <div class="row ex-actions"></div><div class="ex-fb"></div><div class="ex-sol"></div></div>`;
  host.appendChild(el);
  const zone = $('.ex-zone', el), acts = $('.ex-actions', el), fb = $('.ex-fb', el), solBox = $('.ex-sol', el);
  const success = () => { Store.exDone(c.id, i); refreshNav(); const t = $('.ex-h .tag', el); t.className = 'tag ok'; t.textContent = 'réussi'; };
  const report = (good, total, extra = '') => {
    const ok = good === total;
    fb.innerHTML = `<div class="fb ${ok ? 'ok' : 'bad'}">${ok ? '✔ Parfait, tout est juste !' : `${good} / ${total} correct${good > 1 ? 's' : ''}. Corrigez les éléments marqués ✗ puis vérifiez à nouveau.`} ${extra}</div>`;
    if (ok) success();
  };
  const showSol = () => { if (ex.sol) solBox.innerHTML = `<div class="sol"><b>Solution commentée.</b> ${ex.sol}</div>`; };
  const addBtns = (check, reveal) => {
    acts.innerHTML = `<button class="btn pri">Vérifier</button><button class="btn">Voir la solution</button>`;
    acts.children[0].onclick = check;
    acts.children[1].onclick = () => { reveal && reveal(); showSol(); };
  };
  const EX = {
    match() {
      const rights = shuffle([...ex.pairs.map(p => p[1]), ...(ex.extra || [])]);
      zone.innerHTML = ex.pairs.map((p, k) => `<div class="m-row"><span>${p[0]}</span><select class="in" id="m-${c.id}-${i}-${k}" aria-label="Réponse pour ${esc(p[0])}"><option value="">— choisir —</option>${rights.map(r => `<option>${esc(r)}</option>`).join('')}</select><span class="mark"></span></div>`).join('');
      const sels = $$('select', zone);
      addBtns(() => { let g = 0; sels.forEach((s, k) => { const ok = s.value === ex.pairs[k][1]; g += ok; const m = s.nextElementSibling; m.textContent = ok ? '✓' : '✗'; m.className = 'mark ' + (ok ? 'ok' : 'bad'); }); report(g, sels.length); },
        () => sels.forEach((s, k) => s.value = ex.pairs[k][1]));
    },
    order() {
      let cur = shuffle(ex.items.map((t, k) => k));
      if (cur.every((v, k) => v === k)) cur.reverse();
      const draw = (marks) => {
        zone.innerHTML = `<div class="ord">${cur.map((v, p) => `<div class="ord-it ${marks ? (marks[p] ? 'ok' : 'bad') : ''}"><span class="i">${p + 1}</span><span>${ex.items[v]}</span><span class="row" style="gap:4px"><button class="btn sm" data-u="${p}" ${p === 0 ? 'disabled' : ''} aria-label="Monter">↑</button><button class="btn sm" data-d="${p}" ${p === cur.length - 1 ? 'disabled' : ''} aria-label="Descendre">↓</button></span></div>`).join('')}</div>`;
        $$('[data-u]', zone).forEach(b => b.onclick = () => { const p = +b.dataset.u;[cur[p - 1], cur[p]] = [cur[p], cur[p - 1]]; draw(); });
        $$('[data-d]', zone).forEach(b => b.onclick = () => { const p = +b.dataset.d;[cur[p + 1], cur[p]] = [cur[p], cur[p + 1]]; draw(); });
      };
      draw();
      addBtns(() => { const m = cur.map((v, p) => v === p); draw(m); report(m.filter(Boolean).length, m.length); }, () => { cur = ex.items.map((_, k) => k); draw(); });
    },
    classify() {
      const order = shuffle(ex.items.map((_, k) => k));
      const pick = {};
      zone.innerHTML = order.map(k => `<div class="cls-row" data-k="${k}"><span>${ex.items[k][0]}</span><span class="seg">${ex.cats.map((ct, j) => `<button data-j="${j}">${ct}</button>`).join('')}</span><span class="mark"></span></div>`).join('');
      $$('.cls-row', zone).forEach(r => $$('button', r).forEach(b => b.onclick = () => { pick[r.dataset.k] = +b.dataset.j; $$('button', r).forEach(x => x.classList.toggle('on', x === b)); }));
      addBtns(() => { let g = 0; $$('.cls-row', zone).forEach(r => { const k = r.dataset.k, ok = pick[k] === ex.items[k][1]; g += ok; const m = $('.mark', r); m.textContent = ok ? '✓' : '✗'; m.className = 'mark ' + (ok ? 'ok' : 'bad'); }); report(g, ex.items.length); },
        () => $$('.cls-row', zone).forEach(r => { const k = r.dataset.k; pick[k] = ex.items[k][1]; $$('button', r).forEach(x => x.classList.toggle('on', +x.dataset.j === ex.items[k][1])); }));
    },
    input() {
      zone.innerHTML = ex.items.map((it, k) => `<div class="inp-row"><label for="in-${c.id}-${i}-${k}">${it[0]}</label><input class="in mono" id="in-${c.id}-${i}-${k}" placeholder="${esc(it[2] || '')}" autocomplete="off" spellcheck="false"><span class="mark"></span></div>`).join('');
      const ins = $$('input', zone);
      const clean = v => ex.strict ? v.trim() : norm(v).replace(/\s+/g, ex.keepSpace ? ' ' : '');
      addBtns(() => { let g = 0; ins.forEach((inp, k) => { const ok = ex.items[k][1].some(a => clean(a) === clean(inp.value)); g += ok; const m = inp.nextElementSibling; m.textContent = ok ? '✓' : '✗'; m.className = 'mark ' + (ok ? 'ok' : 'bad'); }); report(g, ins.length); },
        () => ins.forEach((inp, k) => inp.value = ex.items[k][1][0]));
    },
    mcheck() {
      zone.innerHTML = ex.items.map((it, k) => `<label class="cls-row" style="cursor:pointer"><span><input type="checkbox" id="mc-${c.id}-${i}-${k}"> ${it[0]}</span><span></span><span class="mark"></span></label>`).join('');
      const cbs = $$('input', zone);
      addBtns(() => { let g = 0; cbs.forEach((cb, k) => { const ok = cb.checked === ex.items[k][1]; g += ok; const m = cb.closest('.cls-row').querySelector('.mark'); m.textContent = ok ? '✓' : '✗'; m.className = 'mark ' + (ok ? 'ok' : 'bad'); }); report(g, cbs.length); },
        () => cbs.forEach((cb, k) => cb.checked = ex.items[k][1]));
    },
    custom() { ex.render(zone, { acts, fb, success, report, showSol, addBtns }); }
  };
  EX[ex.type]();
}

/* ---------- quiz ---------- */
/* mélange les options d’une question en gardant la bonne réponse */
function shuffleOpts(q) { const idx = shuffle(q.o.map((_, i) => i)); return Object.assign({}, q, { o: idx.map(i => q.o[i]), a: idx.indexOf(q.a) }); }
function renderQuiz(host, questions, meta) {
  let qs, k, answers;
  const start = () => { qs = shuffle(questions).map(shuffleOpts); k = 0; answers = []; draw(); };
  const L = 'ABCDEFG';
  const draw = () => {
    if (k >= qs.length) return finish();
    const q = qs[k];
    host.innerHTML = `<div class="card"><div class="q-top"><span class="tag">Question ${k + 1} / ${qs.length}</span><div class="q-prog bar"><i style="width:${(k / qs.length) * 100}%"></i></div><span class="tag ok">${answers.filter(a => a.ok).length} ✓</span></div>
      ${q.src ? `<div class="eyebrow">${esc(q.src)}</div>` : ''}<div class="q-text">${q.q}</div>
      <div class="opts">${q.o.map((o, j) => `<button class="opt" data-j="${j}"><span class="l">${L[j]}</span><span>${o}</span></button>`).join('')}</div>
      <div class="q-fb"></div><div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn pri" id="qNext" hidden>${k === qs.length - 1 ? 'Voir mon score' : 'Question suivante →'}</button></div></div>`;
    $$('.opt', host).forEach(b => b.onclick = () => {
      const j = +b.dataset.j, ok = j === q.a;
      answers.push({ q, j, ok });
      $$('.opt', host).forEach((x, m) => { x.disabled = true; if (m === q.a) x.classList.add('right'); });
      if (!ok) b.classList.add('wrong');
      $('.q-fb', host).innerHTML = `<div class="fb ${ok ? 'ok' : 'bad'}"><b>${ok ? 'Bonne réponse.' : 'Pas tout à fait : la bonne réponse est ' + L[q.a] + '.'}</b> ${q.e || ''}</div>`;
      const n = $('#qNext', host); n.hidden = false; n.focus();
      n.onclick = () => { k++; draw(); };
    });
  };
  const finish = () => {
    const good = answers.filter(a => a.ok).length, pct = Math.round(good / qs.length * 100);
    if (meta.id) { Store.quizScore(meta.id, pct); refreshNav(); }
    const msg = pct >= 90 ? 'Excellent, vous maîtrisez ce cours.' : pct >= 70 ? 'Bon résultat. Relisez les explications des erreurs ci-dessous.' : pct >= 50 ? 'C’est un début. Revoyez la présentation et la fiche récap, puis recommencez.' : 'Reprenez la présentation et les démonstrations avant de retenter le quiz.';
    host.innerHTML = `<div class="card stack"><div class="row" style="gap:20px"><div class="score-big">${good}/${qs.length}</div><div><b>${pct} %</b> · ${msg}<div class="small muted">Meilleur score enregistré : ${Store.data.quiz[meta.id] || pct} %</div></div></div>
      ${answers.some(a => a.q.src) ? (() => { const m = {}; answers.forEach(a => { const s = a.q.src; m[s] = m[s] || [0, 0]; m[s][1]++; if (a.ok) m[s][0]++; }); return `<div class="tw"><table class="t"><tr><th>Cours</th><th>Réussite</th><th>Conseil</th></tr>${Object.entries(m).map(([s, [g, t]]) => { const r = g / t; const c = COURSES.find(x => x.short === s); return `<tr><td>${esc(s)}</td><td><span class="tag ${r >= .7 ? 'ok' : r >= .5 ? 'sig' : 'bad'}">${g}/${t}</span></td><td class="small">${r >= .7 ? 'Acquis' : `<a href="#${c ? c.id : 'accueil'}">Revoir ce cours</a>`}</td></tr>`; }).join('')}</table></div>`; })() : ''}
      <div class="row"><button class="btn pri" id="qAgain">Recommencer (questions mélangées)</button>${meta.onNew ? '<button class="btn" id="qNew">Changer les paramètres</button>' : ''}</div>
      ${answers.some(a => !a.ok) ? `<div><h4 style="margin-bottom:6px">À revoir</h4><ol class="review">${answers.filter(a => !a.ok).map(a => `<li><b>${a.q.q}</b><br><span class="tag bad">votre réponse</span> ${a.q.o[a.j]}<br><span class="tag ok">bonne réponse</span> ${a.q.o[a.q.a]}<div class="small muted">${a.q.e || ''}</div></li>`).join('')}</ol></div>` : ''}</div>`;
    $('#qAgain', host).onclick = start;
    if (meta.onNew) $('#qNew', host).onclick = meta.onNew;
  };
  start();
}

  $('#exGo').onclick = () => runExam(body, +$('#exN').value);
}
let examTimer = null;
function runExam(body, n) {
  const pool = COURSES.flatMap(c => c.quiz.map(q => Object.assign({ src: c.short }, q)));
  const qs = shuffle(pool).slice(0, n).map(shuffleOpts);
  const ans = new Array(n).fill(null);
  let left = n * 90, k = 0;
  clearInterval(examTimer);
  const L = 'ABCDEFG';
  const fmt = s => `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
  const draw = () => {
    const q = qs[k];
    body.innerHTML = `<div class="card"><div class="q-top"><span class="tag">Question ${k + 1} / ${n}</span><span class="small muted">${ans.filter(a => a !== null).length} réponse(s)</span><span class="timer ${left < 120 ? 'low' : ''}" id="exT">${fmt(left)}</span></div>
      <div class="q-text">${q.q}</div><div class="opts">${q.o.map((o, j) => `<button class="opt ${ans[k] === j ? 'sel' : ''}" data-j="${j}"><span class="l">${L[j]}</span><span>${o}</span></button>`).join('')}</div>
      <div class="row" style="justify-content:space-between;margin-top:14px"><button class="btn" id="exP" ${k === 0 ? 'disabled' : ''}>← Précédente</button>
      <div class="dots" style="max-width:520px">${qs.map((_, m) => `<button data-m="${m}" class="${m === k ? 'on' : ''} ${ans[m] !== null ? 'seen' : ''}" aria-label="Question ${m + 1}"></button>`).join('')}</div>
      ${k < n - 1 ? '<button class="btn pri" id="exN2">Suivante →</button>' : '<button class="btn pri" id="exEnd">Rendre la copie</button>'}</div></div>`;
    $$('.opt', body).forEach(b => b.onclick = () => { ans[k] = +b.dataset.j; $$('.opt', body).forEach(x => x.classList.toggle('sel', x === b)); });
    $('#exP', body).onclick = () => { k--; draw(); };
    if ($('#exN2', body)) $('#exN2', body).onclick = () => { k++; draw(); };
    if ($('#exEnd', body)) $('#exEnd', body).onclick = () => { const miss = ans.filter(a => a === null).length; if (miss && !body.dataset.warned) { body.dataset.warned = 1; toast(`${miss} question(s) sans réponse. Cliquez encore pour rendre.`); return; } finish(); };
    $$('.dots button', body).forEach(b => b.onclick = () => { k = +b.dataset.m; draw(); });
  };
  const finish = () => {
    clearInterval(examTimer); delete body.dataset.warned;
    const good = qs.filter((q, m) => ans[m] === q.a).length;
    const note = Math.round(good / n * 15 * 4) / 4;
    const rec = { d: new Date().toLocaleString('fr-FR', { dateStyle: 'short', timeStyle: 'short' }), q: note };
    Store.data.exam = (Store.data.exam || []).concat(rec); Store.save();
    const bySrc = {};
    qs.forEach((q, m) => { bySrc[q.src] = bySrc[q.src] || [0, 0]; bySrc[q.src][1]++; if (ans[m] === q.a) bySrc[q.src][0]++; });
    body.innerHTML = `<div class="card stack"><h3>Partie 1 · QCM</h3><div class="row" style="gap:20px"><div class="score-big">${note.toString().replace('.', ',')}<span style="font-size:1.4rem">/15</span></div><div>${good} bonnes réponses sur ${n}.</div></div>
      <div class="tw"><table class="t"><tr><th>Cours</th><th>Réussite</th></tr>${Object.entries(bySrc).map(([s, [g, t]]) => `<tr><td>${esc(s)}</td><td><span class="tag ${g / t >= .7 ? 'ok' : g / t >= .5 ? 'sig' : 'bad'}">${g}/${t}</span></td></tr>`).join('')}</table></div>
      <details><summary class="btn sm" style="display:inline-flex">Voir la correction détaillée</summary><ol class="review">${qs.map((q, m) => `<li><b>${q.q}</b><br>${ans[m] === q.a ? '<span class="tag ok">juste</span>' : `<span class="tag bad">${ans[m] === null ? 'sans réponse' : 'faux : ' + q.o[ans[m]]}</span>`} <span class="tag ok">${q.o[q.a]}</span><div class="small muted">${q.e || ''}</div></li>`).join('')}</ol></details>
      </div><div class="card stack" id="devPart" style="margin-top:18px"></div>`;
    runDev($('#devPart', body), rec);
  };
  examTimer = setInterval(() => { left--; const t = $('#exT'); if (!t) { clearInterval(examTimer); return; } t.textContent = fmt(left); t.classList.toggle('low', left < 120); if (left <= 0) finish(); }, 1000);
  draw();
}
function runDev(host, rec) {
  const picks = shuffle(DEV_QUESTIONS).slice(0, 2);
  host.innerHTML = `<h3>Partie 2 · Questions à développement (5 points)</h3><p class="muted small">Rédigez votre réponse, puis affichez le corrigé et cochez honnêtement les éléments présents dans votre copie. Chaque question vaut 2,5 points.</p>` +
    picks.map((d, k) => `<div class="ex"><div class="ex-h"><span class="n">Q${k + 1}</span><h4>${d.q}</h4></div><div class="ex-b"><textarea class="in" rows="6" id="dv${k}" placeholder="Votre réponse…" style="font-family:var(--f-body)"></textarea><button class="btn" data-show="${k}" style="justify-self:start">Afficher le corrigé et s’auto-évaluer</button><div class="dv-sol" id="dvs${k}" hidden><div class="sol">${d.model}</div><div style="margin-top:8px"><b class="small">Ma copie contient :</b>${d.crit.map((cr, j) => `<label class="cls-row" style="cursor:pointer"><span><input type="checkbox" data-q="${k}" data-w="${cr[1]}"> ${cr[0]}</span><span class="tag">${String(cr[1]).replace('.', ',')} pt</span><span></span></label>`).join('')}</div></div></div></div>`).join('') +
    `<div class="row"><button class="btn pri" id="dvScore">Calculer ma note finale</button></div><div id="dvRes"></div>`;
  $$('[data-show]', host).forEach(b => b.onclick = () => { $('#dvs' + b.dataset.show).hidden = false; b.remove(); });
  $('#dvScore', host).onclick = () => {
    const pts = Math.min(5, $$('input[type=checkbox]:checked', host).reduce((s, cb) => s + +cb.dataset.w, 0));
    rec.dv = pts; rec.t = Math.round((rec.q + pts) * 4) / 4; Store.save();
    $('#dvRes', host).innerHTML = `<div class="fb ${rec.t >= 10 ? 'ok' : 'bad'}"><b>Note finale estimée : ${String(rec.t).replace('.', ',')} / 20</b> (QCM ${String(rec.q).replace('.', ',')} + développement ${String(pts).replace('.', ',')}). ${rec.t >= 14 ? 'Très bon niveau.' : rec.t >= 10 ? 'Admis, avec des points à consolider.' : 'Insuffisant : ciblez les cours en rouge dans le tableau ci-dessus.'}</div>`;
  };
}

function renderCas(host, c) {

function renderQuizGeneral(main) {
  const total = COURSES.reduce((s, c) => s + c.quiz.length, 0);
  main.innerHTML = `<div class="wrap"><header class="c-head"><div class="eyebrow">RÉVISION</div><h2>Quiz général</h2>

  const body = $('#qgBody');
  const setup = () => {
    body.innerHTML = `<div class="card stack"><h3>Paramètres</h3>
      <div><span class="lbl">Cours inclus</span><div class="grid3" style="gap:6px">${COURSES.map(c => `<label class="small"><input type="checkbox" data-c="${c.id}" checked> ${c.num} · ${esc(c.short)} <span class="muted">(${c.quiz.length})</span></label>`).join('')}</div>
      <div class="row" style="margin-top:6px"><button class="btn sm" id="qgAll">Tout cocher</button><button class="btn sm" id="qgNone">Tout décocher</button></div></div>
      <div><label class="lbl" for="qgN">Nombre de questions</label><select class="in" id="qgN"><option value="20">20 questions (≈ 15 min)</option><option value="40" selected>40 questions (≈ 30 min)</option><option value="all">Toutes les questions des cours cochés</option></select></div>
      <div class="row"><button class="btn pri" id="qgGo">Commencer le quiz général</button><span class="small muted" id="qgInfo"></span></div>
      ${Store.data.quiz.general ? `<p class="small muted" style="margin:0">Meilleur score enregistré : ${Store.data.quiz.general} %</p>` : ''}</div>`;
    const info = () => { const n = COURSES.filter(c => $(`[data-c="${c.id}"]`, body).checked).reduce((s, c) => s + c.quiz.length, 0); $('#qgInfo', body).textContent = `${n} question(s) disponibles sur ${total}`; $('#qgGo', body).disabled = n === 0; };
    $$('[data-c]', body).forEach(cb => cb.onchange = info);

    $('#qgNone', body).onclick = () => { $$('[data-c]', body).forEach(cb => cb.checked = false); info(); };
    $('#qgGo', body).onclick = () => {

      ['Numéros de séquence TCP', 'Le client choisit le numéro de séquence initial 100, le serveur 300.<br>a) Écrivez les trois segments de la poignée de main avec leurs champs seq et ack.<br>b) Le client envoie ensuite 500 octets. Quel est le numéro de séquence de ce segment ? Quel ack renvoie le serveur ?<br>c) Que se passe-t-il si cet ACK n’arrive jamais ?', 'a) SYN (seq = 100) ; SYN-ACK (seq = 300, ack = 101) ; ACK (seq = 101, ack = 301).<br>b) seq = 101 ; le serveur répond ack = <b>601</b> (prochain octet attendu).<br>c) À l’expiration du délai de retransmission, le client <b>renvoie</b> le segment ; le serveur, qui l’a peut-être déjà reçu, élimine le doublon grâce au numéro de séquence.'],
      ['TCP ou UDP ? Justifiez.', 'a) Mise à jour de 2 Go d’un logiciel · b) Diffusion en direct d’un match à la radio · c) Requête DNS · d) Dépôt d’un devoir sur la plateforme de l’école · e) Partie de jeu en ligne · f) Session SSH.', 'TCP : a, d, f (chaque octet compte, l’ordre est indispensable). UDP : b, e (un retard est pire qu’une perte), c (une requête et une réponse courtes ; on réessaie simplement en cas de perte).'],
      ['Lire un dialogue SMTP', `<pre class="code">S: 220 mx.exemple.ml ESMTP
C: EHLO pc.estm.ml
S: 250 OK
C: MAIL FROM:&lt;awa@estm.ml&gt;
S: 250 OK
C: RCPT TO:&lt;inconnu@exemple.ml&gt;
S: 550 5.1.1 Utilisateur inconnu
C: QUIT
S: 221 Au revoir</pre>a) Que signifient les familles de codes 2xx, 3xx, 5xx ?<br>b) Pourquoi le message n’a-t-il pas été envoyé ?<br>c) Quelle commande manque pour transmettre un contenu ?`, 'a) 2xx : succès ; 3xx : continuez (ex. 354 après DATA) ; 5xx : erreur permanente, inutile de réessayer.<br>b) Le serveur a refusé le destinataire (code 550, utilisateur inconnu).<br>c) <code>DATA</code>, suivi du message et d’une ligne contenant un point seul.'],
      ['Interpréter netstat', `Sur un PC, la commande <code>netstat -n</code> affiche :<pre class="code">TCP  192.168.1.10:51432  196.200.60.10:443   ESTABLISHED
TCP  192.168.1.10:51440  41.73.112.5:80      TIME_WAIT
UDP  192.168.1.10:60123  8.8.8.8:53</pre>a) Identifiez pour chaque ligne le socket local, le socket distant et le service probable.<br>b) Pourquoi les ports locaux sont-ils si élevés ?`, 'a) Ligne 1 : connexion HTTPS (443) vers 196.200.60.10, établie. Ligne 2 : connexion HTTP (80) en cours de fermeture. Ligne 3 : requête DNS (53) vers 8.8.8.8, en UDP (pas d’état de connexion).<br>b) Ce sont des <b>ports éphémères</b> choisis par le système du client dans la plage dynamique ; seul le serveur écoute sur un port bien connu.'],
      ['POP3, IMAP ou les deux ?', 'Un enseignant consulte son courriel au bureau, chez lui et sur son téléphone. Son collègue n’utilise qu’un vieux PC hors ligne la plupart du temps et veut garder ses courriels même si le serveur est supprimé. Que conseillez-vous à chacun ?', 'Le premier : <b>IMAP</b> (synchronisation entre appareils). Le second : <b>POP3</b> avec copie locale (et éventuellement « laisser une copie sur le serveur »), puisqu’il veut tout conserver localement et travaille hors ligne.']
    ]
  },
  videos: [
    ['Comprendre les modèles OSI et TCP/IP', '26jazyc7VNk', 'Français', 'Notez les 7 couches OSI et les 4 couches TCP/IP, puis la définition des PDU (unités de données de protocole).'],
    ['Comprendre facilement le modèle TCP/IP : encapsulation et désencapsulation', 'lap7XuqkwcU', 'Français', 'Refaites ensuite la démonstration « Encapsulation » du cours et comparez.'],
    ['Rôle des ports réseaux, des adresses IP et MAC', 'wThPXsKz36s', 'Français', 'Repérez quelles adresses changent à chaque routeur (MAC) et lesquelles restent identiques de bout en bout (IP, ports).']
  ]
};

EXTRAS['adressage'] = {
  tp: {
    t: 'Plan d’adressage et réseau d’école sur Cisco Packet Tracer', duree: '3 séances de 2 h', equipe: '2 à 3 étudiants',
    contexte: 'L’annexe de l’école à Ségou ouvre. On vous attribue le bloc <code>172.16.0.0/22</code>. Il faut un réseau Wi-Fi étudiants (200 appareils), un laboratoire TIC (100 postes), l’administration (50 postes), une salle serveurs (10 machines) et une liaison point à point vers le routeur du FAI.',
    objectifs: ['Découper un bloc d’adresses en sous-réseaux de tailles variables (VLSM)', 'Configurer adresses, passerelles et DNS', 'Tester la connectivité et la résolution de noms', 'Lire une table de routage'],
    outils: ['Cisco Packet Tracer (gratuit avec un compte Cisco Networking Academy)', 'Invite de commandes : ipconfig, ping, tracert, nslookup'],
    etapes: [
      ['Calculer le plan VLSM', 'Classez les besoins du plus grand au plus petit et attribuez à chacun le plus petit préfixe suffisant. Remplissez un tableau : réseau, préfixe, masque, 1re et dernière adresse utilisable, diffusion, passerelle.'],
      ['Construire la topologie', 'Un routeur, un commutateur par sous-réseau, quelques PC dans chaque sous-réseau, un serveur dans la salle serveurs, un second routeur qui joue le FAI.'],
      ['Configurer le routeur', 'Une interface (ou sous-interface) par sous-réseau, avec la première adresse comme passerelle. Ajoutez une route par défaut vers le routeur du FAI : <code>ip route 0.0.0.0 0.0.0.0 &lt;adresse du FAI&gt;</code>.'],
      ['Adresser les postes', 'Adressage statique pour les serveurs ; activez un pool DHCP sur le routeur pour le Wi-Fi étudiants (bonus).'],
      ['Mettre en place le DNS', 'Sur le serveur, activez le service DNS et créez un enregistrement A <code>www.estm.ml</code> pointant vers le serveur web. Indiquez ce DNS dans la configuration des PC.'],
      ['Tester', 'Depuis un PC du labo : <code>ping</code> vers la passerelle, vers un PC de l’administration, vers le serveur ; <code>tracert</code> vers le routeur FAI ; <code>nslookup www.estm.ml</code> ; ouvrez la page web du serveur dans le navigateur de Packet Tracer.'],
      ['Observer le routage', 'Sur le routeur : <code>show ip route</code>. Expliquez chaque ligne (C, L, S, S*). Passez en mode Simulation et suivez un paquet ICMP couche par couche.'],
      ['Sur votre vrai PC', 'Relevez avec <code>ipconfig /all</code> (Windows) ou <code>ip a</code> (Linux) : votre adresse, masque, passerelle, DNS. Est-elle privée ? Faites <code>tracert 8.8.8.8</code> et comptez les sauts.']
    ],
    livrables: ['Tableau du plan d’adressage', 'Fichier .pkt Packet Tracer', 'Rapport avec captures des tests et explication de la table de routage'],
    bareme: [['Plan VLSM juste et sans chevauchement', 6], ['Topologie et configuration fonctionnelles', 5], ['DNS opérationnel', 2], ['Tests documentés (ping, tracert, nslookup)', 3], ['Explication de la table de routage', 2], ['Analyse de la configuration du vrai PC', 2]],
    solution: 'Plan possible : Wi-Fi 172.16.0.0/24 (254 adresses) · Labo 172.16.1.0/25 (126) · Administration 172.16.1.128/26 (62) · Serveurs 172.16.1.192/28 (14) · Liaison FAI 172.16.1.208/30 (2). Reste libre : 172.16.1.212 à 172.16.3.255 pour les extensions.'
  },
  cas: {
    t: '« Le site de l’école ne marche plus ! »',
    contexte: `<p>Lundi matin, après la migration du site <code>www.estm.ml</code> vers un nouveau serveur (nouvelle adresse <code>196.200.60.20</code>), les appels se multiplient : certains utilisateurs voient le site, d’autres non. Le technicien relève ces sorties de commandes depuis deux postes.</p>`,
    donnees: `<pre class="code">Poste A (réseau de l’école)
&gt; ping www.estm.ml
La requête Ping n’a pas pu trouver l’hôte www.estm.ml.
&gt; ping 196.200.60.20
Réponse de 196.200.60.20 : octets=32 temps=3 ms TTL=62
&gt; nslookup www.estm.ml
Serveur :  ns.estm.local
*** ns.estm.local ne parvient pas à trouver www.estm.ml : Non-existent domain

Poste B (chez un étudiant, opérateur mobile)
&gt; nslookup www.estm.ml
Réponse ne faisant pas autorité :
Nom :    www.estm.ml
Address: 196.200.60.10     ← ancienne adresse</pre>
      <p class="small">Le technicien admet avoir supprimé l’ancien enregistrement A pendant la migration, sans encore créer le nouveau. Le TTL de l’ancien enregistrement était de 86 400 s.</p>`,
    questions: [
      ['Le problème est-il un problème de réseau (connectivité IP) ou de nommage ? Justifiez avec les sorties.', 'De <b>nommage (DNS)</b> : le <code>ping</code> vers l’adresse IP répond (la couche réseau fonctionne), mais la résolution du nom échoue (NXDOMAIN, « Non-existent domain »).'],
      ['Pourquoi le poste B obtient-il une adresse, et pourquoi est-ce l’ancienne ?', 'Le résolveur de l’opérateur mobile a gardé l’ancienne réponse <b>en cache</b> : réponse « ne faisant pas autorité ». Elle restera jusqu’à 86 400 s (24 h) après sa mise en cache. L’étudiant arrive donc sur l’ancien serveur.'],
      ['Que doit faire le technicien maintenant, dans l’ordre ?', '1) Créer l’enregistrement A <code>www.estm.ml → 196.200.60.20</code> sur le serveur faisant autorité. 2) Vérifier avec <code>nslookup www.estm.ml &lt;serveur faisant autorité&gt;</code>. 3) Vider le cache du DNS interne (et des postes : <code>ipconfig /flushdns</code>). 4) Laisser l’ancien serveur en service (ou une redirection) le temps que les caches externes expirent.'],
      ['Comment aurait-il fallu préparer la migration pour éviter la panne ?', 'Quelques jours avant, <b>abaisser le TTL</b> (ex. 300 s) ; le jour J, <b>modifier</b> l’enregistrement (ne jamais le supprimer) ; garder les deux serveurs actifs pendant la transition ; remonter le TTL ensuite.'],
      ['Quelle commande aurait permis de voir le TTL restant dans le cache ?', '<code>dig www.estm.ml</code> (Linux, macOS) : la deuxième colonne de la réponse indique le TTL restant en secondes. Sous Windows : <code>nslookup -debug www.estm.ml</code> ou <code>Resolve-DnsName www.estm.ml</code> en PowerShell.']
    ]
  },
  td: {
    t: 'TD 2 · Adressage IPv4, sous-réseaux, IPv6, routage',
    exos: [
      ['Conversions', 'Convertissez en binaire : 10, 127, 172, 224, 255. Convertissez en décimal : 11000000, 10101000, 00011110, 11111100.', '10 = 00001010 ; 127 = 01111111 ; 172 = 10101100 ; 224 = 11100000 ; 255 = 11111111. 11000000 = 192 ; 10101000 = 168 ; 00011110 = 30 ; 11111100 = 252.'],
      ['Analyse d’adresses', 'Pour chaque adresse, donnez classe, type (privée, publique, bouclage, multicast) et validité : 10.255.0.1 · 172.31.200.4 · 192.169.1.1 · 127.0.0.53 · 239.1.1.1 · 300.1.2.3.', '10.255.0.1 : A, privée · 172.31.200.4 : B, privée (172.16-172.31) · 192.169.1.1 : C, publique · 127.0.0.53 : bouclage · 239.1.1.1 : D, multicast · 300.1.2.3 : invalide (300 &gt; 255).'],
      ['Découpage en sous-réseaux', 'On découpe 192.168.10.0/24 en 4 sous-réseaux de même taille. Donnez pour chacun : préfixe, adresse réseau, plage utilisable, diffusion. Combien d’hôtes par sous-réseau ?', 'Il faut 2 bits de plus : /26, masque 255.255.255.192, 62 hôtes. 192.168.10.0 (.1-.62, diff .63) · .64 (.65-.126, diff .127) · .128 (.129-.190, diff .191) · .192 (.193-.254, diff .255).'],
      ['VLSM', 'À partir de 10.0.8.0/22, servez dans cet ordre : réseau A 300 hôtes, B 120 hôtes, C 60 hôtes, D 2 hôtes.', 'A : /23 (510 hôtes) → 10.0.8.0/23 (diff 10.0.9.255). B : /25 → 10.0.10.0/25. C : /26 → 10.0.10.128/26. D : /30 → 10.0.10.192/30. Reste 10.0.10.196 à 10.0.11.255.'],
      ['IPv6', 'a) Abrégez : 2001:0db8:0000:0000:0001:0000:0000:0001.<br>b) Développez : fe80::1:2.<br>c) Pourquoi « 2001:db8::1::2 » est-il invalide ?', 'a) <b>2001:db8::1:0:0:1</b> (on remplace la première plus longue suite de zéros ; à égalité, la première).<br>b) fe80:0000:0000:0000:0000:0000:0001:0002.<br>c) Deux « :: » : impossible de savoir combien de groupes nuls chacun représente.'],
      ['Table de routage', `<pre class="code">Destination        Passerelle      Interface
10.1.0.0/16        192.168.0.2     eth1
10.1.5.0/24        192.168.0.3     eth1
192.168.0.0/24     directe         eth1
0.0.0.0/0          41.73.0.1       eth0</pre>Par où part un paquet vers : 10.1.5.9 ? 10.1.7.1 ? 192.168.0.40 ? 8.8.8.8 ?`, '10.1.5.9 → 192.168.0.3 (le /24 est plus précis que le /16 : préfixe le plus long). 10.1.7.1 → 192.168.0.2. 192.168.0.40 → livraison directe sur eth1. 8.8.8.8 → route par défaut, 41.73.0.1.'],
      ['Résolution DNS', 'Remettez dans l’ordre la résolution de <code>mail.univ.sn</code> par un résolveur au cache vide, et indiquez pour chaque échange si la requête est récursive ou itérative : a) serveur de .sn · b) poste → résolveur · c) serveur faisant autorité de univ.sn · d) serveur racine · e) résolveur → poste.', 'b (récursive) → d (itérative) → a (itérative) → c (itérative) → e (réponse finale, mise en cache par le résolveur).']
    ]
  },
  videos: [
    ['Base adressage IP : calcul du masque, VLSM, notation CIDR', '_Obg3p_dclI', 'Français', 'Refaites les exemples de la vidéo avec la calculatrice IPv4 du cours pour vérifier vos résultats.'],
    ['Sous-réseaux : exercices corrigés avec le ET logique', 'zt-gCIR4ZPs', 'Français', 'Arrêtez la vidéo avant chaque correction et cherchez seul.'],
    ['Comprendre le DNS en 5 minutes', 'qzWdzAvfBoo', 'Français', 'Identifiez dans la vidéo le résolveur, le serveur racine, le TLD et le serveur faisant autorité.']
  ]
};

EXTRAS['web'] = {
  tp: {
    t: 'Le site du club informatique : HTML, CSS, JavaScript et HTTP', duree: '3 séances de 2 h + finitions', equipe: '3 étudiants',
    contexte: 'Le club informatique de l’école veut un petit site : présentation, activités, inscription. Vous le concevez, le testez avec les outils de développement du navigateur et l’analysez du point de vue HTTP.',
    objectifs: ['Structurer des pages en HTML sémantique', 'Mettre en page en CSS de façon adaptative (mobile)', 'Valider un formulaire en JavaScript', 'Charger des données JSON', 'Analyser les échanges HTTP'],
    outils: ['Éditeur de code (VS Code)', 'Navigateur et ses outils de développement (F12)', 'Python pour un serveur local : <code>python -m http.server 8000</code>', 'Validateur du W3C : validator.w3.org'],
    etapes: [
      ['Maquette', 'Dessinez sur papier les 3 pages (Accueil, Activités, Inscription) en version ordinateur et téléphone.'],
      ['HTML', 'Écrivez les 3 pages avec <code>header</code>, <code>nav</code>, <code>main</code>, <code>footer</code>, des titres hiérarchisés et des images avec <code>alt</code>. Faites-les passer sans erreur au validateur du W3C.'],
      ['CSS', 'Une seule feuille <code>style.css</code> : palette de 3 couleurs, menu en flexbox, grille des activités en CSS grid, une <code>@media (max-width: 600px)</code> pour le mobile.'],
      ['JavaScript', 'Sur la page Inscription : validation (nom obligatoire, courriel se terminant par @estm.ml, niveau choisi) avec messages d’erreur sous chaque champ ; bouton de menu pour mobile.'],
      ['Données JSON', 'Créez <code>activites.json</code> (tableau d’objets titre, date, lieu). Chargez-le avec <code>fetch(\'activites.json\')</code> et affichez les cartes dynamiquement. Lancez le site avec <code>python -m http.server 8000</code> et ouvrez <code>http://localhost:8000</code>.'],
      ['Analyse HTTP', 'Onglet Réseau des outils de développement : rechargez la page. Pour chaque ressource, relevez méthode, code de statut, type, taille, temps. Provoquez volontairement un 404 et un 304 (rechargement simple).'],

    livrables: ['Dossier du site (HTML, CSS, JS, JSON, XML)', 'Captures du validateur et de l’onglet Réseau', 'Rapport de 3 pages : choix techniques, tableau des requêtes HTTP, comparaison JSON / XML'],
    bareme: [['HTML sémantique et valide', 4], ['CSS et adaptation mobile', 4], ['Validation JavaScript fonctionnelle', 3], ['Chargement JSON dynamique', 3], ['Analyse HTTP (codes, en-têtes, cache)', 4], ['Comparaison JSON / XML', 2]]
  },
  cas: {
    t: 'Pourquoi la page d’inscription est-elle lente et cassée ?',
    contexte: `<p>Le service de scolarité se plaint : la nouvelle page d’inscription en ligne s’affiche sans mise en forme, met 40 secondes à charger en 3G, affiche un cadenas barré, et le bouton « Valider » renvoie une erreur. Voici l’onglet Réseau du navigateur.</p>`,
    donnees: `<div class="tw"><table class="t small mono"><tr><th>Méthode</th><th>URL</th><th>Statut</th><th>Type</th><th>Taille</th></tr>
      <tr><td>GET</td><td>https://inscription.estm.ml/</td><td>200</td><td>html</td><td>6 Ko</td></tr><tr><td>GET</td><td>https://inscription.estm.ml/css/styles.css</td><td>404</td><td>html</td><td>1 Ko</td></tr>
      <tr><td>GET</td><td>https://inscription.estm.ml/img/campus.png</td><td>200</td><td>png</td><td>4,8 Mo</td></tr><tr><td>GET</td><td>http://cdn.exemple.com/jquery.js</td><td>(bloqué)</td><td>script</td><td>0</td></tr>
      <tr><td>POST</td><td>https://inscription.estm.ml/api/inscription</td><td>500</td><td>json</td><td>0,2 Ko</td></tr></table></div>
      <p class="small">Le fichier sur le serveur s’appelle <code>css/style.css</code>. Réponse du POST : <code>{"erreur":"SQLSTATE[42S22]: Column not found: 'telephone'"}</code>.</p>`,
    questions: [
      ['Pourquoi la page n’a-t-elle aucune mise en forme ?', 'La feuille de style est demandée à <code>css/styles.css</code> mais s’appelle <code>style.css</code> : réponse <b>404</b>. Corriger le lien <code>&lt;link href="css/style.css"&gt;</code>.'],
      ['Pourquoi le chargement est-il si long en 3G ? Que proposez-vous ?', 'Une image de <b>4,8 Mo</b>. En 3G à 1 Mbit/s, il faut environ 4,8 × 8 = 38 s rien que pour elle. Solutions : redimensionner (1 200 px de large suffisent), compresser en JPEG ou WebP (&lt; 200 Ko), attribut <code>loading="lazy"</code>, différentes tailles avec <code>srcset</code>.'],
      ['Pourquoi le cadenas est-il barré et que devient le script jQuery ?', 'La page est en HTTPS mais charge un script en <b>HTTP</b> : <b>contenu mixte</b>. Le navigateur bloque le script (un attaquant pourrait le modifier en route). Charger la ressource en HTTPS ou l’héberger sur le même serveur.'],
      ['Le bouton Valider renvoie 500. À qui la faute ? Que révèle le message ?', '5xx = erreur <b>côté serveur</b>. Le code tente d’écrire une colonne <code>telephone</code> absente de la table : la base n’a pas été mise à jour (migration oubliée). Par ailleurs, renvoyer le message SQL détaillé au client est une <b>fuite d’information</b> : il faut journaliser l’erreur côté serveur et renvoyer un message générique.'],
      ['Rédigez la liste des corrections, par ordre de priorité.', '1) Corriger l’erreur 500 (ajouter la colonne, tester) et masquer les messages techniques. 2) Corriger le chemin CSS. 3) Supprimer le contenu mixte. 4) Optimiser l’image. 5) Ajouter la mise en cache des ressources statiques (en-têtes Cache-Control) et retester en simulant une connexion 3G dans les outils de développement.']
    ]
  },
  td: {
    t: 'TD 3 · URL, HTML, CSS, XML, HTTP',
    exos: [
      ['Décomposer des URL', 'Pour <code>https://www.estm.ml:8443/cours/web/tp1.html?groupe=B&amp;annee=2026#exercice3</code> et <code>ftp://depot.estm.ml/sujets/2026/</code>, donnez schéma, hôte, port (explicite ou par défaut), chemin, requête, fragment.', 'URL 1 : https · www.estm.ml · 8443 · /cours/web/tp1.html · groupe=B&amp;annee=2026 · exercice3. URL 2 : ftp · depot.estm.ml · 21 par défaut · /sujets/2026/ · aucune · aucun.'],
      ['Écrire du HTML', 'Écrivez le HTML d’un tableau de 3 colonnes (Module, Coefficient, Note) avec une ligne d’en-tête et deux lignes de données, suivi d’un lien vers la page <code>notes.html</code> qui s’ouvre dans le même onglet.', '<pre class="code">&lt;table&gt;\n  &lt;tr&gt;&lt;th&gt;Module&lt;/th&gt;&lt;th&gt;Coefficient&lt;/th&gt;&lt;th&gt;Note&lt;/th&gt;&lt;/tr&gt;\n  &lt;tr&gt;&lt;td&gt;Réseaux&lt;/td&gt;&lt;td&gt;3&lt;/td&gt;&lt;td&gt;15&lt;/td&gt;&lt;/tr&gt;\n  &lt;tr&gt;&lt;td&gt;Web&lt;/td&gt;&lt;td&gt;2&lt;/td&gt;&lt;td&gt;17&lt;/td&gt;&lt;/tr&gt;\n&lt;/table&gt;\n&lt;a href="notes.html"&gt;Toutes mes notes&lt;/a&gt;</pre>'],
      ['Cascade CSS', '<pre class="code">p { color: black; }\n.intro { color: blue; }\n#accueil p { color: green; }\np.intro { color: red; }</pre>De quelle couleur est <code>&lt;p class="intro"&gt;</code> placé dans <code>&lt;div id="accueil"&gt;</code> ? Et un <code>&lt;p class="intro"&gt;</code> hors de ce div ?', 'Dans #accueil : <b>vert</b>, car un sélecteur avec un identifiant (#accueil p) est plus spécifique que p.intro. Hors du div : <b>rouge</b>, car p.intro (balise + classe) est plus spécifique que .intro seul.'],

      ['Lire une réponse HTTP', '<pre class="code">HTTP/1.1 301 Moved Permanently\nLocation: https://www.estm.ml/\nContent-Length: 0</pre>a) Que va faire le navigateur ? b) Pourquoi un site renvoie-t-il souvent cette réponse sur le port 80 ? c) Différence avec 302 ?', 'a) Il envoie automatiquement une nouvelle requête vers https://www.estm.ml/. b) Pour <b>forcer HTTPS</b> : toute visite en HTTP est redirigée. c) 301 = définitif (le navigateur et les moteurs de recherche mémorisent la nouvelle adresse) ; 302 = temporaire.'],

      <div class="note fix" style="margin:8px 0"><b>SMS reçu</b>KAFO FINANCE : votre compte sera suspendu sous 24 h. Confirmez votre identité : https://kafofinance-ml.secure-verif.com/connexion</div>

    questions: [

    contexte: 'La bibliothèque gère encore ses prêts sur un cahier. Vous concevez la base relationnelle, la remplissez, écrivez les requêtes utiles au bibliothécaire, puis montrez le danger de l’injection SQL et sa parade.',
    objectifs: ['Concevoir un schéma avec clés primaires et étrangères', 'Écrire des requêtes SQL de lecture, de mise à jour et d’agrégation', 'Utiliser une transaction', 'Démontrer et corriger une injection SQL'],
    outils: ['SQLite + DB Browser for SQLite (gratuit) ou MySQL/MariaDB', 'Python 3 (module sqlite3 inclus)', 'La console SQL du cours pour s’entraîner'],
    etapes: [

      ['Transaction', 'Écrivez l’emprunt d’un livre comme une transaction : <code>BEGIN;</code> décrémenter <code>exemplaires_dispo</code>, insérer l’emprunt, <code>COMMIT;</code>. Montrez qu’avec 0 exemplaire, la contrainte CHECK fait échouer l’ensemble (<code>ROLLBACK</code>).'],
