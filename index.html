  cas: {
    t: '« WaxBko », une boutique en ligne de pagnes à Bamako',
    contexte: `<p>Une jeune entreprise vend des pagnes wax, des bazins et des vêtements sur mesure en ligne. Paiement par Orange Money, Moov Money ou à la livraison. Elle prévoit 50 000 visiteurs par mois et veut des recommandations « les clients qui ont acheté ceci ont aussi aimé… ».</p>`,
    donnees: `<div class="tw"><table class="t small"><tr><th>Besoin</th><th>Particularité</th></tr>
      <tr><td>Catalogue</td><td>Attributs très variables : un pagne a un motif et une longueur en yards, une tenue sur mesure a des mesures du client, un sac n’a rien de tout cela</td></tr>
      <tr><td>Commandes et paiements</td><td>Ne jamais encaisser deux fois, ne jamais perdre une commande payée</td></tr>
      <tr><td>Panier et sessions</td><td>Très nombreuses lectures/écritures, données temporaires</td></tr>
      <tr><td>Recommandations</td><td>Relations client → achat → produit → autres clients</td></tr>
      <tr><td>Statistiques de visites</td><td>Des millions d’événements horodatés</td></tr></table></div>`,
    questions: [
      ['Quel type de base pour les commandes et paiements ? Pourquoi ?', 'Une base <b>relationnelle</b> (PostgreSQL, MySQL) : transactions <b>ACID</b> indispensables (atomicité du paiement + création de la commande, durabilité après validation), contraintes d’intégrité, jointures pour la comptabilité.'],
      ['Comment stocker le catalogue aux attributs variables ?', 'Une base <b>orientée documents</b> (MongoDB) où chaque produit est un document JSON avec ses propres champs. Variante relationnelle : une colonne JSON (PostgreSQL <code>jsonb</code>) pour les attributs spécifiques.'],
      ['Et le panier, les sessions, les recommandations, les statistiques ?', 'Panier et sessions : <b>clé-valeur</b> en mémoire (Redis), avec expiration automatique. Recommandations : base <b>graphe</b> (Neo4j) ou calcul périodique à partir des commandes. Statistiques : base <b>colonnes</b> ou outil d’analyse adapté aux séries temporelles.'],
      ['Utiliser plusieurs bases s’appelle la « persistance polyglotte ». Quel est son principal inconvénient pour une petite équipe ?', 'Plus de systèmes à installer, sauvegarder, sécuriser et surveiller, et des données à synchroniser. Pour démarrer, une seule base PostgreSQL (tables + colonnes JSON) et un cache Redis suffisent largement ; on ajoutera d’autres bases si un besoin réel apparaît.'],
      ['Le formulaire de recherche du site est vulnérable à l’injection SQL. Que risque l’entreprise et comment corriger ?', 'Lecture de toute la base (clients, téléphones, adresses), modification de prix ou de commandes, voire suppression de tables. Correction : <b>requêtes préparées</b> partout, compte de base de données aux droits minimaux, validation des entrées, et sanctions possibles au titre de la protection des données personnelles en cas de fuite.']

  td: {
    t: 'TD 5 · SQL et conception',

    exos: [
      ['Requêtes simples', 'Écrivez les requêtes : a) nom et prénom des étudiants de la filière Réseaux ; b) étudiants dont la moyenne est entre 12 et 15 ; c) villes distinctes, par ordre alphabétique ; d) étudiants dont le nom commence par « K ».', 'a) <code>SELECT nom, prenom FROM etudiants WHERE filiere = \'Réseaux\';</code><br>b) <code>SELECT * FROM etudiants WHERE moyenne BETWEEN 12 AND 15;</code><br>c) <code>SELECT DISTINCT ville FROM etudiants ORDER BY ville;</code><br>d) <code>SELECT * FROM etudiants WHERE nom LIKE \'K%\';</code>'],
      ['Agrégats', 'a) Nombre d’étudiants par ville. b) Meilleure et plus faible moyenne de chaque filière. c) Filières dont la moyenne générale dépasse 13.', 'a) <code>SELECT ville, COUNT(*) FROM etudiants GROUP BY ville;</code><br>b) <code>SELECT filiere, MAX(moyenne), MIN(moyenne) FROM etudiants GROUP BY filiere;</code><br>c) <code>SELECT filiere, AVG(moyenne) FROM etudiants GROUP BY filiere HAVING AVG(moyenne) &gt; 13;</code>'],
      ['Jointures', 'a) Prénom de l’étudiant, intitulé du cours et note, pour toutes les inscriptions. b) Nombre d’inscrits par intitulé de cours. c) Étudiants inscrits à aucun cours.', 'a) <code>SELECT e.prenom, c.intitule, i.note FROM inscriptions i JOIN etudiants e ON e.id = i.etudiant_id JOIN cours c ON c.code = i.cours_code;</code><br>b) <code>SELECT c.intitule, COUNT(*) FROM cours c JOIN inscriptions i ON i.cours_code = c.code GROUP BY c.code;</code><br>c) <code>SELECT e.* FROM etudiants e LEFT JOIN inscriptions i ON i.etudiant_id = e.id WHERE i.etudiant_id IS NULL;</code>'],
      ['Mises à jour', 'a) Ajouter l’étudiant Hawa Maïga (TIC, Gao, 14,5). b) Augmenter de 0,5 point la moyenne des étudiants de Kayes. c) Supprimer les inscriptions dont la note est NULL. d) Pourquoi faut-il être très prudent avec UPDATE et DELETE sans WHERE ?', 'a) <code>INSERT INTO etudiants (id, nom, prenom, filiere, ville, moyenne) VALUES (11, \'Maïga\', \'Hawa\', \'TIC\', \'Gao\', 14.5);</code><br>b) <code>UPDATE etudiants SET moyenne = moyenne + 0.5 WHERE ville = \'Kayes\';</code><br>c) <code>DELETE FROM inscriptions WHERE note IS NULL;</code><br>d) Sans WHERE, la commande s’applique à <b>toutes</b> les lignes de la table.'],
      ['Repérer la redondance', 'Une table unique <code>notes(matricule, nom, prenom, filiere, code_cours, intitule_cours, credits, note)</code> contient une ligne par note. Quels problèmes cela pose-t-il ? Proposez un découpage.', 'Le nom de l’étudiant et l’intitulé du cours sont répétés à chaque note : risques d’incohérence (une faute corrigée sur une ligne et pas sur les autres), gaspillage, impossibilité d’enregistrer un cours sans note. Découpage : <code>etudiants</code>, <code>cours</code>, <code>inscriptions</code> (les trois tables du cours), reliées par clés étrangères.'],

  tp: {

    contexte: 'Le site du club informatique (TP du cours 3) doit être mis en ligne. Vous comparez deux approches : un hébergement de site statique (proche du PaaS/SaaS) et une machine virtuelle (IaaS), puis vous estimez le coût d’une version plus ambitieuse.',
    objectifs: ['Distinguer concrètement PaaS et IaaS', 'Choisir une région et justifier le choix', 'Ouvrir uniquement les ports nécessaires', 'Estimer et maîtriser un coût cloud'],
    outils: ['Un service d’hébergement de site statique (ex. GitHub Pages)', 'Le compte étudiant ou l’offre d’essai d’un fournisseur (AWS, Azure ou Google Cloud ; vérifiez les conditions en vigueur et n’entrez pas de carte bancaire sans accord)', 'Le calculateur de prix officiel du fournisseur', 'ping, tracert'],
    etapes: [
      ['Hébergement statique', 'Publiez le dossier du site sur un service de site statique. Notez : ce que vous avez configuré vous-même, ce que le service gère pour vous, l’URL obtenue, le certificat HTTPS fourni.'],
      ['Choisir une région', 'Listez les régions du fournisseur choisi les plus proches de Bamako (Europe de l’Ouest, Afrique du Sud…). Mesurez la latence (<code>ping</code> ou outils de test du fournisseur) et justifiez votre choix (latence, prix, localisation des données).'],
      ['Machine virtuelle', 'Si vous avez un accès cloud : créez la plus petite VM Linux, installez nginx, copiez le site. Sinon, faites l’étape dans une VM VirtualBox et décrivez ce qui changerait dans le cloud.'],
      ['Groupe de sécurité', 'N’autorisez que 80 et 443 depuis partout, et 22 depuis votre seule adresse IP. Capture de la règle.'],
      ['Alerte de budget', 'Configurez une alerte de budget (par exemple 5 $) ou expliquez où elle se configure.'],
      ['Estimer un coût', 'Avec le calculateur officiel, estimez le coût mensuel de : 2 VM moyennes 24 h/24, 50 Go de stockage objet, 100 Go de trafic sortant, une base SQL gérée. Comparez avec l’achat d’un serveur physique sur 3 ans.'],
      ['Nettoyer', 'Supprimez toutes les ressources créées et faites une capture du tableau de bord vide. Une ressource oubliée continue d’être facturée.']

    livrables: ['URL du site statique', 'Rapport comparant les deux déploiements (qui gère quoi)', 'Justification de la région', 'Estimation de coût chiffrée', 'Preuve de suppression des ressources'],
    bareme: [['Site statique en ligne en HTTPS', 3], ['Déploiement sur VM (ou description argumentée)', 4], ['Choix de région justifié par des mesures', 3], ['Règles de sécurité minimales', 3], ['Estimation de coût et comparaison sur 3 ans', 5], ['Nettoyage et maîtrise du budget', 2]]
  },
  cas: {
    t: 'Faut-il migrer la scolarité de l’université dans le cloud ?',
    contexte: `<p>Une université de 15 000 étudiants héberge sa plateforme de scolarité (inscriptions, notes, paiements des frais) sur deux vieux serveurs dans un local de l’administration. Deux fois par an, la plateforme s’effondre : en septembre (inscriptions) et à la publication des résultats. Les coupures d’électricité sont fréquentes, l’onduleur tient 20 minutes. Le campus a une liaison Internet de 100 Mbit/s, parfois interrompue.</p>`,
    donnees: `<ul class="small"><li>Données : état civil, notes, téléphones, paiements : ce sont des <b>données personnelles</b>, encadrées au Mali par la loi n° 2013-015 du 21 mai 2013, sous le contrôle de l’APDP (Autorité de protection des données à caractère personnel).</li><li>Budget : impossible d’acheter de nouveaux serveurs cette année, mais un budget de fonctionnement mensuel est envisageable.</li><li>Équipe informatique : 3 personnes.</li></ul>`,
    questions: [
      ['Quels problèmes actuels le cloud résoudrait-il ?', 'Les pics de charge (<b>élasticité</b> : autoscaling en septembre et aux résultats), les coupures d’électricité et la vétusté du matériel (centres de données redondés), l’absence d’investissement initial (passage en dépenses de fonctionnement).'],
      ['Quels nouveaux risques apparaissent ?', 'Dépendance à la <b>liaison Internet</b> du campus (si elle tombe, le personnel ne travaille plus), coûts mensuels qui peuvent déraper, dépendance à un fournisseur, <b>localisation des données personnelles</b> à l’étranger, compétences nouvelles à acquérir, erreurs de configuration.'],
      ['Proposez une architecture (modèles de service et de déploiement).', 'Architecture <b>hybride</b> : portail étudiant (inscriptions, consultation des notes, paiement) en <b>PaaS</b> dans une région proche, avec autoscaling ; base de données gérée (sauvegardes automatiques) ; copie locale de secours et poste de saisie des notes fonctionnant au campus en cas de coupure Internet ; messagerie et bureautique en <b>SaaS</b>. Double accès Internet pour le campus.'],
      ['Que doit vérifier l’université avant de confier ces données à un fournisseur ?', 'Les obligations de la loi 2013-015 et les formalités auprès de l’APDP (notamment pour un établissement public), la localisation des données et les conditions de transfert hors du pays, le chiffrement au repos et en transit, la réversibilité (récupérer ses données en fin de contrat), et la répartition des responsabilités (modèle de responsabilité partagée).'],
      ['La disponibilité promise est de 99,9 %. Combien d’heures d’arrêt cela autorise-t-il par an ? Et 99,99 % ?', '0,1 % de 8 760 h = <b>8,76 h par an</b>. 99,99 % : 0,01 % × 8 760 h ≈ 0,876 h ≈ <b>53 minutes par an</b>.']
    ]
  },
  td: {
    t: 'TD 6 · Modèles de service, coûts, disponibilité',
    exos: [
      ['Classer', 'IaaS, PaaS ou SaaS ? Google Drive · une VM Azure · Google App Engine · WordPress.com (site prêt à l’emploi) · AWS Elastic Beanstalk · Amazon EC2 · Microsoft Teams.', 'SaaS : Google Drive, WordPress.com, Teams. PaaS : App Engine, Elastic Beanstalk. IaaS : VM Azure, EC2.'],
      ['Parc fixe ou élastique', 'Un service reçoit 200 requêtes/s 20 h par jour et 1 200 requêtes/s pendant 4 h. Un serveur traite 100 requêtes/s et coûte 0,10 $/h.<br>a) Coût journalier d’un parc fixe dimensionné pour le pic ?<br>b) Coût journalier avec un parc qui s’adapte exactement ?<br>c) Économie en pourcentage ?', 'a) 12 serveurs × 24 h × 0,10 = <b>28,80 $</b>.<br>b) 2 × 20 h + 12 × 4 h = 88 heures-serveur → <b>8,80 $</b>.<br>c) (28,80 − 8,80) / 28,80 ≈ <b>69 %</b>.'],
      ['Responsabilité partagée', 'Pour chaque élément, indiquez qui en est responsable en IaaS, en PaaS et en SaaS : système d’exploitation · code de l’application · comptes des utilisateurs · matériel · données.', 'OS : client / fournisseur / fournisseur. Code : client / client / fournisseur. Comptes des utilisateurs : client dans les trois cas. Matériel : fournisseur dans les trois cas. Données : client dans les trois cas.'],
      ['Disponibilité', 'Convertissez en durée d’arrêt maximale par an et par mois : 99 % · 99,9 % · 99,99 %.', '99 % : 87,6 h/an, ≈ 7,3 h/mois. 99,9 % : 8,76 h/an, ≈ 43,8 min/mois. 99,99 % : ≈ 52,6 min/an, ≈ 4,4 min/mois.'],
      ['Équivalences', 'Donnez l’équivalent chez les deux autres fournisseurs : AWS S3 · Azure Functions · Google Compute Engine · AWS RDS.', 'S3 ↔ Azure Blob Storage ↔ Google Cloud Storage. Azure Functions ↔ AWS Lambda ↔ Google Cloud Run functions. Compute Engine ↔ AWS EC2 ↔ Azure Virtual Machines. RDS ↔ Azure SQL Database ↔ Google Cloud SQL.']
    ]
  },
  videos: [
    ['Comprendre les modèles de Cloud (IaaS, PaaS, SaaS, CaaS, FaaS)', 'Al-E4C69UmQ', 'Français', 'Ajoutez à vos notes les modèles CaaS et FaaS, qui complètent le cours.'],
    ['Comprendre le Cloud IaaS, PaaS et SaaS en moins de 3 min', '56sCabVcLB4', 'Français', 'Comparez avec la démonstration « Qui gère quoi ? » du cours.']
  ]
};

EXTRAS['streaming'] = {
  tp: {
    t: 'Préparer la diffusion de la remise des diplômes', duree: '2 séances de 2 h', equipe: '3 étudiants',
    contexte: 'L’école veut diffuser en direct la cérémonie de remise des diplômes pour les familles, au Mali et à l’étranger, puis la proposer en replay. Vous préparez la chaîne technique et vous fabriquez vous-mêmes un flux HLS multi-qualité.',
    objectifs: ['Configurer un encodeur et comprendre ses réglages', 'Produire un flux HLS segmenté', 'Créer une playlist maître multi-débit', 'Dimensionner la bande passante'],
    outils: ['OBS Studio (gratuit)', 'FFmpeg (gratuit)', 'Python pour servir les fichiers : <code>python -m http.server 8000</code>', 'VLC pour lire le flux'],
    etapes: [
      ['Configurer OBS', 'Créez une scène : webcam ou fichier vidéo + titre « Remise des diplômes 2026 ». Réglages de sortie : H.264 (x264), 2 500 kbit/s, 1280×720, 30 images/s, image clé toutes les 2 s, audio AAC 128 kbit/s. Expliquez chaque réglage.'],
      ['Comprendre l’ingestion', 'Dans Paramètres → Stream, observez les champs « Serveur » (rtmp://…) et « Clé de stream ». Expliquez pourquoi la clé doit rester secrète. (Bonus, avec l’accord de l’enseignant : faire un essai non répertorié sur une plateforme.)'],
      ['Enregistrer une vidéo test', 'Enregistrez 1 minute avec OBS (fichier <code>test.mp4</code>).'],
      ['Créer deux qualités HLS', '<code>ffmpeg -i test.mp4 -c:v libx264 -b:v 2500k -s 1280x720 -c:a aac -b:a 128k -f hls -hls_time 6 -hls_playlist_type vod 720p/index.m3u8</code> puis la même chose en 640x360 à 800k dans <code>360p/</code>. Ouvrez une playlist dans un éditeur de texte et expliquez chaque ligne.'],
      ['Écrire la playlist maître', 'Créez <code>master.m3u8</code> qui référence les deux qualités avec <code>#EXT-X-STREAM-INF</code> (BANDWIDTH, RESOLUTION). Servez le dossier avec <code>python -m http.server 8000</code> et ouvrez <code>http://localhost:8000/master.m3u8</code> dans VLC.'],
      ['Observer', 'Dans l’onglet Réseau d’un navigateur (lecteur HLS) ou dans les journaux du serveur Python, observez le téléchargement des segments .ts un par un.'],
      ['Dimensionner', 'Estimez la bande passante nécessaire si 300 familles regardent en 720p directement depuis le serveur de l’école. Concluez sur l’intérêt d’une plateforme ou d’un CDN.']

    livrables: ['Captures des réglages OBS commentées', 'Dossier HLS (2 qualités + playlist maître)', 'Note de dimensionnement', 'Schéma de la chaîne de diffusion complète'],
    bareme: [['Réglages de l’encodeur expliqués', 4], ['Flux HLS valide dans les deux qualités', 5], ['Playlist maître correcte et lue dans VLC', 4], ['Calcul de bande passante juste', 4], ['Schéma de la chaîne complet', 3]]
  },
  cas: {
    t: 'Des cours en direct pour des étudiants connectés en 3G',
    contexte: `<p>L’école ouvre une licence à distance. 400 étudiants, répartis dans tout le pays, suivent les cours depuis leur téléphone. Beaucoup sont en 3G ou en 4G instable et achètent des forfaits de données limités. Les enseignants veulent un direct avec questions orales, puis un replay.</p>`,
    donnees: `<div class="tw"><table class="t small"><tr><th>Qualité proposée</th><th>Débit vidéo + audio</th></tr><tr><td>720p</td><td>2,8 Mbit/s</td></tr><tr><td>360p</td><td>0,8 Mbit/s</td></tr><tr><td>240p</td><td>0,4 Mbit/s</td></tr><tr><td>Audio seul</td><td>64 kbit/s</td></tr></table></div><p class="small">Un cours dure 2 heures.</p>`,
    questions: [
      ['Combien de données consomme un cours de 2 h en 360p ? En audio seul ?', '360p : 0,8 Mbit/s × 7 200 s = 5 760 Mbit = 720 Mo. Audio seul : 0,064 × 7 200 = 460,8 Mbit ≈ <b>58 Mo</b>. Soit plus de 12 fois moins.'],
      ['Quelles qualités proposer, et pourquoi le débit adaptatif est-il indispensable ici ?', 'Proposer 360p, 240p et <b>audio seul</b> (avec diapositives à télécharger à part) ; 720p est rarement utile sur un téléphone. Le débit adaptatif évite les coupures quand la 3G faiblit : le lecteur descend en 240p ou en audio au lieu de s’arrêter.'],
      ['Le direct HLS a 15 à 20 s de retard. Est-ce gênant pour les questions orales ? Que proposer ?', 'Oui : un étudiant pose une question sur une diapositive vue 20 s plus tôt et l’enseignant a déjà avancé. Pour les échanges, une <b>visioconférence WebRTC</b> (latence &lt; 0,5 s) en petits groupes ou un chat écrit ; pour la masse, HLS. Option : LL-HLS (2 à 5 s).'],
      ['Si les 400 étudiants regardent en 360p directement depuis le serveur de l’école, quelle bande passante sortante faut-il ?', '400 × 0,8 Mbit/s = <b>320 Mbit/s</b>, bien au-delà de la liaison d’une école. D’où l’intérêt d’un <b>CDN</b> ou d’une plateforme qui diffuse à partir de nombreux serveurs : l’école n’envoie qu’un seul flux (ingestion RTMP).'],
      ['Comment réduire encore le coût pour les étudiants ?', 'Replay téléchargeable en Wi-Fi (campus, cybercafé) et lisible hors ligne ; version audio + PDF ; segments courts pour pouvoir reprendre ; partenariat avec un opérateur pour un accès à coût réduit à la plateforme ; codec plus efficace (H.265 ou AV1) si les téléphones le décodent.']
    ]
  },
  td: {
    t: 'TD 7 · Débits, volumes et protocoles de streaming',
    exos: [
      ['Volume de données', 'Calculez la quantité de données (en Mo puis en Go) consommée par : a) 1 h en 1080p à 5 Mbit/s ; b) 1 h en 360p à 0,8 Mbit/s ; c) un film de 1 h 45 en 720p à 2,8 Mbit/s.', 'a) 5 × 3 600 = 18 000 Mbit = 2 250 Mo ≈ 2,25 Go. b) 0,8 × 3 600 = 2 880 Mbit = 360 Mo. c) 2,8 × 6 300 = 17 640 Mbit = 2 205 Mo ≈ 2,2 Go.'],
      ['Vidéo brute et compression', 'Une vidéo non compressée 1280×720, 24 bits par pixel, 30 images/s. a) Débit brut ? b) Taux de compression si elle est encodée à 2,8 Mbit/s ?', 'a) 1 280 × 720 × 24 × 30 = 663 552 000 bit/s ≈ <b>664 Mbit/s</b>. b) 664 / 2,8 ≈ <b>237</b> : le codec divise le débit par plus de 200.'],
      ['Serveur ou CDN ?', 'Un match est suivi par 20 000 spectateurs en 720p (2,8 Mbit/s). a) Bande passante totale à servir ? b) Combien de serveurs à 10 Gbit/s faut-il au minimum ? c) Pourquoi HLS facilite-t-il l’usage d’un CDN ?', 'a) 56 000 Mbit/s = <b>56 Gbit/s</b>. b) Au moins <b>6</b> serveurs (sans marge). c) Les segments sont des fichiers ordinaires servis en HTTP : n’importe quel cache HTTP du CDN peut les stocker et les servir près des spectateurs.'],
      ['Lire une playlist', '<pre class="code">#EXTM3U\n#EXT-X-TARGETDURATION:4\n#EXT-X-MEDIA-SEQUENCE:351\n#EXTINF:4.0,\nseg351.ts\n#EXTINF:4.0,\nseg352.ts\n#EXTINF:4.0,\nseg353.ts</pre>a) Direct ou VOD ? b) Quel sera le prochain segment ? c) Combien de secondes de contenu sont listées ?', 'a) Direct : pas de <code>#EXT-X-ENDLIST</code> et une séquence qui avance. b) seg354.ts. c) 3 × 4 = 12 s.'],
      ['Quel protocole ?', 'a) Contribution d’un car-régie vers la télévision par une liaison Internet qui perd des paquets. b) Envoi d’OBS vers une plateforme de direct. c) Lecture sur iPhone d’un direct suivi par 1 million de personnes. d) Appel vidéo avec un médecin.', 'a) SRT (UDP, récupération des pertes). b) RTMP (ou RTMPS). c) HLS (ou LL-HLS) via CDN. d) WebRTC.']
    ]
  },
  videos: [
    ['RTMP vs HLS : ingestion et diffusion (Dacast Tech Series)', '5n7RaQa2cps', 'Anglais (sous-titres automatiques disponibles)', 'Retrouvez la distinction ingestion (RTMP) / diffusion (HLS) du cours.'],
    ['Live Streaming Protocol Comparison', 'jYYhwbF3tvM', 'Anglais (sous-titres automatiques disponibles)', 'Comparez avec le tableau « Et pour l’interactif ? WebRTC » du cours.'],
    ['Adaptive Bitrate Streaming: How It Works', '5VOKYR7O-Cs', 'Anglais (sous-titres automatiques disponibles)', 'Reliez les explications au simulateur ABR du cours.']

};

EXTRAS['iot'] = {
  tp: {
    t: 'Station de surveillance d’humidité avec MQTT', duree: '2 séances de 2 h (+1 avec matériel)', equipe: '2 à 3 étudiants',
    contexte: 'Un périmètre maraîcher veut suivre l’humidité du sol de ses parcelles et commander une pompe à distance. Vous montez la partie logicielle avec un broker MQTT et des capteurs simulés ; les équipes qui disposent d’un ESP32 et d’un capteur ajoutent la partie matérielle.',
    objectifs: ['Installer et utiliser un broker MQTT', 'Concevoir une arborescence de sujets', 'Utiliser QoS, retain et Last Will', 'Sécuriser le broker'],
    outils: ['Mosquitto (broker et commandes mosquitto_pub / mosquitto_sub)', 'Python 3 + bibliothèque paho-mqtt (<code>pip install paho-mqtt</code>)', 'Option : MQTT Explorer (client graphique), Node-RED (tableau de bord), ESP32 + capteur d’humidité'],
    etapes: [
      ['Installer le broker', 'Installez Mosquitto (paquet <code>mosquitto</code> sous Linux, installeur sous Windows). Vérifiez qu’il écoute sur le port 1883.'],
      ['Premiers échanges', 'Terminal 1 : <code>mosquitto_sub -h localhost -t "ferme/+/humidite" -v</code>. Terminal 2 : <code>mosquitto_pub -h localhost -t ferme/parcelle1/humidite -m 23.5</code>. Testez aussi <code>ferme/#</code> et un sujet qui ne correspond pas.'],
      ['Concevoir les sujets', 'Proposez l’arborescence complète : mesures, état de la pompe, commandes, état de connexion de chaque capteur. Justifiez-la.'],
      ['Simuler un capteur', 'Écrivez un script Python qui publie toutes les 5 s une humidité aléatoire sur <code>ferme/parcelle1/humidite</code> (QoS 0), et qui déclare un <b>Last Will</b> « hors ligne » sur <code>ferme/parcelle1/etat</code> (retain). Arrêtez brutalement le script et observez le message publié par le broker.'],
      ['Commande de pompe', 'Un second script s’abonne à <code>ferme/parcelle1/pompe/commande</code> (QoS 1) et affiche « POMPE EN MARCHE » ou « ARRÊT ». Envoyez la commande avec <code>mosquitto_pub -q 1</code>.'],
      ['Automatiser', 'Ajoutez une règle : si l’humidité passe sous 20 %, publier automatiquement MARCHE ; au-dessus de 35 %, ARRÊT.'],
      ['Sécuriser', 'Créez un fichier de mots de passe (<code>mosquitto_passwd -c motsdepasse capteur1</code>), désactivez l’accès anonyme (<code>allow_anonymous false</code>) et limitez chaque compte à ses sujets avec un fichier ACL. Bonus : TLS sur le port 8883.']
    ],
    livrables: ['Arborescence des sujets justifiée', 'Scripts Python commentés', 'Captures montrant QoS, retain et Last Will en action', 'Fichiers de configuration Mosquitto (mots de passe, ACL)'],
    bareme: [['Broker fonctionnel et premiers échanges', 3], ['Arborescence de sujets pertinente', 3], ['Capteur simulé + Last Will', 4], ['Commande de pompe en QoS 1 et automatisation', 4], ['Sécurisation (authentification, ACL)', 4], ['Clarté du rapport', 2]]
  },
  cas: {
    t: 'La chaîne du froid des vaccins dans un district sanitaire',
    contexte: `<p>Un district sanitaire compte 25 centres de santé communautaires (CSCom). Chacun a un réfrigérateur à vaccins qui doit rester entre <b>+2 °C et +8 °C</b>. Aujourd’hui, un agent relève la température à la main deux fois par jour. Des lots de vaccins ont été perdus après des pannes non détectées pendant la nuit.</p>`,
    donnees: `<ul class="small"><li>Réseau : 15 centres ont une couverture 4G, 7 seulement la 2G, 3 aucune couverture mobile mais sont à moins de 10 km d’un centre couvert.</li><li>Électricité : coupures fréquentes ; plusieurs réfrigérateurs fonctionnent à l’énergie solaire.</li><li>Les alertes doivent atteindre le major du centre et le responsable du district, de préférence par SMS.</li></ul>`,
    questions: [
      ['Proposez l’architecture du système, des capteurs jusqu’aux personnes alertées.', 'Capteur de température sur pile dans chaque réfrigérateur → liaison radio → passerelle (ou module cellulaire intégré) → broker MQTT hébergé au district ou dans le cloud → application qui stocke les mesures, affiche un tableau de bord et envoie des <b>SMS</b> d’alerte.'],
      ['Quelle technologie de communication pour chaque groupe de centres ?', 'Centres 4G : module cellulaire (LTE-M ou NB-IoT si l’opérateur le propose, sinon 4G). Centres 2G seulement : module GSM/GPRS, messages très courts. Centres sans couverture : <b>LoRaWAN</b> (plusieurs kilomètres, très basse consommation) vers une passerelle installée dans le centre couvert le plus proche.'],
      ['Proposez des sujets MQTT et les niveaux de QoS.', 'Ex. <code>district/&lt;cscom&gt;/frigo1/temperature</code> (QoS 0, toutes les 5 min), <code>district/&lt;cscom&gt;/frigo1/alerte</code> (QoS 1), <code>district/&lt;cscom&gt;/frigo1/etat</code> (retain + Last Will « hors ligne »). Le tableau de bord du district s’abonne à <code>district/+/+/alerte</code> et <code>district/+/+/etat</code>.'],
      ['Un capteur ne donne plus de nouvelles. Comment le système le sait-il, et pourquoi est-ce important ?', 'Grâce au <b>Last Will</b> publié par le broker à la perte de connexion, et à une vérification « aucune mesure depuis 30 min ». C’est essentiel : un silence peut cacher une coupure d’électricité, donc un réchauffement des vaccins.'],
      ['Quels risques de sécurité et quelles mesures ?', 'Fausses mesures injectées, alertes supprimées, prise de contrôle des capteurs (cf. Mirai). Mesures : identifiants uniques par capteur, MQTT sur TLS (8883), ACL limitant chaque capteur à ses sujets, mises à jour à distance, surveillance des capteurs muets.']
    ]
  },
  td: {
    t: 'TD 8 · Sujets MQTT, QoS, énergie',
    exos: [
      ['Correspondance des sujets', 'Pour chaque filtre, indiquez quels sujets correspondent parmi : (1) ecole/salle1/temp · (2) ecole/salle1/hum · (3) ecole/salle2/temp · (4) ecole/salle1/capteurA/temp · (5) ecole.<br>Filtres : a) <code>ecole/+/temp</code> · b) <code>ecole/#</code> · c) <code>ecole/salle1/#</code> · d) <code>+/+/+</code> · e) <code>ecole/+/+/temp</code>.', 'a) 1, 3 · b) 1, 2, 3, 4, 5 · c) 1, 2, 4 · d) 1, 2, 3 · e) 4.'],
      ['Filtres valides ?', 'Lesquels sont valides : <code>ecole/#/temp</code> · <code>ecole/+</code> · <code>ecole/sal+</code> · <code>#</code> · <code>+/salle1/#</code> ?', 'Valides : <code>ecole/+</code>, <code>#</code>, <code>+/salle1/#</code>. Invalides : <code>ecole/#/temp</code> (# doit être en dernier) et <code>ecole/sal+</code> (+ doit occuper un niveau entier).'],
      ['Autonomie d’un capteur', 'Pile de 2 000 mAh. En veille, le capteur consomme 0,01 mA. À chaque envoi, il consomme 120 mA pendant 2 s. a) Autonomie avec un envoi toutes les 10 minutes ? b) Toutes les heures ?', 'a) Courant moyen = 0,01 + 120 × 2 / 600 = 0,41 mA ; 2 000 / 0,41 ≈ 4 878 h ≈ <b>203 jours</b>. b) 0,01 + 120 × 2 / 3 600 ≈ 0,077 mA ; 2 000 / 0,077 ≈ 26 100 h ≈ <b>3 ans</b>. La fréquence d’envoi décide de l’autonomie.'],
      ['Choisir la QoS', 'Justifiez le niveau de QoS : a) position GPS d’un bus toutes les 5 s ; b) ordre d’ouverture d’une vanne ; c) enregistrement d’un paiement de facture d’eau.', 'a) QoS 0 : une position perdue est vite remplacée. b) QoS 1 (la commande doit arriver ; la recevoir deux fois est sans effet si la commande est « ouvrir »). c) QoS 2 : le paiement ne doit être compté ni zéro ni deux fois.'],

EXTRAS['api-rest'] = {
  tp: {
    t: 'Construire et tester l’API de l’annuaire des étudiants', duree: '3 séances de 2 h', equipe: '2 à 3 étudiants',
    contexte: 'Le bureau des étudiants veut une API pour son annuaire, utilisée par une page web et plus tard par une application mobile. Vous la développez, la sécurisez, la documentez et la consommez.',
    objectifs: ['Implémenter les opérations CRUD en REST', 'Renvoyer les bons codes de statut', 'Protéger les écritures par jeton', 'Documenter et tester une API', 'Consommer une API publique'],
    outils: ['Node.js + Express (ou Python + Flask)', 'Postman ou curl', 'Navigateur (fetch)', 'Une API publique ouverte, par exemple REST Countries (restcountries.com)'],
    etapes: [
      ['Démarrer le projet', '<code>npm init -y</code> puis <code>npm install express</code>. Créez <code>app.js</code> avec un tableau d’étudiants en mémoire et <code>app.use(express.json())</code>.'],
      ['Routes CRUD', '<code>GET /api/etudiants</code> (filtre <code>?ville=</code>), <code>GET /api/etudiants/:id</code>, <code>POST /api/etudiants</code>, <code>PUT</code>, <code>PATCH</code> et <code>DELETE /api/etudiants/:id</code>.'],
      ['Codes de statut', '201 + en-tête Location à la création, 204 à la suppression, 404 si l’identifiant n’existe pas, 400 si nom ou prénom manquent. Comparez votre comportement avec le client REST du cours.'],
      ['Jeton', 'Middleware : pour POST, PUT, PATCH et DELETE, exiger <code>Authorization: Bearer &lt;jeton&gt;</code> ; sinon 401. Le jeton est lu dans une variable d’environnement, jamais écrit dans le code.'],
      ['Tester', 'Créez une collection Postman (ou un script de commandes curl) qui couvre chaque route et chaque code d’erreur. Exportez-la.'],
      ['Documenter', 'Écrivez une description OpenAPI minimale (fichier YAML) des routes, paramètres et réponses.'],
      ['Consommer', 'Page HTML qui affiche l’annuaire avec <code>fetch(\'/api/etudiants\')</code>. Puis appelez une API publique (ex. <code>https://restcountries.com/v3.1/name/mali</code>) et affichez la capitale, la population et le drapeau.']
    ],
    livrables: ['Code source de l’API', 'Collection Postman ou script curl', 'Fichier OpenAPI', 'Page web cliente', 'Rapport de 2 pages : tableau des routes, codes renvoyés, choix de sécurité'],
    bareme: [['Routes CRUD fonctionnelles', 5], ['Codes de statut corrects', 4], ['Protection par jeton', 3], ['Tests couvrant succès et erreurs', 3], ['Documentation OpenAPI', 2], ['Client web et appel d’une API publique', 3]],
    code: `const express = require('express');
const app = express();
app.use(express.json());
let etudiants = [{ id: 1, nom: 'Traoré', prenom: 'Awa', ville: 'Bamako' }];
let suivant = 2;

app.get('/api/etudiants', (req, res) => {
  const { ville } = req.query;
  res.json(ville ? etudiants.filter(e => e.ville === ville) : etudiants);
});
app.get('/api/etudiants/:id', (req, res) => {
  const e = etudiants.find(x => x.id === Number(req.params.id));
  if (!e) return res.status(404).json({ erreur: 'Étudiant introuvable' });
  res.json(e);
});
app.post('/api/etudiants', (req, res) => {
  const { nom, prenom, ville } = req.body;
  if (!nom || !prenom) return res.status(400).json({ erreur: 'nom et prenom obligatoires' });
  const e = { id: suivant++, nom, prenom, ville: ville || null };
  etudiants.push(e);
  res.status(201).location('/api/etudiants/' + e.id).json(e);
});
app.listen(3000, () => console.log('API sur http://localhost:3000'));`
  },
  cas: {
    t: 'Publier automatiquement les annonces de l’école sur les réseaux sociaux',
    contexte: `<p>Le service communication publie chaque annonce (examens, résultats, événements) sur le site, puis à la main sur la page Facebook, sur LinkedIn et sur un canal WhatsApp. Il veut une application interne qui publie partout en un clic, récupère les commentaires et produit des statistiques mensuelles.</p>`,
    donnees: `<ul class="small"><li>Les plateformes exigent un compte développeur, une application enregistrée et parfois une validation des permissions demandées.</li><li>Les API ont des limites de débit et changent régulièrement.</li><li>Les commentaires contiennent des noms, des photos de profil et parfois des numéros de téléphone d’étudiants.</li></ul>`,
    questions: [
      ['Décrivez le parcours OAuth 2.0 qui permet à l’application de publier sur la page de l’école sans connaître le mot de passe du compte.', 'L’administrateur clique « Connecter la page » → il est redirigé vers la page de connexion de la plateforme → il voit les permissions demandées et les accepte → la plateforme renvoie un <b>code d’autorisation</b> à l’application → l’application l’échange (côté serveur, avec son secret) contre un <b>jeton d’accès</b> limité → les appels API portent ce jeton. Le mot de passe ne transite jamais par l’application.'],
      ['Quelles permissions (scopes) demander ? Pourquoi pas toutes ?', 'Seulement publier sur la page, lire les commentaires de la page et lire ses statistiques. Principe du <b>moindre privilège</b> : en cas de vol du jeton, les dégâts sont limités ; et les plateformes refusent souvent les demandes de permissions injustifiées.'],
      ['L’API renvoie souvent 429. Que faire ?', 'Respecter l’en-tête <code>Retry-After</code> s’il existe, sinon réessayer avec un <b>délai croissant</b> (1 s, 2 s, 4 s…) ; mettre les publications en file d’attente ; mettre en cache les statistiques au lieu de les redemander ; regrouper les appels.'],
      ['Comment récupérer les nouveaux commentaires sans interroger l’API toutes les minutes ?', 'S’abonner aux <b>webhooks</b> de la plateforme : elle envoie une requête HTTP POST au serveur de l’école à chaque nouveau commentaire. Le serveur vérifie la signature de la requête avant de la traiter.'],
      ['Quelles précautions pour les données personnelles et les jetons ?', 'Stocker jetons et secrets chiffrés, côté serveur, jamais dans le code ni dans une page web ; ne conserver des commentaires que ce qui est utile et pendant une durée limitée ; informer les personnes ; respecter les conditions d’utilisation des plateformes et la loi sur les données personnelles. Prévoir un plan B (publication manuelle) si une API change ou si l’accès est retiré.']
    ]
  },
  td: {
    t: 'TD 9 · Conception d’API REST et JSON',
    exos: [
      ['Concevoir les routes', 'Concevez l’API d’une gestion de salles : lister les salles, voir une salle, créer une salle, modifier sa capacité, supprimer une salle, lister les réservations d’une salle, réserver une salle. Donnez méthode, URI et code de succès.', '<code>GET /api/salles</code> 200 · <code>GET /api/salles/{id}</code> 200 · <code>POST /api/salles</code> 201 · <code>PATCH /api/salles/{id}</code> 200 · <code>DELETE /api/salles/{id}</code> 204 · <code>GET /api/salles/{id}/reservations</code> 200 · <code>POST /api/salles/{id}/reservations</code> 201 (409 Conflict si le créneau est pris).'],
      ['Critiquer une API', 'Que reprochez-vous à : <code>GET /api/supprimerEtudiant?id=4</code> · <code>POST /api/getEtudiants</code> · <code>GET /api/etudiant/4</code> renvoyant 200 avec <code>{"erreur":"introuvable"}</code> ?', '1) Une action dans l’URI, et un GET qui modifie : un robot qui suit les liens pourrait supprimer des données. → <code>DELETE /api/etudiants/4</code>. 2) POST pour lire, verbe dans l’URI. → <code>GET /api/etudiants</code>. 3) Le code doit refléter l’erreur : 404, et une collection nommée au pluriel.'],
      ['Corriger un JSON', '<pre class="code">{\n  nom: "Diakité",\n  \'ville\': "Kita",\n  "notes": [12, 15,],\n  "actif": True\n}</pre>', 'Clés entre guillemets doubles (<code>"nom"</code>, <code>"ville"</code>), pas de virgule après 15, <code>true</code> en minuscules. Résultat : <code>{"nom":"Diakité","ville":"Kita","notes":[12,15],"actif":true}</code>.'],
      ['Méthodes idempotentes', 'Une méthode est idempotente si l’envoyer plusieurs fois a le même effet qu’une seule fois. Classez GET, POST, PUT, DELETE. Pourquoi est-ce important quand le réseau mobile coupe pendant une requête ?', 'Idempotentes : GET, PUT, DELETE. Non idempotente : POST (deux POST créent deux ressources). Si la réponse est perdue, un client peut renvoyer sans risque un PUT ou un DELETE ; pour un POST, il faut une protection (clé d’idempotence) pour éviter les doublons, par exemple deux paiements.'],
      ['Pagination', 'La collection compte 15 000 étudiants. Proposez une pagination dans l’URI et le format de réponse.', '<code>GET /api/etudiants?page=3&amp;taille=50</code> → <code>{"page":3,"taille":50,"total":15000,"donnees":[…],"suivant":"/api/etudiants?page=4&amp;taille=50"}</code>. On limite la taille maximale (par ex. 100) côté serveur.'],
      ['Ordonner OAuth', 'Remettez dans l’ordre : a) l’application échange le code contre un jeton · b) l’utilisateur accepte les permissions · c) l’application appelle l’API avec le jeton · d) l’utilisateur est redirigé vers la plateforme · e) la plateforme renvoie un code d’autorisation.', 'd → b → e → a → c.']
    ]
  },
  videos: [
    ['C’est quoi une API REST ?', 'SC4sEiBje1Q', 'Français', 'Notez la différence entre interface, API et API web.'],

  id: 'introduction', num: '00', short: 'Introduction', title: 'Introduction à l’Internet',
  lead: 'Ce qu’est l’Internet, d’où il vient, qui le fait fonctionner et comment ses normes sont écrites. On commence aussi par le contrat du cours : contenu, méthode et évaluation.',
  objectives: ['Définir l’Internet', 'Situer les grandes dates', 'Identifier les organismes de normalisation', 'Comprendre le cycle de vie d’un RFC'],
  slides: [
    { k: 'GUIDE DU COURS', t: 'Le cours en un coup d’œil', b: `
      <p>La technologie de l’Internet englobe un large éventail de <b>technologies, protocoles et concepts</b> qui permettent le fonctionnement, la connectivité et l’échange d’informations à travers le réseau mondial. De nouvelles innovations améliorent sans cesse la connectivité, la vitesse, la sécurité et les fonctionnalités du web.</p>
      <div class="grid2"><div class="note"><b>Prérequis</b>Connaissances de base en informatique et en programmation.</div>
      <div class="note"><b>Méthodologie</b>Approche pratique : projets concrets, problèmes réels, travail entre pairs, exercices, études de cas.</div></div>`,
      keep: 'ce cours se travaille en manipulant. Chaque notion a sa démonstration et ses exercices.' },
    { k: 'GUIDE DU COURS', t: 'Le programme : 9 cours', b: `<div class="tw"><table class="t">
      <tr><th>Cours</th><th>Thème</th><th>Notions</th></tr>
      <tr><td>1</td><td>Protocoles de communication</td><td>TCP/IP, HTTP/HTTPS, SMTP, POP, IMAP, FTP</td></tr>
      <tr><td>2</td><td>Adressage et routage</td><td>IPv4, IPv6, DNS, routage</td></tr>
      <tr><td>3</td><td>Web</td><td>HTML, CSS, JavaScript, serveurs web, frameworks</td></tr>
      <tr><td>4</td><td>Sécurité</td><td>SSL/TLS, pare-feu, VPN</td></tr>
      <tr><td>5</td><td>Bases de données</td><td>SQL, NoSQL</td></tr>
      <tr><td>6</td><td>Services cloud</td><td>AWS, Azure, Google Cloud</td></tr>
      <tr><td>7</td><td>Médias et streaming</td><td>RTMP, HLS</td></tr>
      <tr><td>8</td><td>Internet des objets</td><td>MQTT, CoAP</td></tr>
      <tr><td>9</td><td>Réseaux sociaux et API</td><td>API RESTful</td></tr></table></div>` },
    { k: 'GUIDE DU COURS', t: 'Comment vous serez évalués', b: `<div class="tw"><table class="t">
      <tr><th>Évaluation</th><th>Type</th><th>Pondération</th></tr>
      <tr><td>Travail d’équipe : document, présentation, TP/TD</td><td>Par équipe</td><td>60 % de la note devoir</td></tr>
      <tr><td>Tests en QCM (60 minutes chacun)</td><td>Individuelle</td><td>40 % de la note devoir</td></tr>
      <tr><td><b>Note devoir /20</b></td><td colspan="2">Travail d’équipe + tests</td></tr>
      <tr><td>Examen final (2 h) : QCM + questions à développement</td><td>Individuelle</td><td>15 points en QCM (75 %) et 5 points en développement (25 %)</td></tr></table></div>
      <p class="small muted">L’onglet « Examen blanc » reproduit ce format : QCM sur 15 et développement sur 5.</p>` },
    { k: 'DÉFINITION', t: 'Qu’est-ce que l’Internet ?', b: `
      <p style="font-size:1.12em">L’Internet est un <b>réseau de réseaux</b> informatiques qui communiquent entre eux grâce à un ensemble de règles appelées <b>protocoles</b>, définies <b>indépendamment des constructeurs</b> d’ordinateurs et de réseaux.</p>
      <div class="note"><b>Définition de Wikipédia</b>« … le réseau public mondial utilisant le protocole de communication IP (Internet Protocol). »</div>
      <p>Deux idées essentielles : l’<b>interconnexion</b> (aucun réseau ne possède l’Internet) et l’<b>ouverture</b> (n’importe quel fabricant peut implémenter les protocoles, car ils sont publics).</p>`,
      keep: 'Internet = interconnexion de réseaux hétérogènes + protocoles communs et ouverts (IP au centre).' },
    { k: 'PARTICIPANTS', t: 'Qui est connecté ?', b: `
      <div class="grid2"><div><p>L’Internet interconnecte des organisations très diverses :</p><ul><li>universités</li><li>organismes de recherche publique</li><li>services gouvernementaux</li><li>entreprises publiques ou privées</li><li>grand public…</li></ul></div>
      <div class="card" style="box-shadow:none"><div class="eyebrow">CHIFFRES ACTUELS (UIT)</div>
      <p style="margin:.3em 0"><b style="font-size:1.6em;font-family:var(--f-display)">6 milliards</b><br>d’internautes en 2025, soit environ les trois quarts de la population mondiale (+240 millions en un an).</p>
      <p class="small muted" style="margin:0">Estimation 2026 de l’UIT : environ 6,3 milliards (76 %). Mais l’écart reste fort : 94 % de la population connectée dans les pays riches, 23 % dans les pays à faible revenu.</p></div></div>`,
      keep: 'en 2003 on comptait environ 600 millions d’utilisateurs ; en 2025, 6 milliards. La fracture numérique demeure.' },
    { k: 'HISTORIQUE · 1961-1967', t: 'Aux origines : ARPANET', b: `
      <ul><li><b>1961-1965 (États-Unis)</b> : premiers travaux sur les réseaux informatiques et la <b>commutation de paquets</b>. Premiers essais d’interconnexion à longue distance.</li>
      <li><b>1967</b> : début du programme <b>ARPANET</b> du département américain de la Défense (DoD).</li></ul>
      <p>Objectifs réels du programme :</p><ul><li>faciliter les télécommunications entre chercheurs (l’une des premières applications est le <b>courrier électronique</b>) ;</li><li>normaliser les techniques de connexion entre terminaux et ordinateurs du DoD.</li></ul>
      <div class="note fix"><b>Mythe tenace</b>« Construire un réseau capable de résister à une guerre nucléaire. » En réalité ce n’était pas l’objectif d’ARPANET, mais l’idée de <b>décentralisation</b> est bien réelle : si un nœud tombe, les paquets empruntent d’autres chemins. Vous le testerez dans la démonstration de routage du cours 2.</div>` },
    { k: 'HISTORIQUE · 1969-2003', t: 'Chronologie', b: `<div class="tl">
      <div><b>1969</b>2 nœuds (UCLA, Stanford), 4 en fin d’année</div><div><b>1971</b>21 nœuds</div>
      <div><b>1974</b>Publication de l’architecture TCP/IP : protocole IP, architecture ouverte et extensible, toujours utilisée</div>
      <div><b>1979</b>USENET, réseau civil de forums thématiques (newsgroups)</div><div><b>1982</b>L’accès au réseau est accordé gratuitement</div>
      <div><b>1983</b>La NSF finance la mise en réseau de 60 universités américaines et 3 européennes ; apparition des stations de travail</div>
      <div><b>1984</b>Scission d’ARPANET : MILNET (militaire) et INTERNET ; la NSF prend le relais (NSFnet). Environ 1 000 nœuds</div>
      <div><b>1991</b>Premiers fournisseurs d’accès commerciaux</div><div><b>1992</b>Le World Wide Web (CERN, Genève) se diffuse : hyperliens et format HTML</div>
      <div><b>2003</b>~180 millions de nœuds, ~600 millions d’utilisateurs</div></div>` },
    { k: 'POUR ALLER PLUS LOIN', t: 'Quelques précisions historiques', b: `
      <div class="note fix"><b>1974 · 1983</b>En 1974, Vinton Cerf et Robert Kahn publient l’architecture TCP/IP. La bascule officielle d’ARPANET vers TCP/IP a lieu le <b>1er janvier 1983</b>.</div>
      <div class="note fix"><b>1989 · 1991 · 1993</b>Tim Berners-Lee propose le Web au CERN en 1989 ; le Web devient public en 1991. Le navigateur graphique <b>Mosaic</b> (NCSA) sort en 1993 et popularise le Web.</div>
      <div class="note fix"><b>Aujourd’hui</b>Le stock d’adresses IPv4 libres de l’IANA est épuisé depuis 2011. En mars 2026, pour la première fois, plus de 50 % des utilisateurs de Google y accédaient en IPv6.</div>`,
      keep: 'retenez les jalons 1969 (ARPANET), 1983 (TCP/IP), 1991 (Web public), 1993 (Mosaic).' },
    { k: 'VUE D’ENSEMBLE', t: 'L’Internet, c’est quatre choses à la fois', b: `<div class="grid2">
      <div class="note"><b>1 · Une interconnexion de réseaux</b>Ethernet, Wi-Fi, fibre, 4G/5G… reliés par des routeurs.</div>
      <div class="note"><b>2 · Une pile de protocoles</b>IP, TCP, UDP, FTP, HTTP…</div>
      <div class="note"><b>3 · Un espace de nommage</b>.org, .com, .ml : domaines et sous-domaines (DNS).</div>
      <div class="note"><b>4 · Des organisations et des normes</b>IETF, IANA, W3C…</div></div>` },
    { k: 'GOUVERNANCE', t: 'Les acteurs de la gestion et de la normalisation', b: `
      <ul><li><b>Internet Society (ISOC)</b>, qui chapeaute :<ul><li><b>IAB</b> (Internet Architecture Board) : orientations architecturales à long terme ;</li><li><b>IETF</b> (Internet Engineering Task Force) : les standards de l’Internet, notamment les protocoles ;</li><li><b>IRTF</b> (Internet Research Task Force) : recherche à plus long terme sur les protocoles.</li></ul></li>
      <li><b>IANA</b> (Internet Assigned Numbers Authority) : domaines de premier niveau, espace d’adressage IP, numéros de ports… (fonction aujourd’hui assurée sous l’égide de l’ICANN).</li>
      <li><b>W3C</b> (World Wide Web Consortium) : technologies du Web (HTML, XML, CSS, SOAP…).</li></ul>`,
      keep: 'IETF → protocoles (RFC) ; W3C → technologies du Web ; IANA → numéros, noms et adresses.' },
    { k: 'NORMES', t: 'Les documents de l’IETF : les RFC', b: `
      <ul><li><b>Internet-Drafts</b> : documents de travail, temporaires.</li><li><b>RFC</b> (Request For Comments) : documents publiés, numérotés, jamais modifiés (une révision = un nouveau numéro).</li></ul>
      <p>Statuts d’un RFC : <span class="tag">experimental</span> <span class="tag">informational</span> <span class="tag">best current practice</span> <span class="tag sig">standards track</span></p>
      <div class="flow"><span>Proposed Standard</span><i>→</i><span>Draft Standard</span><i>→</i><span>Internet Standard</span></div>
      <p>Exemple : le <b>RFC 791</b> définit le protocole IP (1981).</p>
      <div class="note fix"><b>Mise à jour</b>Depuis le RFC 6410 (2011), l’étape « Draft Standard » a été supprimée : la voie de normalisation compte deux niveaux, Proposed Standard puis Internet Standard.</div>` },
    { k: 'NORMES', t: 'Les documents du W3C', b: `
      <p>Processus de maturation d’une norme du Web :</p>
      <div class="flow"><span>Working Draft (WD)</span><i>→</i><span>Last Call WD</span><i>→</i><span>Candidate Recommendation (CR)</span><i>→</i><span>Proposed Recommendation (PR)</span><i>→</i><span><b>W3C Recommendation (REC)</b></span></div>
      <p>Exemple : la recommandation définissant le langage XML (REC-xml, 2006).</p>
      <p class="small muted">Le processus actuel du W3C a fusionné l’étape « Last Call » dans les autres, mais la logique reste la même : brouillon, appel à implémentations, validation, recommandation.</p>` },
    { k: 'SYNTHÈSE', t: 'Ce que vous savez maintenant', b: `<ul>
      <li>L’Internet est un réseau de réseaux qui parle IP.</li><li>Il naît d’ARPANET (1969) et s’ouvre au public dans les années 1990 avec le Web.</li>
      <li>Ses protocoles sont publiés dans des RFC par l’IETF ; le Web est normalisé par le W3C ; l’IANA gère numéros et noms.</li></ul>
      <p>Prochaine étape : <b>comment</b> les machines se parlent. Direction le cours 1, les protocoles.</p>` }
  ],

/* ===================== COURS 01 · Protocoles ===================== */
COURSES.push({
  id: 'protocoles', num: '01', short: 'Protocoles', title: 'Protocoles de communication',
  lead: 'La pile TCP/IP couche par couche : IP qui achemine, UDP et TCP qui transportent, et les protocoles d’application du quotidien (HTTP, SMTP, POP, IMAP, FTP, SSH).',
  objectives: ['Décrire la pile TCP/IP', 'Expliquer l’encapsulation', 'Choisir entre TCP et UDP', 'Suivre un courriel de bout en bout', 'Connaître les ports usuels'],
  slides: [
    { k: 'NOTION', t: 'Qu’est-ce qu’un protocole ?', b: `<p>Un protocole est un ensemble de <b>règles</b> que deux entités doivent respecter pour se comprendre. Il fixe :</p>
      <ul><li>la <b>syntaxe</b> : le format des messages (champs, tailles, ordre) ;</li><li>la <b>sémantique</b> : ce que signifie chaque message ;</li><li>la <b>synchronisation</b> : qui parle quand, et que faire si rien n’arrive.</li></ul>
      <div class="note"><b>Analogie</b>Un appel téléphonique : « Allô ? » / « Allô, c’est Awa » / échange / « Au revoir » / « Au revoir ». Sans ce rituel commun, la conversation échoue.</div>` },
    { k: 'ARCHITECTURE', t: 'La pile de protocoles de l’Internet', b: `<p>Chaque couche rend un service à la couche du dessus et s’appuie sur celle du dessous.</p>
      <div class="layers"><div class="layer"><b>Application</b><span>HTTP, FTP, SMTP, POP, IMAP, DNS, SSH, Telnet… (sur les hôtes)</span></div>
      <div class="layer"><b>Transport</b><span>TCP (Transmission Control Protocol) · UDP (User Datagram Protocol) (sur les hôtes)</span></div>
      <div class="layer"><b>Réseau (Internet)</b><span>IP (Internet Protocol) (sur les hôtes et les routeurs)</span></div>
      <div class="layer"><b>Accès réseau</b><span>Ethernet, Wi-Fi, fibre, 4G/5G : la liaison physique</span></div></div>
      <p class="small muted">Le modèle OSI de l’ISO découpe la même chose en 7 couches : physique, liaison, réseau, transport, session, présentation, application.</p>`,
      keep: 'les routeurs ne « montent » que jusqu’à la couche réseau ; TCP et UDP ne sont gérés que par les machines aux extrémités.' },
    { k: 'MÉCANISME', t: 'L’encapsulation', b: `<p>À l’envoi, chaque couche ajoute son <b>en-tête</b> devant les données reçues de la couche supérieure. À la réception, chaque couche retire l’en-tête qui la concerne.</p>
      <div class="enc"><div class="enc-row"><div class="h-data">Données de l’application (ex. requête HTTP)</div></div>
      <div class="enc-row"><div class="h-tcp">En-tête TCP</div><div class="h-data">Données</div></div>
      <div class="enc-row"><div class="h-ip">En-tête IP</div><div class="h-tcp">TCP</div><div class="h-data">Données</div></div>
      <div class="enc-row"><div class="h-eth">En-tête Ethernet</div><div class="h-ip">IP</div><div class="h-tcp">TCP</div><div class="h-data">Données</div><div class="h-fcs">FCS</div></div></div>
      <p>Noms des unités : <b>message</b> (application) → <b>segment</b> (TCP) ou <b>datagramme</b> (UDP) → <b>paquet</b> (IP) → <b>trame</b> (liaison) → <b>bits</b>.</p>` },
    { k: 'COUCHE RÉSEAU', t: 'IP : acheminer des paquets', b: `<ul><li><b>Commutation de paquets</b> (datagrammes) : deux hôtes s’échangent des paquets <b>sans connaître l’architecture du réseau</b> (routes, sous-réseaux, Ethernet, ATM, FDDI…).</li>
      <li>Chaque hôte est identifié par son <b>adresse IP</b>.</li>
      <li>Service de type <b>« meilleur effort »</b> (best effort) : aucun engagement. Un paquet peut être <b>perdu</b>, <b>dupliqué</b>, arriver <b>en désordre</b> ou être <b>modifié</b>.</li>
      <li><b>IPv4</b> : adresses sur 32 bits (2<sup>32</sup> ≈ 4,3 milliards). <b>IPv6</b> : adresses sur 128 bits. Détails au cours 2.</li></ul>`,
      keep: 'IP n’est pas fiable ; c’est aux couches supérieures (TCP) de compenser.' },
    { k: 'COUCHE TRANSPORT', t: 'UDP : léger et rapide', b: `<p>UDP est une couche transport <b>rudimentaire</b>. Il ajoute seulement deux choses à IP :</p>
      <ul><li>le <b>multiplexage / démultiplexage</b> grâce aux <b>ports</b> (plusieurs applications sur une même machine) ;</li><li>une <b>somme de contrôle</b> (checksum) pour détecter les erreurs.</li></ul>
      <p>Pas de connexion, pas d’accusé de réception, pas de retransmission. Il convient aux applications « légères » : sessions courtes, besoin de rapidité.</p>
      <p>Exemples : <b>DNS</b>, voix sur IP, visioconférence, jeux en ligne, diffusion en direct, et HTTP/3 (via QUIC).</p>` },
    { k: 'COUCHE TRANSPORT', t: 'TCP : fiable et ordonné', b: `<p>TCP fonctionne en <b>mode connexion</b>. Une session comporte :</p>
      <div class="flow"><span>1. Établissement : SYN → SYN-ACK → ACK</span><i>→</i><span>2. Transfert bidirectionnel</span><i>→</i><span>3. Fermeture : FIN / ACK</span></div>
      <ul><li>multiplexage par <b>ports</b> ;</li><li><b>transfert fiable</b>, ordonné et sans erreurs : numéros de séquence, accusés de réception (ACK), contrôle d’erreurs, <b>retransmission</b> ;</li><li><b>contrôle de flux</b> (ne pas noyer le récepteur) et <b>de congestion</b> (adapter le débit à l’état du réseau).</li></ul>`,
      keep: 'la « poignée de main en trois temps » SYN, SYN-ACK, ACK ouvre toute connexion TCP.' },
    { k: 'COMPARAISON', t: 'TCP ou UDP ?', b: `<div class="tw"><table class="t"><tr><th></th><th>TCP</th><th>UDP</th></tr>
      <tr><td>Connexion</td><td>Oui (3-way handshake)</td><td>Non</td></tr><tr><td>Fiabilité</td><td>Accusés + retransmission</td><td>Aucune garantie</td></tr>
      <tr><td>Ordre</td><td>Garanti</td><td>Non garanti</td></tr><tr><td>Contrôle de flux / congestion</td><td>Oui</td><td>Non</td></tr>
      <tr><td>En-tête</td><td>20 octets minimum</td><td>8 octets</td></tr><tr><td>Usages</td><td>Web, courriel, transfert de fichiers, SSH</td><td>DNS, VoIP, vidéo en direct, jeux</td></tr></table></div>
      <p>Question à se poser : <b>vaut-il mieux une donnée en retard ou une donnée perdue ?</b> Pour un fichier, en retard (TCP). Pour une voix en direct, perdue (UDP).</p>` },
    { k: 'PORTS', t: 'Ports et sockets', b: `<p>Un <b>port</b> (0 à 65 535) identifie une application sur une machine. Le couple <b>adresse IP + port</b> s’appelle un <b>socket</b> : <code>196.200.60.10:443</code>.</p>
      <p class="small">Ports bien connus : 0-1023 · enregistrés : 1024-49151 · dynamiques : 49152-65535.</p>
      <div class="tw"><table class="t"><tr><th>Port</th><th>Protocole</th><th>Port</th><th>Protocole</th></tr>
      <tr><td>20 / 21</td><td>FTP (données / contrôle)</td><td>110</td><td>POP3</td></tr><tr><td>22</td><td>SSH, SFTP</td><td>119</td><td>NNTP (news)</td></tr>
      <tr><td>23</td><td>Telnet</td><td>143</td><td>IMAP</td></tr><tr><td>25</td><td>SMTP (entre serveurs)</td><td>443</td><td>HTTPS</td></tr>
      <tr><td>53</td><td>DNS</td><td>587</td><td>SMTP (soumission client)</td></tr><tr><td>80</td><td>HTTP</td><td>993 / 995</td><td>IMAPS / POP3S</td></tr></table></div>` },
    { k: 'APPLICATION', t: 'HTTP et HTTPS', b: `<ul><li><b>HTTP</b> (HyperText Transfer Protocol) transfère les ressources du Web selon un schéma <b>requête / réponse</b>, au-dessus de TCP, port <b>80</b>.</li>
      <li>HTTP est <b>sans état</b> : chaque requête est indépendante (les cookies servent à « se souvenir »).</li>
      <li><b>HTTPS</b> = HTTP transporté dans une session <b>TLS</b> chiffrée, port <b>443</b>. Le contenu, les en-têtes et l’URL complète sont protégés.</li></ul>
      <pre class="code"><span class="k">GET</span> /index.html HTTP/1.1
Host: www.estm.ml

<span class="g">HTTP/1.1 200 OK</span>
Content-Type: text/html</pre><p class="small muted">Étude détaillée au cours 3 (Web) et au cours 4 (TLS).</p>` },
    { k: 'APPLICATION · COURRIEL', t: 'Le courrier électronique', b: `<p>Utiliser l’Internet comme la poste : on dépose un message dans la boîte aux lettres du correspondant, qu’il soit connecté ou non ; il le lira à sa prochaine connexion.</p>
      <div class="flow"><span>Logiciel de l’expéditeur</span><i>— SMTP →</i><span>Serveur de l’expéditeur</span><i>— SMTP →</i><span>Serveur du destinataire</span><i>— POP / IMAP →</i><span>Logiciel du destinataire</span></div>
      <ul><li><b>SMTP</b> (Simple Mail Transfer Protocol) : <b>envoie</b> et relaie les messages.</li><li><b>POP3</b> et <b>IMAP</b> : <b>récupèrent</b> les messages dans la boîte.</li>
      <li>Le serveur du destinataire est trouvé grâce à l’enregistrement DNS <b>MX</b> du domaine (ex. <code>@estm.ml</code>).</li></ul>`,
      keep: 'SMTP pour envoyer, POP ou IMAP pour lire.' },
    { k: 'APPLICATION · COURRIEL', t: 'POP3 ou IMAP ?', b: `<div class="tw"><table class="t"><tr><th></th><th>POP3</th><th>IMAP</th></tr>
      <tr><td>Principe</td><td>Télécharge les messages puis (souvent) les efface du serveur</td><td>Les messages restent sur le serveur ; on les synchronise</td></tr>
      <tr><td>Plusieurs appareils</td><td>Mal adapté</td><td>Idéal : téléphone, PC, webmail voient la même boîte</td></tr>
      <tr><td>Dossiers, état lu / non lu</td><td>Locaux uniquement</td><td>Gérés sur le serveur</td></tr>
      <tr><td>Hors connexion</td><td>Tout est en local</td><td>Copie en cache</td></tr><tr><td>Ports</td><td>110 · 995 (sécurisé)</td><td>143 · 993 (sécurisé)</td></tr></table></div>` },
    { k: 'APPLICATION · FICHIERS', t: 'FTP : transférer des fichiers', b: `<ul><li>Service d’échange de fichiers en <b>client-serveur</b> : déposer (upload) des fichiers sur une machine distante ou en télécharger (download).</li>
      <li><b>Deux connexions TCP</b> : une connexion de <b>contrôle</b> (port 21) pour les commandes, une connexion de <b>données</b> pour les fichiers (port 20 en mode actif, port négocié en mode passif).</li>
      <li>Commandes : <code>USER</code>, <code>PASS</code>, <code>LIST</code>, <code>RETR</code> (télécharger), <code>STOR</code> (déposer), <code>QUIT</code>.</li>
      <li>Client graphique courant : <b>FileZilla</b>.</li></ul>
      <div class="note fix"><b>Attention</b>FTP transmet le mot de passe <b>en clair</b>. On lui préfère SFTP (sur SSH) ou FTPS (FTP sur TLS).</div>` },
    { k: 'APPLICATION · ACCÈS DISTANT', t: 'Telnet, SSH et les news', b: `<div class="grid2"><div><h4>Telnet → SSH</h4><p>Telnet permet de se connecter à une machine distante et de l’utiliser <b>comme si on était devant elle</b> (port 23). Tout circule en clair, mot de passe compris.</p><p><b>SSH</b> (port 22) offre le même service, <b>chiffré</b> et authentifié. Il sert aussi au transfert sécurisé (SFTP, SCP).</p><pre class="code">ssh etudiant@serveur.estm.ml</pre></div>
      <div><h4>News (NNTP)</h4><p>Forums de discussion reposant sur <b>NNTP</b> (port 119), hérités de USENET : groupes comme <code>comp.lang.c++</code>. Les forums actuels reposent plutôt sur le Web (HTTP), mais NNTP survit dans les milieux académiques et techniques.</p></div></div>` },
    { k: 'SYNTHÈSE', t: 'Récapitulons', b: `<div class="layers"><div class="layer"><b>Application</b><span>HTTP 80 / HTTPS 443 · SMTP 25/587 · POP3 110 · IMAP 143 · FTP 20/21 · SSH 22 · DNS 53</span></div>

      <p>Passez aux <b>démonstrations</b> pour voir l’encapsulation, la poignée de main TCP et une vraie session SMTP.</p>` }

    { type: 'classify', t: 'Ranger les protocoles dans la pile', c: 'Indiquez la couche de chaque protocole ou technologie.', cats: ['Application', 'Transport', 'Réseau', 'Accès'], items: [['HTTP', 0], ['TCP', 1], ['IP', 2], ['UDP', 1], ['DNS', 0], ['Ethernet', 3], ['SMTP', 0], ['Wi-Fi', 3], ['FTP', 0], ['IMAP', 0], ['ICMP (ping)', 2]], sol: 'ICMP, utilisé par ping, est un protocole de la couche réseau, transporté directement dans IP.' },

    { k: 'HYPERTEXTE', t: 'Hypertexte et navigateur', b: `<p>L’hypertexte désigne la capacité d’inclure dans un document :</p><ul><li>du texte, des images, des sons, des vidéos : bref, du <b>multimédia</b> ;</li><li>des <b>liens non ambigus</b> vers d’autres documents, qui permettent de les trouver et de les ouvrir automatiquement.</li></ul>
      <p>Le format hypertexte standard du Web est <b>HTML</b> (HyperText Markup Language). Le <b>navigateur</b> est l’outil qui affiche les documents et suit les liens.</p>` },
    { k: 'URL', t: 'URL : Uniform Resource Locator', b: `<p>Chaîne de caractères construite selon un standard pour désigner une ressource. Structure générale : <code>protocole:chemin</code>.</p>

schéma   hôte              port  chemin  requête     fragment</pre>

    { k: 'HTML', t: 'HTML : la structure', b: `<p>HTML décrit la <b>structure et le sens</b> du contenu à l’aide de <b>balises</b>.</p>

  &lt;/body&gt;
&lt;/html&gt;</pre>
      <p>Balises sémantiques utiles : <code>header</code>, <code>nav</code>, <code>main</code>, <code>section</code>, <code>article</code>, <code>footer</code>, <code>form</code>, <code>table</code>.</p>` },
    { k: 'CSS', t: 'CSS : la présentation', b: `<p>Les feuilles de style en cascade séparent la <b>forme</b> du <b>fond</b>. Une règle = un <b>sélecteur</b> + des <b>déclarations</b>.</p>
      <pre class="code"><span class="k">h1</span> { color: <span class="s">#0b6a86</span>; font-size: 2rem; }
<span class="k">.intro</span> { background: <span class="s">#fbecd8</span>; padding: 12px; border-radius: 8px; }
<span class="k">#menu a:hover</span> { text-decoration: underline; }</pre>
      <ul><li>Sélecteurs : balise (<code>p</code>), classe (<code>.intro</code>), identifiant (<code>#menu</code>), pseudo-classe (<code>:hover</code>).</li><li><b>Cascade</b> : en cas de conflit, la règle la plus spécifique, puis la plus tardive, l’emporte.</li><li><b>Modèle de boîte</b> : contenu + padding + bordure + margin. Mise en page avec <b>flexbox</b> et <b>grid</b>.</li></ul>` },
    { k: 'JAVASCRIPT', t: 'JavaScript : le comportement', b: `<p>JavaScript s’exécute dans le navigateur et manipule la page via le <b>DOM</b> (Document Object Model).</p>

    { k: 'XML', t: 'XML : des données structurées', b: `<ul><li>Langage standard (<b>recommandation W3C</b>) pour définir des données structurées.</li><li>Un fichier XML est un <b>fichier texte</b> au format particulier, structuré en <b>éléments</b> à l’aide de <b>balises</b> : <code>&lt;unelement&gt;contenu&lt;/unelement&gt;</code>.</li><li>La balise ouvrante peut porter des <b>attributs</b> : <code>&lt;unelement attr="valeur"&gt;</code>.</li></ul>

    { k: 'XML', t: 'XML bien formé et XML vs HTML', b: `<p>Un document XML est <b>bien formé</b> s’il respecte ces règles :</p>

    { k: 'HTTP', t: 'Le protocole HTTP', b: `<p>Le client envoie une <b>requête</b>, le serveur renvoie une <b>réponse</b>. HTTP est <b>sans état</b>.</p>

&lt;!DOCTYPE html&gt;…</pre></div>

    { k: 'HTTP', t: 'Codes de statut et versions', b: `<div class="tw"><table class="t"><tr><th>Famille</th><th>Sens</th><th>Exemples</th></tr>

    { k: 'SERVEURS', t: 'Serveurs web', b: `<p>Un serveur web écoute sur les ports 80/443, reçoit les requêtes HTTP et renvoie des ressources.</p>

COURSES.push({
  id: 'securite', num: '04', short: 'Sécurité', title: 'Sécurité : TLS, pare-feu et VPN',
  lead: 'Sur l’Internet, tout paquet peut être lu ou modifié. On voit les menaces, la cryptographie qui y répond, TLS et HTTPS, les certificats (PKI), puis les pare-feu et les VPN.',
  objectives: ['Identifier les menaces sur IP', 'Distinguer chiffrement symétrique et asymétrique', 'Décrire une poignée de main TLS', 'Écrire des règles de pare-feu', 'Expliquer le rôle d’un VPN'],
  slides: [
    { k: 'MENACES', t: 'Une hypothèse réaliste', b: `<p style="font-size:1.1em"><b>Tout paquet IP peut être corrompu par une personne malveillante.</b></p>
      <p>Conséquences :</p><ul><li><b>HTTP</b> : la page web affichée peut ne pas être celle envoyée par le serveur ;</li><li><b>HTTP, FTP</b> : le fichier téléchargé peut être corrompu (virus) ;</li><li><b>DNS</b> : l’adresse IP avec laquelle vous communiquez peut ne pas correspondre au nom demandé (empoisonnement DNS) ;</li><li>et les mots de passe envoyés en clair peuvent être lus (Telnet, FTP, HTTP).</li></ul>
      <div class="note"><b>Exemple concret</b>Sur un Wi-Fi public non chiffré, un voisin équipé d’un analyseur de trafic (Wireshark) peut lire un formulaire envoyé en HTTP.</div>` },
    { k: 'OBJECTIFS', t: 'Ce que la sécurité doit garantir', b: `<div class="grid2">
      <div class="note"><b>Confidentialité</b>Seul le destinataire peut lire. → chiffrement</div><div class="note"><b>Intégrité</b>Le message n’a pas été modifié. → empreinte (hachage), MAC</div>
      <div class="note"><b>Authentification</b>On parle bien à la bonne personne / au bon serveur. → certificats, mots de passe</div><div class="note"><b>Disponibilité</b>Le service reste accessible. → protection contre le déni de service (DDoS)</div></div>
      <p>On ajoute souvent la <b>non-répudiation</b> : l’auteur ne peut pas nier avoir envoyé (signature numérique).</p>` },
    { k: 'SOLUTIONS', t: 'Sécuriser chaque couche', b: `<p>Il appartient aux participants (couches supérieures) d’un protocole basé sur IP d’assurer la sécurité de leur conversation. La plupart des protocoles classiques ont désormais une <b>version sécurisée</b> :</p>
      <ul><li><b>IPsec</b> : sécurité au niveau <b>réseau</b> (utilisé par de nombreux VPN).</li><li><b>SSL / TLS</b> : sécurité au niveau <b>transport</b>.</li><li><b>HTTPS</b> : HTTP au-dessus d’une liaison TLS. Même principe pour POP3S, IMAPS, SMTPS.</li><li><b>SSH, SFTP</b> : versions sécurisées de Telnet et FTP (mais pas basées sur TLS).</li></ul>
      <div class="note fix"><b>Précision</b>Le support écrit que TLS « remplace TCP ». Plus exactement, TLS <b>s’insère entre TCP et l’application</b> : HTTPS = HTTP → TLS → TCP → IP. (DTLS et QUIC appliquent la même idée au-dessus d’UDP.) SSL est l’ancêtre de TLS ; toutes ses versions sont aujourd’hui obsolètes.</div>` },
    { k: 'CRYPTOGRAPHIE', t: 'Chiffrement symétrique', b: `<p>Une <b>même clé secrète</b> sert à chiffrer et à déchiffrer.</p>

    { k: 'CRYPTOGRAPHIE', t: 'Chiffrement asymétrique (à clé publique)', b: `<p>Chaque personne possède une <b>paire de clés</b> : une <b>clé publique</b> (diffusée à tous) et une <b>clé privée</b> (gardée secrète).</p>

      <p>Algorithmes : <b>RSA</b>, courbes elliptiques (ECDSA, X25519). Plus lent que le symétrique.</p>
      <div class="note"><b>Solution hybride (TLS)</b>On utilise l’asymétrique pour <b>s’authentifier et convenir d’une clé de session</b>, puis le symétrique (AES) pour chiffrer les données.</div>` },
    { k: 'PKI', t: 'Certificats et infrastructure à clés publiques', b: `<p>Comment être sûr qu’une clé publique appartient bien à <code>www.banque.ml</code> ? Grâce à un <b>certificat</b> X.509, signé par une <b>autorité de certification</b> (AC / CA).</p>

      <p>Le certificat contient : le nom du domaine, la clé publique, l’émetteur, les dates de validité, la signature de l’AC. Le navigateur vérifie cette <b>chaîne de confiance</b> ; en cas d’échec, il affiche un avertissement.</p>

    { k: 'TLS', t: 'La poignée de main TLS 1.3 (simplifiée)', b: `<ol><li><b>ClientHello</b> : versions et algorithmes supportés + part de clé du client.</li><li><b>ServerHello</b> : choix de l’algorithme + part de clé du serveur. Les deux calculent la même <b>clé de session</b> (échange Diffie-Hellman).</li><li>Le serveur envoie son <b>certificat</b> et une preuve qu’il possède la clé privée correspondante.</li><li>Le client <b>vérifie</b> le certificat (chaîne de confiance, nom, dates).</li><li><b>Finished</b> des deux côtés, puis échange des données chiffrées en AES ou ChaCha20.</li></ol>

    { k: 'PARE-FEU', t: 'Les pare-feu (firewalls)', b: `<p>Un pare-feu filtre le trafic entre zones de confiance différentes selon des <b>règles</b> examinées <b>dans l’ordre</b> ; la première qui correspond s’applique.</p>

    { k: 'VPN', t: 'Les VPN (réseaux privés virtuels)', b: `<p>Un VPN crée un <b>tunnel chiffré</b> à travers l’Internet entre deux points.</p>

    { k: 'SÉCURITÉ', t: 'Authentification : clés, jetons, OAuth 2.0', b: `<ul><li><b>Clé d’API</b> : identifiant secret de l’application, envoyé dans un en-tête (<code>X-API-Key</code>).</li><li><b>Jeton porteur</b> (Bearer token) : <code>Authorization: Bearer eyJhbGciOi…</code>, souvent un <b>JWT</b> (JSON Web Token) signé et à durée limitée.</li><li><b>OAuth 2.0</b> : l’utilisateur autorise une application à agir <b>en son nom</b> sur une plateforme, <b>sans lui donner son mot de passe</b>. L’application reçoit un jeton limité à certaines permissions (<b>scopes</b>).</li></ul>

    { k: 'RÉSEAUX SOCIAUX', t: 'Les API des plateformes sociales', b: `<p>Les plateformes (Meta, X, LinkedIn, YouTube, TikTok…) exposent des API pour :</p>

      <p>Contraintes : création d’un compte développeur et d’une application, <b>validation</b> des permissions, <b>limites de débit</b> (rate limiting → 429), conditions d’utilisation et protection des données personnelles. Elles changent souvent : toujours lire la documentation officielle à jour.</p>` },
    { k: 'ÉCOSYSTÈME', t: 'Documenter et tester une API', b: `<ul><li><b>OpenAPI</b> (ex-Swagger) : description standard d’une API en YAML/JSON, qui génère une documentation interactive.</li><li>Outils de test : <b>Postman</b>, Insomnia, ou la ligne de commande :</li></ul>

    { type: 'match', t: 'Prédire le code de réponse', c: 'Quel code l’API devrait-elle renvoyer ?', pairs: [['POST d’un nouvel étudiant valide', '201'], ['GET /api/etudiants/999 (n’existe pas)', '404'], ['DELETE réussi', '204'], ['POST avec un JSON mal formé', '400'], ['Appel sans jeton sur une route protégée', '401'], ['Plus de 100 requêtes par minute', '429']], extra: ['302'], sol: '201 création, 204 suppression sans corps, 400 requête invalide, 401 non authentifié, 404 introuvable, 429 trop de requêtes.' },
    {
      type: 'custom', t: 'TP · Écrire un JSON valide', c: 'Écrivez l’objet JSON d’un étudiant avec : <code>id</code> (nombre), <code>nom</code> et <code>prenom</code> (chaînes), <code>boursier</code> (booléen), <code>notes</code> (tableau d’au moins 2 nombres) et <code>adresse</code> (objet contenant <code>ville</code>).',
      render(zone, api) {
        zone.innerHTML = `<textarea class="in" rows="9" spellcheck="false"></textarea><ul class="small" style="list-style:none;padding:0;margin:0"></ul>`;
        const ta = $('textarea', zone); ta.value = "{\n  id: 12,\n  'nom': 'Coulibaly',\n  \"notes\": [14, 16,],\n}";
        api.addBtns(() => {
          let o; try { o = JSON.parse(ta.value); } catch (e) { $('ul', zone).innerHTML = ''; api.fb.innerHTML = `<div class="fb bad"><b>JSON invalide :</b> ${esc(e.message)}. Rappel : clés et chaînes entre guillemets doubles, pas de virgule finale.</div>`; return; }
          const ck = [['id est un nombre', typeof o.id === 'number'], ['nom et prenom sont des chaînes', typeof o.nom === 'string' && typeof o.prenom === 'string'], ['boursier est un booléen', typeof o.boursier === 'boolean'], ['notes est un tableau d’au moins 2 nombres', Array.isArray(o.notes) && o.notes.length >= 2 && o.notes.every(n => typeof n === 'number')], ['adresse est un objet avec ville', o.adresse && typeof o.adresse === 'object' && !Array.isArray(o.adresse) && typeof o.adresse.ville === 'string']];
          $('ul', zone).innerHTML = ck.map(([l, ok]) => `<li><span class="mark ${ok ? 'ok' : 'bad'}">${ok ? '✓' : '✗'}</span> ${l}</li>`).join('');
          api.report(ck.filter(c => c[1]).length, ck.length);
        }, () => { ta.value = '{\n  "id": 12,\n  "nom": "Coulibaly",\n  "prenom": "Fanta",\n  "boursier": true,\n  "notes": [14, 16],\n  "adresse": { "ville": "Sikasso" }\n}'; });
      }, sol: 'Les erreurs du départ : clé <code>id</code> sans guillemets, guillemets simples, virgules finales.'
    }
  ],
  quiz: [

    { q: 'Lequel est un JSON valide ?', o: ["{'nom': 'Awa'}", '{"nom": "Awa",}', '{"nom": "Awa", "age": 21}', '{nom: "Awa"}'], a: 2, e: 'Guillemets doubles obligatoires, pas de virgule finale.' },
    { q: 'Quel code signale qu’on a dépassé la limite de requêtes ?', o: ['403', '404', '429', '500'], a: 2, e: '429 Too Many Requests.' },
    { q: 'À quoi sert OAuth 2.0 ?', o: ['À chiffrer le disque', 'À permettre à une application d’agir au nom d’un utilisateur sans connaître son mot de passe', 'À compresser le JSON', 'À remplacer DNS'], a: 1, e: 'L’application reçoit un jeton limité à des permissions (scopes).' },
    { q: 'Où place-t-on habituellement un jeton porteur ?', o: ['Dans l’URL', 'Dans l’en-tête Authorization: Bearer …', 'Dans le nom de domaine', 'Dans un cookie tiers obligatoirement'], a: 1, e: 'Jamais dans l’URL, qui finit dans les journaux et l’historique.' },
    { q: 'Qu’est-ce qu’un webhook ?', o: ['Un pirate du Web', 'Un appel HTTP que la plateforme envoie à votre serveur quand un événement survient', 'Un type de câble', 'Un format d’image'], a: 1, e: 'Plutôt que d’interroger sans cesse, on est prévenu.' }
  ],
  recap: `<h3>Fiche récap · API REST</h3>
    <ul><li><b>API</b> = contrat entre programmes ; API web = sur HTTP.</li>
    <li><b>REST</b> (Fielding, 2000) : client-serveur, sans état, cache, interface uniforme (ressources + URI + méthodes + représentations), système en couches.</li>
    <li><b>URI</b> : noms au pluriel (<code>/api/etudiants/42</code>), sous-ressources, filtres en requête. <b>CRUD</b> : POST / GET / PUT-PATCH / DELETE.</li>
    <li><b>Codes</b> : 200, 201, 204, 400, 401, 403, 404, 405, 429, 500.</li>
    <li><b>JSON</b> : objets, tableaux, chaînes en guillemets doubles, nombres, booléens, null ; pas de virgule finale.</li>
    <li><b>Authentification</b> : clé d’API, jeton Bearer (JWT), OAuth 2.0 avec scopes.</li>
    <li><b>Plateformes sociales</b> : publication, statistiques, connexion sociale, webhooks ; compte développeur, limites de débit, données personnelles.</li></ul>`

/* ===================== Questions à développement (examen blanc) ===================== */
DEV_QUESTIONS.push(
  { q: 'Expliquez les différences entre TCP et UDP, et donnez pour chacun deux applications adaptées en justifiant.', model: 'TCP est orienté connexion (poignée de main SYN / SYN-ACK / ACK), fiable (numéros de séquence, accusés, retransmission), ordonné, avec contrôle de flux et de congestion. UDP est sans connexion, n’ajoute à IP que les ports et une somme de contrôle : plus léger et plus rapide, sans garantie. TCP : Web, courriel, transfert de fichiers, SSH (chaque octet compte). UDP : DNS (requête courte), VoIP, visioconférence, jeux (la fraîcheur prime sur l’exhaustivité).', crit: [['Connexion vs sans connexion (handshake)', 0.5], ['Fiabilité : séquence, ACK, retransmission pour TCP', 0.75], ['UDP : ports + checksum, léger, rapide', 0.5], ['Deux exemples justifiés pour chacun', 0.75]] },
  { q: 'Décrivez les étapes de la résolution DNS du nom www.estm.ml par un navigateur dont le cache est vide.', model: 'Le poste interroge son résolveur (souvent celui du FAI). Le résolveur, sans cache, interroge un serveur racine, qui le renvoie vers les serveurs du TLD .ml. Ceux-ci le renvoient vers les serveurs faisant autorité pour estm.ml (enregistrement NS, ex. ns1.ti.ml). Le serveur faisant autorité répond avec l’enregistrement A (192.168.0.200). Le résolveur met la réponse en cache (durée TTL) et la transmet au poste, qui peut alors ouvrir la connexion HTTP.', crit: [['Rôle du résolveur / cache du FAI', 0.5], ['Racine → TLD .ml → serveur faisant autorité', 1], ['Réponse : enregistrement A avec l’adresse IP', 0.5], ['Mise en cache et notion d’autorité', 0.5]] },
  { q: 'Expliquez comment HTTPS protège un échange entre un navigateur et un site bancaire. Pourquoi utilise-t-on à la fois du chiffrement asymétrique et symétrique ?', model: 'HTTPS = HTTP au-dessus de TLS, lui-même au-dessus de TCP. Lors de la poignée de main TLS, client et serveur conviennent des algorithmes et calculent une clé de session (Diffie-Hellman) ; le serveur présente un certificat X.509 signé par une autorité de certification, que le navigateur vérifie (chaîne de confiance, nom, dates) : c’est l’authentification. Ensuite les données sont chiffrées en symétrique (AES) et leur intégrité est contrôlée. L’asymétrique permet l’authentification et l’accord de clé sans secret préalable, mais il est lent ; le symétrique est rapide pour les données.', crit: [['Position de TLS dans la pile (HTTP / TLS / TCP)', 0.5], ['Certificat, autorité de certification, vérification', 0.75], ['Clé de session puis chiffrement symétrique', 0.75], ['Justification : asymétrique lent / pas de secret partagé', 0.5]] },
  { q: 'Comparez les modèles IaaS, PaaS et SaaS en précisant qui gère quoi, avec un exemple pour chacun.', model: 'IaaS : le fournisseur gère matériel, réseau, virtualisation ; le client gère OS, middleware, applications, données (ex. AWS EC2, Azure VM). PaaS : le fournisseur gère aussi OS et environnement d’exécution ; le client déploie son code et gère ses données (ex. Google App Engine, Azure App Service, Heroku). SaaS : le fournisseur gère tout le logiciel ; le client l’utilise et gère ses données et réglages (ex. Gmail, Microsoft 365). Plus on monte, moins on gère, moins on a de contrôle.', crit: [['IaaS correctement défini + exemple', 0.75], ['PaaS correctement défini + exemple', 0.75], ['SaaS correctement défini + exemple', 0.75], ['Idée de compromis contrôle / simplicité ou responsabilité partagée', 0.25]] },
  { q: 'Une coopérative maraîchère veut surveiller l’humidité de 20 parcelles et déclencher l’irrigation. Proposez une architecture IoT et justifiez le choix du protocole applicatif.', model: 'Capteurs d’humidité sur pile dans chaque parcelle, reliés en LoRaWAN (longue portée, faible consommation) à une passerelle connectée en 4G. La passerelle publie en MQTT vers un broker (cloud) sur des sujets comme cooperative/parcelleN/humidite (QoS 0 pour les mesures). Le tableau de bord s’abonne à cooperative/+/humidite ; l’automate de pompe s’abonne à cooperative/+/pompe/commande (QoS 1 ou 2). MQTT : léger, découplage pub/sub, plusieurs consommateurs, Last Will pour détecter un capteur hors ligne. Sécurité : TLS (8883), identifiants par appareil, ACL.', crit: [['Architecture : capteurs → passerelle → broker/cloud → application', 0.75], ['Choix radio justifié (LoRaWAN ou NB-IoT)', 0.5], ['MQTT justifié (pub/sub, léger, sujets, jokers)', 0.75], ['Sécurité ou QoS / Last Will', 0.5]] },
  { q: 'Concevez l’API REST d’une gestion d’inscriptions (étudiants et cours) : URI, méthodes, codes de retour, et format des données.', model: 'Ressources : /api/etudiants, /api/etudiants/{id}, /api/cours, /api/cours/{code}, /api/etudiants/{id}/inscriptions. GET pour lister / lire (200, 404 si absent), POST pour créer (201 + Location, 400 si données invalides), PUT / PATCH pour modifier (200), DELETE pour supprimer (204). Échanges en JSON (Content-Type: application/json), ex. {"id":42,"nom":"Traoré","prenom":"Awa"}. Authentification par jeton Bearer (401 sinon, 403 si droits insuffisants). API sans état ; pagination ?page=2.', crit: [['URI en noms au pluriel, identifiant dans le chemin', 0.75], ['Méthodes HTTP ↔ CRUD', 0.5], ['Codes de retour adaptés (201, 204, 400, 404…)', 0.75], ['JSON et authentification par jeton', 0.5]] }
);

      if (st === 5) rows.splice(0, rows.length, `<div class="enc-row"><div class="h-eth" style="opacity:.35;text-decoration:line-through">Ethernet</div><div class="h-ip" style="opacity:.35;text-decoration:line-through">IP</div><div class="h-tcp" style="opacity:.35;text-decoration:line-through">TCP</div>${data}</div>`);
